<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum World v7 FIX</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
canvas{
    border:1px solid #222;
    image-rendering: pixelated;
}
</style>
</head>
<body>

<canvas id="c" width="240" height="240"></canvas>

<script>

const W=240,H=240;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], velocity=[];

// 🌱 INIT (canlı başlat)
for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=0.4 + Math.random()*0.2; // 🔥 kritik FIX
        velocity[y][x]=0;
    }
}

function step(){

    let next=[];

    for(let y=0;y<H;y++){
        next[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            let v=field[y][x];

            // 🌊 stronger diffusion
            let force=(avg - v) * 0.35;

            velocity[y][x]=(velocity[y][x] + force) * 0.90;

            // 🔥 LIFE INJECTION (KRİTİK)
            velocity[y][x] += (Math.random()-0.5)*0.03;

            v += velocity[y][x];

            // ❌ no hard collapse anymore
            v = Math.max(0.05, Math.min(0.95, v));

            next[y][x]=v;
        }
    }

    field=next;
}

function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];

            let r = v * 180;
            let g = v * 220;
            let b = 255 - v * 180;

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
