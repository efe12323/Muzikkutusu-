<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D Engine v8.0 - Physics & Dual Hand</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 10px;
            background: rgba(0,0,0,0.75); border-bottom: 2px solid var(--jarvis-green);
        }

        .btn-group { display: flex; gap: 5px; }
        .btn {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 8px 12px; font-size: 11px;
            text-transform: uppercase; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 15px var(--jarvis-glow); }
        .physics-active { border-color: #ffde00; color: #ffde00; }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-cube">Cube</div>
            <div class="btn" id="mode-sphere">Sphere</div>
            <div class="btn" id="mode-pyram">Pyra</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-physics">Gravity: ON</div>
            <div class="btn" id="btn-ar">AR</div>
            <div class="btn" id="btn-undo">Undo</div>
            <div class="btn" id="btn-clear">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, physicsEnabled = true;
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShapes = [null, null]; // İki el için ayrı tutma kontrolü

        const GRAVITY = 0.5;
        const BOUNCE = 0.7;
        const FLOOR_Y = window.innerHeight - 20;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') { arMode = !arMode; video.style.display = arMode ? "block" : "none"; return; }
            if(mode === 'physics') { 
                physicsEnabled = !physicsEnabled; 
                document.getElementById('btn-physics').textContent = `Gravity: ${physicsEnabled ? 'ON' : 'OFF'}`;
                return;
            }
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) b.classList.toggle('active', b.id === 'mode-' + mode);
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((lm, index) => {
                    const x = lm[8].x * canvas.width;
                    const y = lm[8].y * canvas.height;
                    const tx = lm[4].x * canvas.width;
                    const ty = lm[4].y * canvas.height;

                    const isPinching = Math.hypot(x - tx, y - ty) < 45;

                    if (isPinching) {
                        if (!grabbedShapes[index]) {
                            for (let i = drawings.length - 1; i >= 0; i--) {
                                if (checkHit(x, y, drawings[i])) { 
                                    grabbedShapes[index] = drawings[i]; 
                                    grabbedShapes[index].isPhysicsPaused = true;
                                    break; 
                                }
                            }
                        } else {
                            // Blender tarzı taşıma
                            const s = grabbedShapes[index];
                            const dx = x - (s.start?.x || s.points?.[0].x);
                            const dy = y - (s.start?.y || s.points?.[0].y);
                            
                            if (s.type === 'draw') {
                                s.points.forEach(p => { p.x += dx * 0.1; p.y += dy * 0.1; });
                            } else {
                                s.start.x = x; s.start.y = y;
                                s.vx = 0; s.vy = 0; // Tutarken hızı sıfırla
                            }
                        }
                    } else {
                        if(grabbedShapes[index]) grabbedShapes[index].isPhysicsPaused = false;
                        grabbedShapes[index] = null;

                        // Tek el çizim modu (İşaret parmağı yukarıda, orta parmak kapalı)
                        if (lm[8].y < lm[6].y && lm[12].y > lm[10].y) {
                            if (currentMode === 'draw') {
                                if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f', vx:0, vy:0 }; drawings.push(tempShape); }
                                tempShape.points.push({ x, y });
                            } else {
                                if (!startPoint) startPoint = { x, y };
                                tempShape = { 
                                    type: currentMode, 
                                    start: {x, y}, 
                                    w: 60, h: 60, 
                                    color: '#00ff9f',
                                    vx: 0, vy: 0,
                                    isPhysicsPaused: false 
                                };
                            }
                        } else {
                            if (tempShape) {
                                if(currentMode !== 'draw') drawings.push(tempShape);
                                tempShape = null; startPoint = null;
                            }
                        }
                    }
                    drawCyberHand(lm, isPinching);
                });
            }

            updatePhysics();
            renderDrawings();
            ctx.restore();
        }

        function updatePhysics() {
            if (!physicsEnabled) return;

            drawings.forEach(s => {
                if (s.isPhysicsPaused || s.type === 'draw') return;

                s.vy += GRAVITY;
                s.start.y += s.vy;
                s.start.x += s.vx;

                // Yerle temas kontrolü (Sektirme)
                let bottom = s.type === 'sphere' ? s.start.y + s.w/2 : s.start.y + s.h;
                if (bottom > FLOOR_Y) {
                    s.start.y = s.type === 'sphere' ? FLOOR_Y - s.w/2 : FLOOR_Y - s.h;
                    s.vy *= -BOUNCE;
                    // Sürtünme
                    s.vx *= 0.95;
                }
            });
        }

        function checkHit(x, y, s) {
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < 30);
            if (s.type === 'sphere') return Math.hypot(s.start.x - x, s.start.y - y) < s.w;
            return x > s.start.x - 20 && x < s.start.x + s.w + 20 && y > s.start.y - 20 && y < s.start.y + s.h + 20;
        }

        function drawFace(pts, color) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "rgba(0, 255, 159, 0.3)";
            ctx.stroke();
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                const {x, y} = s.start || {x:0, y:0};
                const w = s.w || 60, h = s.h || 60;

                if (s.type === 'draw') {
                    ctx.beginPath();
                    ctx.strokeStyle = s.color; ctx.lineWidth = 3;
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'cube') {
                    const d = 20;
                    drawFace([{x:x, y:y}, {x:x+w, y:y}, {x:x+w, y:y+h}, {x:x, y:y+h}], "rgba(0, 255, 159, 0.4)");
                    drawFace([{x:x, y:y}, {x:x+d, y:y-d}, {x:x+w+d, y:y-d}, {x:x+w, y:y}], "rgba(0, 200, 130, 0.6)");
                } else if (s.type === 'sphere') {
                    let grad = ctx.createRadialGradient(x-10, y-10, 5, x, y, w/2);
                    grad.addColorStop(0, '#00ff9f');
                    grad.addColorStop(1, '#004422');
                    ctx.beginPath(); ctx.arc(x, y, w/2, 0, Math.PI*2);
                    ctx.fillStyle = grad; ctx.fill();
                } else if (s.type === 'pyram') {
                    const top = { x: x + w/2, y: y - h };
                    drawFace([{x:x, y:y}, {x:x+w, y:y}, {x:top.x, y:top.y}], "rgba(0, 255, 159, 0.5)");
                }
            });
        }

        function drawCyberHand(lm, isPinching) {
            drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: isPinching ? '#ff4b2b' : '#00ff9f', lineWidth: 2});
            drawLandmarks(ctx, lm, {color: '#ffffff', lineWidth: 1, radius: 2});
        }

        // Event Listeners for UI
        document.getElementById('mode-draw').onclick = () => setMode('draw');
        document.getElementById('mode-cube').onclick = () => setMode('cube');
        document.getElementById('mode-sphere').onclick = () => setMode('sphere');
        document.getElementById('mode-pyram').onclick = () => setMode('pyram');
        document.getElementById('btn-physics').onclick = () => setMode('physics');
        document.getElementById('btn-ar').onclick = () => setMode('ar');
        document.getElementById('btn-undo').onclick = () => setMode('undo');
        document.getElementById('btn-clear').onclick = () => setMode('clear');

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
    </script>
</body>
</html>
