<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Pro-Render v8.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-red: #ff4b2b; --jarvis-glow: #00ff41; --dark-bg: #030803; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Orbitron', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 10px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .btn-group { display: flex; gap: 5px; }
        .btn {
            background: rgba(0, 40, 20, 0.6); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 7px 12px; font-size: 10px;
            text-transform: uppercase; border-radius: 4px; font-weight: bold; transition: 0.3s;
            letter-spacing: 1px; backdrop-filter: blur(5px);
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 15px var(--jarvis-glow); }
        .btn.gen-mode { border-color: #ff00ff; color: #ff00ff; }
        .btn.gen-active { background: #ff00ff; color: #fff; box-shadow: 0 0 20px #ff00ff; }
        #status { position: absolute; bottom: 15px; left: 15px; color: var(--jarvis-green); font-size: 10px; z-index: 10; font-family: monospace; }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>
    <div id="status">SYS_STATUS: OPTIMIZED // HAND_STABILIZER: ACTIVE</div>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-cube">Cube</div>
            <div class="btn" id="mode-pyram">Pyra</div>
            <div class="btn" id="mode-cyl">Cylin</div>
        </div>
        <div class="btn-group">
            <div class="btn gen-mode" id="btn-gen">GEN</div>
            <div class="btn" id="btn-ar">AR</div>
            <div class="btn" id="btn-undo">Undo</div>
            <div class="btn" id="btn-clear">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, genMode = false;
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShape = null, lastGrabPoint = null;
        let lastHoverId = null, hoverStartTime = 0;

        // Yumuşatma (Smoothing) için değişkenler
        let smoothX = 0, smoothY = 0;
        const smoothingFactor = 0.35; 

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') { arMode = !arMode; video.style.display = arMode ? "block" : "none"; return; }
            if(mode === 'gen') { genMode = !genMode; document.getElementById('btn-gen').classList.toggle('gen-active', genMode); return; }
            tempShape = null; startPoint = null; currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) b.classList.toggle('active', b.id === 'mode-' + mode);
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const index = lm[8], thumb = lm[4];
                
                // Low-pass filter ile el hareketini yumuşat
                const targetX = index.x * canvas.width;
                const targetY = index.y * canvas.height;
                smoothX += (targetX - smoothX) * smoothingFactor;
                smoothY += (targetY - smoothY) * smoothingFactor;

                const tx = thumb.x * canvas.width;
                const ty = thumb.y * canvas.height;

                handleMenuHover(index);

                // Tutma Hassasiyeti (Pinch)
                const isPinching = Math.hypot(smoothX - tx, smoothY - ty) < 45;

                if (isPinching) {
                    tempShape = null; // Taşıma sırasında çizimi iptal et
                    if (!grabbedShape) {
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(smoothX, smoothY, drawings[i])) { 
                                grabbedShape = drawings[i]; 
                                lastGrabPoint = {x: smoothX, y: smoothY}; 
                                break; 
                            }
                        }
                    } else {
                        const dx = smoothX - lastGrabPoint.x, dy = smoothY - lastGrabPoint.y;
                        if (grabbedShape.type === 'draw') grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                        else { grabbedShape.start.x += dx; grabbedShape.start.y += dy; grabbedShape.end.x += dx; grabbedShape.end.y += dy; }
                        lastGrabPoint = {x: smoothX, y: smoothY};
                    }
                } else {
                    grabbedShape = null;
                    // Yazma/Çizme Hassasiyeti: Sadece işaret parmağı havadayken ve orta parmak kapalıyken
                    const isWriting = index.y < lm[6].y && lm[12].y > lm[10].y;
                    
                    if (isWriting && !isPinching) {
                        if (currentMode === 'draw') {
                            if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f' }; drawings.push(tempShape); }
                            tempShape.points.push({ x: smoothX, y: smoothY });
                        } else {
                            if (!startPoint) startPoint = { x: smoothX, y: smoothY };
                            tempShape = { type: currentMode, start: {...startPoint}, end: { x: smoothX, y: smoothY }, color: '#00ff9f' };
                        }
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null; startPoint = null;
                    }
                }
                drawRealisticHand(lm, isPinching);
            }
            renderDrawings();
            ctx.restore();
        }

        function checkHit(x, y, s) {
            const m = 65;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            return x > Math.min(s.start.x, s.end.x)-m && x < Math.max(s.start.x, s.end.x)+m && y > Math.min(s.start.y, s.end.y)-m && y < Math.max(s.start.y, s.end.y)+m;
        }

        function drawFace(pts, color) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if(!genMode) { ctx.strokeStyle = "rgba(0, 255, 159, 0.3)"; ctx.lineWidth = 1; ctx.stroke(); }
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                const w = (s.end?.x - s.start?.x) || 0, h = (s.end?.y - s.start?.y) || 0;
                const d = 35; 

                ctx.save();
                if(s === grabbedShape) { ctx.shadowBlur = 20; ctx.shadowColor = "#fff"; }

                if (s.type === 'draw') {
                    ctx.beginPath(); ctx.strokeStyle = s.color; ctx.lineWidth = 3; ctx.lineCap = 'round';
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'cube') {
                    const b = s.start;
                    drawFace([{x:b.x+d, y:b.y-d}, {x:b.x+w+d, y:b.y-d}, {x:b.x+w+d, y:b.y+h-d}, {x:b.x+d, y:b.y+h-d}], genMode ? "#222" : "rgba(40,40,40,0.4)");
                    drawFace([{x:b.x, y:b.y}, {x:b.x+d, y:b.y-d}, {x:b.x+d, y:b.y+h-d}, {x:b.x, y:b.y+h}], genMode ? "#444" : "rgba(70,70,70,0.4)");
                    drawFace([{x:b.x, y:b.y}, {x:b.x+w, y:b.y}, {x:b.x+w+d, y:b.y-d}, {x:b.x+d, y:b.y-d}], genMode ? "#666" : "rgba(100,100,100,0.4)");
                    drawFace([{x:b.x, y:b.y}, {x:b.x+w, y:b.y}, {x:b.x+w, y:b.y+h}, {x:b.x, y:b.y+h}], genMode ? "#888" : "rgba(140,140,140,0.5)");
                } else if (s.type === 'pyram') {
                    const top = { x: s.start.x + w/2, y: s.start.y - h };
                    drawFace([{x:s.start.x, y:s.start.y}, {x:s.start.x+w, y:s.start.y}, {x:s.start.x+w+20, y:s.start.y-20}, {x:s.start.x+20, y:s.start.y-20}], "#333");
                    drawFace([{x:s.start.x, y:s.start.y}, {x:top.x, y:top.y}, {x:s.start.x+w, y:s.start.y}], "#777");
                    drawFace([{x:s.start.x+w, y:s.start.y}, {x:top.x, y:top.y}, {x:s.start.x+w+20, y:s.start.y-20}], "#555");
                } else if (s.type === 'cyl') {
                    const r = Math.abs(w/2);
                    ctx.beginPath(); ctx.ellipse(s.start.x+r, s.start.y, r, 10, 0, 0, Math.PI*2); ctx.fillStyle="#444"; ctx.fill();
                    ctx.fillStyle = genMode ? "#666" : "rgba(100,100,100,0.4)";
                    ctx.fillRect(s.start.x, s.start.y-h, r*2, h);
                    ctx.beginPath(); ctx.ellipse(s.start.x+r, s.start.y-h, r, 10, 0, 0, Math.PI*2); ctx.fillStyle="#999"; ctx.fill();
                }
                ctx.restore();
            });
        }

        function handleMenuHover(index) {
            const mx = (1 - index.x) * canvas.width, my = index.y * canvas.height;
            let h = null;
            document.querySelectorAll('.btn').forEach(b => {
                const r = b.getBoundingClientRect();
                if (mx > r.left && mx < r.right && my > r.top && my < r.bottom) h = b;
            });
            if (h) {
                if (lastHoverId === h.id) { if (Date.now() - hoverStartTime > 600) { setMode(h.id.replace('mode-','').replace('btn-','')); hoverStartTime = Date.now() + 1500; } h.classList.add('hovering'); }
                else { lastHoverId = h.id; hoverStartTime = Date.now(); }
            } else { document.querySelectorAll('.btn').forEach(b => b.classList.remove('hovering')); lastHoverId = null; }
        }

        function drawRealisticHand(landmarks, isGrabbing) {
            const color = isGrabbing ? '#ff4b2b' : '#00ff9f';
            // Bağlantılar (Glow effect)
            ctx.shadowBlur = 10; ctx.shadowColor = color;
            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: color, lineWidth: 3});
            
            // Eklemler
            landmarks.forEach((p, i) => {
                const isTip = [4, 8, 12, 16, 20].includes(i);
                ctx.fillStyle = isTip ? color : '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, isTip ? 6 : 2, 0, Math.PI * 2);
                ctx.fill();
                if(isTip) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
            });
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.85, minTrackingConfidence: 0.85 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
    </script>
</body>
</html>
