<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Inspired Tree</title>
<style>
body{
    background:#111;
    color:white;
    text-align:center;
    font-family:Arial;
}
canvas{
    border:1px solid white;
    margin-top:15px;
}
button{
    padding:10px 20px;
    font-size:18px;
}
</style>
</head>
<body>

<h2>Quantum Inspired Tree Generator</h2>

<button onclick="collapseUniverse()">
Evreni Çökert
</button>

<p id="info"></p>

<canvas id="c" width="700" height="500"></canvas>

<script>

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function createTreeCandidate(){

    return {
        trunkHeight: 60 + Math.random()*180,
        trunkWidth: 10 + Math.random()*25,
        crownRadius: 30 + Math.random()*90
    };
}

function scoreTree(tree){

    let score = 0;

    const ratio = tree.crownRadius / tree.trunkHeight;

    score += 100 - Math.abs(ratio - 0.45) * 120;

    score += 100 - Math.abs(tree.trunkWidth - 18);

    score += Math.random()*20;

    return score;
}

function drawTree(tree){

    ctx.clearRect(0,0,700,500);

    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,700,500);

    ctx.fillStyle="#3f8f3f";
    ctx.fillRect(0,380,700,120);

    const x = 350;

    const trunkY = 380 - tree.trunkHeight;

    ctx.fillStyle="#6b4423";
    ctx.fillRect(
        x-tree.trunkWidth/2,
        trunkY,
        tree.trunkWidth,
        tree.trunkHeight
    );

    const gradient = ctx.createRadialGradient(
        x,
        trunkY,
        5,
        x,
        trunkY,
        tree.crownRadius
    );

    gradient.addColorStop(0,"#7cff7c");
    gradient.addColorStop(1,"#0f5f0f");

    ctx.fillStyle = gradient;

    ctx.beginPath();
    ctx.arc(
        x,
        trunkY,
        tree.crownRadius,
        0,
        Math.PI*2
    );
    ctx.fill();
}

function collapseUniverse(){

    let bestTree = null;
    let bestScore = -999999;

    for(let i=0;i<500;i++){

        const tree = createTreeCandidate();

        const score = scoreTree(tree);

        if(score > bestScore){
            bestScore = score;
            bestTree = tree;
        }
    }

    drawTree(bestTree);

    document.getElementById("info").innerHTML =
    "500 olası ağaç değerlendirildi.<br>" +
    "En tutarlı olasılık seçildi.<br>" +
    "Skor: " + bestScore.toFixed(2);
}

collapseUniverse();

</script>

</body>
</html>
