<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field Audio-Visual System</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:500px;
    height:500px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="200" height="200"></canvas>
<button onclick="startAudio()">Sesi Başlat</button>

<script>

const W=200, H=200;

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let field=[];

for(let y=0;y<H;y++){
    field[y]=[];
    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
    }
}

// ---- AUDIO ----
let audioCtx;
let nodes=[];

function startAudio(){

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    for(let i=0;i<30;i++){

        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc.type="sine";

        let freq = 100 + Math.random()*800;
        osc.frequency.value=freq;

        gain.gain.value=0.02;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        nodes.push({osc,gain});
    }
}

// ---- FIELD EVOLUTION ----
function step(){

    let next=[];

    for(let y=0;y<H;y++){
        next[y]=[];

        for(let x=0;x<W;x++){

            let sum=0;
            let count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx, ny=y+dy;

                    if(nx>=0 && ny>=0 && nx<W && ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;
            let self=field[y][x];

            let psi =
                self*0.6 +
                avg*0.4 +
                (Math.random()-0.5)*0.02;

            psi=Math.max(0,Math.min(1,psi));

            next[y][x]=psi;

            // ---- AUDIO LINK ----
            let idx=(x+y)%nodes.length;

            if(nodes[idx]){
                let freq=200 + psi*800;
                nodes[idx].osc.frequency.value=freq;
            }
        }
    }

    field=next;
}

// ---- RENDER ----
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];
            let i=(y*W+x)*4;

            img.data[i]=v*255;
            img.data[i+1]=(v*v)*255;
            img.data[i+2]=(1-v)*255;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
