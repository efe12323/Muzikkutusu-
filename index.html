<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D Render Engine v7.5 - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 6px;
            background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--jarvis-green);
        }

        .btn-group { display: flex; gap: 3px; }
        .btn {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 5px 8px; font-size: 9px;
            text-transform: uppercase; border-radius: 3px; font-weight: bold; transition: 0.2s; cursor: pointer;
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 12px var(--jarvis-glow); }
        .btn.gen-mode { border-color: #ff00ff; color: #ff00ff; }
        .btn.gen-active { background: #ff00ff; color: #fff; box-shadow: 0 0 15px #ff00ff; }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-cube">Cube</div>
            <div class="btn" id="mode-pyram">Pyra</div>
            <div class="btn" id="mode-cyl">Cylin</div>
        </div>
        <div class="btn-group">
            <div class="btn gen-mode" id="btn-gen">GEN</div>
            <div class="btn" id="btn-ar">AR</div>
            <div class="btn" id="btn-undo">Undo</div>
            <div class="btn" id="btn-clear">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, genMode = false;
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShape = null, lastGrabPoint = null;
        let lastHoverId = null, hoverStartTime = 0;
        
        // Stabilizasyon
        let smoothX = 0, smoothY = 0, smoothTX = 0, smoothTY = 0;
        const lerpAmount = 0.4;
        let lastPinchTime = 0; // İstem dışı çizimi önlemek için zaman damgası

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') { arMode = !arMode; video.style.display = arMode ? "block" : "none"; return; }
            if(mode === 'gen') { genMode = !genMode; document.getElementById('btn-gen').classList.toggle('gen-active', genMode); return; }
            tempShape = null; startPoint = null; currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) b.classList.toggle('active', b.id === 'mode-' + mode);
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                // Koordinat Yumuşatma
                smoothX += (lm[8].x * canvas.width - smoothX) * lerpAmount;
                smoothY += (lm[8].y * canvas.height - smoothY) * lerpAmount;
                smoothTX += (lm[4].x * canvas.width - smoothTX) * lerpAmount;
                smoothTY += (lm[4].y * canvas.height - smoothTY) * lerpAmount;

                const x = smoothX, y = smoothY;
                const tx = smoothTX, ty = smoothTY;
                const isPinching = Math.hypot(x - tx, y - ty) < 45;

                handleMenuHover(lm[8]);

                if (isPinching) {
                    lastPinchTime = Date.now(); // Tutma yapıldığı sürece zamanı güncelle
                    tempShape = null; // Tutma anında çizimi iptal et
                    
                    if (!grabbedShape) {
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(x, y, drawings[i])) { grabbedShape = drawings[i]; lastGrabPoint = {x, y}; break; }
                        }
                    } else {
                        const dx = x - lastGrabPoint.x, dy = y - lastGrabPoint.y;
                        if (grabbedShape.type === 'draw') grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                        else { grabbedShape.start.x += dx; grabbedShape.start.y += dy; grabbedShape.end.x += dx; grabbedShape.end.y += dy; }
                        lastGrabPoint = {x, y};
                    }
                } else {
                    grabbedShape = null;
                    
                    // Sadece tutma bittikten 300ms sonra ve işaret parmağı yukarıdaysa çizime izin ver
                    const canDraw = (Date.now() - lastPinchTime > 300) && (lm[8].y < lm[6].y && lm[12].y > lm[10].y);

                    if (canDraw) {
                        if (currentMode === 'draw') {
                            if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f' }; drawings.push(tempShape); }
                            const lastP = tempShape.points[tempShape.points.length-1];
                            if(!lastP || Math.hypot(lastP.x - x, lastP.y - y) > 5) tempShape.points.push({ x, y });
                        } else {
                            if (!startPoint) startPoint = { x, y };
                            tempShape = { type: currentMode, start: {...startPoint}, end: { x, y }, color: '#00ff9f' };
                        }
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null; startPoint = null;
                    }
                }
                drawCyberHand(lm, isPinching);
            }
            renderDrawings();
            ctx.restore();
        }

        function checkHit(x, y, s) {
            const m = 60;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            return x > Math.min(s.start.x, s.end.x)-m && x < Math.max(s.start.x, s.end.x)+m && y > Math.min(s.start.y, s.end.y)-m && y < Math.max(s.start.y, s.end.y)+m;
        }

        function drawFace(pts, color) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
            if(!genMode) { ctx.strokeStyle = "rgba(0, 255, 159, 0.4)"; ctx.lineWidth = 1; ctx.stroke(); }
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                const w = (s.end?.x - s.start?.x) || 0, h = (s.end?.y - s.start?.y) || 0;
                const d = 30;

                if (s.type === 'draw') {
                    ctx.beginPath();
                    ctx.strokeStyle = s.color; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'cube') {
                    const base = s.start;
                    drawFace([{x:base.x+d, y:base.y-d}, {x:base.x+w+d, y:base.y-d}, {x:base.x+w+d, y:base.y+h-d}, {x:base.x+d, y:base.y+h-d}], genMode ? "#1a1a1a" : "rgba(40,40,40,0.5)"); 
                    drawFace([{x:base.x, y:base.y}, {x:base.x+d, y:base.y-d}, {x:base.x+d, y:base.y+h-d}, {x:base.x, y:base.y+h}], genMode ? "#333" : "rgba(70,70,70,0.5)"); 
                    drawFace([{x:base.x, y:base.y}, {x:base.x+w, y:base.y}, {x:base.x+w+d, y:base.y-d}, {x:base.x+d, y:base.y-d}], genMode ? "#4d4d4d" : "rgba(100,100,100,0.5)"); 
                    drawFace([{x:base.x, y:base.y}, {x:base.x+w, y:base.y}, {x:base.x+w, y:base.y+h}, {x:base.x, y:base.y+h}], genMode ? "#666" : "rgba(130,130,130,0.5)"); 
                } else if (s.type === 'pyram') {
                    const top = { x: s.start.x + w/2, y: s.start.y - h };
                    drawFace([{x:s.start.x, y:s.start.y}, {x:s.start.x+w, y:s.start.y}, {x:s.start.x+w+20, y:s.start.y-20}, {x:s.start.x+20, y:s.start.y-20}], "#222");
                    drawFace([{x:s.start.x, y:s.start.y}, {x:top.x, y:top.y}, {x:s.start.x+w, y:s.start.y}], "#555");
                    drawFace([{x:s.start.x+w, y:s.start.y}, {x:top.x, y:top.y}, {x:s.start.x+w+20, y:s.start.y-20}], "#333");
                } else if (s.type === 'cyl') {
                    const r = Math.abs(w/2);
                    ctx.beginPath(); ctx.ellipse(s.start.x+r, s.start.y, r, 10, 0, 0, Math.PI*2); ctx.fillStyle="#333"; ctx.fill();
                    ctx.fillStyle = genMode ? "#555" : "rgba(80,80,80,0.5)";
                    ctx.fillRect(s.start.x, s.start.y-h, r*2, h);
                    ctx.beginPath(); ctx.ellipse(s.start.x+r, s.start.y-h, r, 10, 0, 0, Math.PI*2); ctx.fillStyle="#777"; ctx.fill();
                }
            });
        }

        function handleMenuHover(index) {
            const mx = (1 - index.x) * canvas.width, my = index.y * canvas.height;
            let h = null;
            document.querySelectorAll('.btn').forEach(b => {
                const r = b.getBoundingClientRect();
                if (mx > r.left && mx < r.right && my > r.top && my < r.bottom) h = b;
            });
            if (h) {
                if (lastHoverId === h.id) { if (Date.now() - hoverStartTime > 500) { setMode(h.id.replace('mode-','').replace('btn-','')); hoverStartTime = Date.now() + 1500; } h.classList.add('hovering'); }
                else { lastHoverId = h.id; hoverStartTime = Date.now(); }
            } else { document.querySelectorAll('.btn').forEach(b => b.classList.remove('hovering')); lastHoverId = null; }
        }

        function drawCyberHand(lm, isPinching) {
            const color = isPinching ? '#ff00ff' : '#00ff9f';
            // Bağlantı Hatları
            drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: color, lineWidth: 1.5});
            
            // Eklemlere Glow Noktaları (Ablasyon efekti)
            lm.forEach((pt, i) => {
                const px = pt.x * canvas.width;
                const py = pt.y * canvas.height;
                
                ctx.beginPath();
                ctx.arc(px, py, i === 8 || i === 4 ? 6 : 3, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color;
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Parmak uçlarına ekstra halka
                if(i === 8 || i === 4) {
                    ctx.beginPath();
                    ctx.arc(px, py, 10, 0, Math.PI * 2);
                    ctx.strokeStyle = color;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
    </script>
</body>
</html>
