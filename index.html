<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Voice Control Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 10px;
            background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--jarvis-green);
            box-shadow: 0 0 20px var(--jarvis-green);
        }

        .status-bar { color: var(--jarvis-green); font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .btn-group { display: flex; gap: 8px; }
        .btn {
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 8px 15px; font-size: 11px;
            text-transform: uppercase; border-radius: 4px; font-weight: bold; transition: 0.3s;
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 15px var(--jarvis-glow); }
        
        #voice-log {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            color: var(--jarvis-green); font-family: monospace; font-size: 16px;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px;
            border-right: 4px solid var(--jarvis-green); text-align: right;
        }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="status-bar" id="system-status">SİSTEM: ÇEVRİMDIŞI (BAŞLATMAK İÇİN TIKLA)</div>
        <div class="btn-group">
            <div class="btn active" id="mode-draw">KALEM</div>
            <div class="btn" id="mode-cube">KÜP</div>
            <div class="btn" id="mode-pyram">PİRAMİT</div>
        </div>
    </div>

    <div id="voice-log">Komut Bekleniyor...</div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        const statusText = document.getElementById('system-status');
        const voiceLog = document.getElementById('voice-log');
        
        let currentMode = 'draw';
        let drawings = [], tempShape = null, startPoint = null;
        let currentColor = '#00ff9f';
        let smoothX = 0, smoothY = 0;
        const lerpAmount = 0.3;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // --- SESLİ KOMUT SİSTEMİ ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const command = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                voiceLog.innerText = "Duyulan: " + command;
                
                // --- KOMUT MANTIĞI ---
                if (command.includes("küp") || command.includes("cube")) {
                    setMode('cube');
                    jarvisSpeak("Küp moduna geçildi.");
                } 
                else if (command.includes("kalem") || command.includes("çizim")) {
                    setMode('draw');
                    jarvisSpeak("Kalem aktif.");
                }
                else if (command.includes("piramit")) {
                    setMode('pyram');
                    jarvisSpeak("Piramit modu.");
                }
                else if (command.includes("temizle") || command.includes("ekranı sil")) {
                    drawings = [];
                    jarvisSpeak("Ekran temizlendi efendim.");
                }
                else if (command.includes("geri al")) {
                    drawings.pop();
                    jarvisSpeak("Son işlem geri alındı.");
                }
                else if (command.includes("mavi")) {
                    updateTheme('#00d4ff');
                    jarvisSpeak("Sistem rengi maviye çevrildi.");
                }
                else if (command.includes("kırmızı")) {
                    updateTheme('#ff3e3e');
                    jarvisSpeak("Dikkat, kritik mod. Renk kırmızı.");
                }
                else if (command.includes("yeşil") || command.includes("standard")) {
                    updateTheme('#00ff9f');
                    jarvisSpeak("Varsayılan ayarlara dönüldü.");
                }
            };

            recognition.onstart = () => { statusText.innerText = "SİSTEM: ÇEVRİMİÇİ"; };
            recognition.onend = () => recognition.start(); // Bağlantı koparsa yeniden başla

            window.addEventListener('click', () => {
                recognition.start();
                video.style.display = "block";
                jarvisSpeak("Sistemler aktif. Dinliyorum.");
            }, { once: true });
        }

        function jarvisSpeak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        function updateTheme(hex) {
            currentColor = hex;
            document.documentElement.style.setProperty('--jarvis-green', hex);
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.id === 'mode-' + mode));
        }

        // --- RENDER DÖNGÜSÜ ---
        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const x = (1 - lm[8].x) * canvas.width; // Ayna yansıması düzeltme
                const y = lm[8].y * canvas.height;

                smoothX += (x - smoothX) * lerpAmount;
                smoothY += (y - smoothY) * lerpAmount;

                // İşaret parmağı havadaysa çiz
                if (lm[8].y < lm[6].y) {
                    if (currentMode === 'draw') {
                        if (!tempShape) { tempShape = { type: 'draw', points: [], color: currentColor }; drawings.push(tempShape); }
                        tempShape.points.push({ x: smoothX, y: smoothY });
                    } else {
                        if (!startPoint) startPoint = { x: smoothX, y: smoothY };
                        tempShape = { type: currentMode, start: {...startPoint}, end: { x: smoothX, y: smoothY }, color: currentColor };
                    }
                } else {
                    if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                    tempShape = null; startPoint = null;
                }
                drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: currentColor, lineWidth: 2});
            }
            
            renderAll();
            ctx.restore();
        }

        function renderAll() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 3;
                if (s.type === 'draw') {
                    ctx.beginPath();
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'cube') {
                    const w = s.end.x - s.start.x, h = s.end.y - s.start.y;
                    ctx.strokeRect(s.start.x, s.start.y, w, h);
                    ctx.fillStyle = s.color + "33";
                    ctx.fillRect(s.start.x, s.start.y, w, h);
                } else if (s.type === 'pyram') {
                    ctx.beginPath();
                    ctx.moveTo(s.start.x, s.start.y);
                    ctx.lineTo(s.end.x, s.end.y);
                    ctx.lineTo(s.start.x - (s.end.x - s.start.x), s.end.y);
                    ctx.closePath();
                    ctx.stroke();
                }
            });
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
    </script>
</body>
</html>
