<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D Engine v8.0 - Stabilized Physics</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        #ui-panel { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; justify-content: space-between; padding: 6px; background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--jarvis-green); }
        .btn-group { display: flex; gap: 3px; }
        .btn { background: rgba(0, 0, 0, 0.8); border: 1px solid var(--jarvis-green); color: var(--jarvis-green); padding: 5px 8px; font-size: 9px; text-transform: uppercase; border-radius: 3px; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 12px var(--jarvis-glow); }
        .btn.gen-mode { border-color: #ffde00; color: #ffde00; }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div id="mode-draw" class="btn active">Pen</div>
            <div id="mode-cube" class="btn">Cube</div>
            <div id="mode-sphere" class="btn">Ball</div>
            <div id="mode-pyram" class="btn">Pyra</div>
        </div>
        <div class="btn-group">
            <div id="btn-phys" class="btn gen-mode">Physics: OFF</div>
            <div id="btn-ar" class="btn">AR</div>
            <div id="btn-undo" class="btn">Undo</div>
            <div id="btn-clear" class="btn">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, physMode = false;
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShapes = [null, null]; // Çift el tutma

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // Orijinal setMode mantığı
        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') { arMode = !arMode; video.style.display = arMode ? "block" : "none"; return; }
            if(mode === 'phys') { 
                physMode = !physMode; 
                document.getElementById('btn-phys').textContent = physMode ? "Physics: ON" : "Physics: OFF";
                document.getElementById('btn-phys').classList.toggle('active');
                return; 
            }
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => { if(b.id.startsWith('mode-')) b.classList.toggle('active', b.id === 'mode-' + mode); });
        }

        function updatePhysics() {
            if(!physMode) return;
            drawings.forEach(s => {
                if(s.isHeld) return;
                if(!s.vy) s.vy = 0;
                s.vy += 0.8; // Yerçekimi
                if(s.type === 'draw') {
                    s.points.forEach(p => p.y += s.vy);
                } else {
                    s.start.y += s.vy; s.end.y += s.vy;
                }
                // Yerden sekme (Basit)
                let bottomY = s.type === 'draw' ? Math.max(...s.points.map(p=>p.y)) : Math.max(s.start.y, s.end.y);
                if(bottomY > canvas.height) {
                    let diff = bottomY - canvas.height;
                    if(s.type === 'draw') s.points.forEach(p => p.y -= diff);
                    else { s.start.y -= diff; s.end.y -= diff; }
                    s.vy *= -0.6;
                }
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach((lm, index) => {
                    const x = lm[8].x * canvas.width;
                    const y = lm[8].y * canvas.height;
                    const tx = lm[4].x * canvas.width;
                    const ty = lm[4].y * canvas.height;
                    const isPinching = Math.hypot(x - tx, y - ty) < 40;

                    if (isPinching) {
                        if (!grabbedShapes[index]) {
                            for (let i = drawings.length - 1; i >= 0; i--) {
                                if (checkHit(x, y, drawings[i])) { 
                                    grabbedShapes[index] = drawings[i]; 
                                    grabbedShapes[index].isHeld = true; 
                                    grabbedShapes[index].offset = {x: (drawings[i].start?.x || drawings[i].points[0].x) - x, y: (drawings[i].start?.y || drawings[i].points[0].y) - y};
                                    break; 
                                }
                            }
                        } else {
                            const s = grabbedShapes[index];
                            if(s.type === 'draw') {
                                const dx = x + s.offset.x - s.points[0].x;
                                const dy = y + s.offset.y - s.points[0].y;
                                s.points.forEach(p => { p.x += dx; p.y += dy; });
                            } else {
                                const w = s.end.x - s.start.x, h = s.end.y - s.start.y;
                                s.start = {x: x + s.offset.x, y: y + s.offset.y};
                                s.end = {x: s.start.x + w, y: s.start.y + h};
                                s.vy = 0;
                            }
                        }
                    } else {
                        if(grabbedShapes[index]) grabbedShapes[index].isHeld = false;
                        grabbedShapes[index] = null;
                        
                        // Orijinal çizim tetikleyicisi
                        if (lm[8].y < lm[6].y && lm[12].y > lm[10].y) {
                            if (currentMode === 'draw') {
                                if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f' }; drawings.push(tempShape); }
                                tempShape.points.push({ x, y });
                            } else {
                                if (!startPoint) startPoint = { x, y };
                                tempShape = { type: currentMode, start: {...startPoint}, end: { x, y }, color: '#00ff9f' };
                            }
                        } else {
                            if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                            tempShape = null; startPoint = null;
                        }
                    }
                    drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: isPinching ? '#ff4b2b' : '#00ff9f', lineWidth: 2});
                });
            }

            updatePhysics();
            renderDrawings();
            handleMenuHover(results.multiHandLandmarks);
            ctx.restore();
        }

        function checkHit(x, y, s) {
            const m = 50;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            return x > Math.min(s.start.x, s.end.x)-m && x < Math.max(s.start.x, s.end.x)+m && y > Math.min(s.start.y, s.end.y)-m && y < Math.max(s.start.y, s.end.y)+m;
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                ctx.strokeStyle = s.color; ctx.lineWidth = 2;
                if (s.type === 'draw') {
                    ctx.beginPath();
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'sphere') {
                    ctx.beginPath();
                    let r = Math.hypot(s.end.x - s.start.x, s.end.y - s.start.y);
                    ctx.arc(s.start.x, s.start.y, r, 0, Math.PI*2);
                    ctx.stroke();
                } else if (s.type === 'cube' || s.type === 'pyram') {
                    ctx.strokeRect(s.start.x, s.start.y, s.end.x - s.start.x, s.end.y - s.start.y);
                }
            });
        }

        function handleMenuHover(hands) {
            if(!hands) return;
            hands.forEach(lm => {
                const mx = (1 - lm[8].x) * canvas.width, my = lm[8].y * canvas.height;
                document.querySelectorAll('.btn').forEach(b => {
                    const r = b.getBoundingClientRect();
                    if (mx > r.left && mx < r.right && my > r.top && my < r.bottom) {
                        setMode(b.id.replace('mode-','').replace('btn-',''));
                    }
                });
            });
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
        
        // Buton tıklama desteği
        document.querySelectorAll('.btn').forEach(b => b.onclick = () => setMode(b.id.replace('mode-','').replace('btn-','')));
    </script>
</body>
</html>
