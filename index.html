<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Collapse Image Field</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:600px;
    height:600px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>
<body>

<canvas id="c" width="400" height="400"></canvas>
<button onclick="start()">Sistemi Başlat (Kuantum Çöküş)</button>

<script>

const W = 400;
const H = 400;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

let field = [];
let running = false;

// başlangıç gürültüsü
function init(){
    field = [];
    for(let y=0;y<H;y++){
        field[y] = [];
        for(let x=0;x<W;x++){
            field[y][x] = Math.random();
        }
    }
}

function step(){

    let next = [];

    for(let y=0;y<H;y++){
        next[y] = [];

        for(let x=0;x<W;x++){

            let sum = 0;
            let count = 0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx = x + dx;
                    let ny = y + dy;

                    if(nx>=0 && ny>=0 && nx<W && ny<H){
                        sum += field[ny][nx];
                        count++;
                    }
                }
            }

            let avg = sum / count;

            let self = field[y][x];

            // KUANTUM BENZERİ EVRİM
            let noise = (Math.random()-0.5);

            // zamanla stabilite artar (çöküş)
            let stability = running ? 0.98 : 0.5;

            let psi =
                self * stability +
                avg * (1 - stability) +
                noise * 0.03;

            // clamp
            psi = Math.max(0, Math.min(1, psi));

            next[y][x] = psi;
        }
    }

    field = next;
}

function render(){

    const img = ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            const v = field[y][x];
            const i = (y*W+x)*4;

            // daha doğal renk üretimi
            img.data[i]   = v * 255;
            img.data[i+1] = (v*v) * 255;
            img.data[i+2] = (1-v) * 200;
            img.data[i+3] = 255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){

    step();
    render();

    requestAnimationFrame(loop);
}

function start(){
    running = true;
}

init();
loop();

</script>

</body>
</html>
