<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field v2 (Stabil World)</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:500px;
    height:500px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="200" height="200"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=200,H=200;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], velocity=[];

// INIT
for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];
    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        velocity[y][x]=0;
    }
}

// AUDIO
let audioCtx;
let noiseGain;

function startAudio(){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    const bufferSize=2*audioCtx.sampleRate;
    const noiseBuffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);

    let output=noiseBuffer.getChannelData(0);

    for(let i=0;i<bufferSize;i++){
        output[i]=Math.random()*2-1;
    }

    const whiteNoise=audioCtx.createBufferSource();
    whiteNoise.buffer=noiseBuffer;
    whiteNoise.loop=true;

    noiseGain=audioCtx.createGain();
    noiseGain.gain.value=0.02;

    whiteNoise.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    whiteNoise.start();
}

// FIELD STEP
function step(){

    let next=[], velNext=[];

    for(let y=0;y<H;y++){
        next[y]=[];
        velNext[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            let acceleration = (avg - field[y][x]) * 0.1;

            velocity[y][x] = (velocity[y][x] + acceleration) * 0.92;

            let value = field[y][x] + velocity[y][x];

            value = Math.max(0,Math.min(1,value));

            next[y][x]=value;
            velNext[y][x]=velocity[y][x];

            // AUDIO FROM MOTION
            if(noiseGain){
                noiseGain.gain.value = 0.01 + Math.abs(velocity[y][x])*0.05;
            }
        }
    }

    field=next;
    velocity=velNext;
}

// RENDER (REALISTIC COLOR MAP)
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];

            let r,g,b;

            if(v<0.3){
                r=20;
                g=40;
                b=120; // derin yapı
            }
            else if(v<0.6){
                r=30;
                g=140;
                b=60; // canlı alan
            }
            else{
                r=180;
                g=140;
                b=80; // ışık/toprak
            }

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
