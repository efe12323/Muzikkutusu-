<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Pixel Field</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    border:1px solid #333;
    image-rendering:pixelated;
    width:800px;
    height:800px;
}
</style>

</head>
<body>

<canvas id="canvas" width="200" height="200"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const WIDTH = 200;
const HEIGHT = 200;

let field = [];

// Başlangıç alanı
for(let y=0; y<HEIGHT; y++){

    field[y] = [];

    for(let x=0; x<WIDTH; x++){

        field[y][x] = Math.random();

    }
}

// Piksel evrimi
function evolve(){

    let next = [];

    for(let y=0; y<HEIGHT; y++){

        next[y] = [];

        for(let x=0; x<WIDTH; x++){

            let sum = 0;
            let count = 0;

            for(let dy=-1; dy<=1; dy++){

                for(let dx=-1; dx<=1; dx++){

                    let nx = x + dx;
                    let ny = y + dy;

                    if(
                        nx >= 0 &&
                        ny >= 0 &&
                        nx < WIDTH &&
                        ny < HEIGHT
                    ){

                        sum += field[ny][nx];
                        count++;

                    }
                }
            }

            let neighbourAverage = sum / count;

            let self = field[y][x];

            let psi =
                self * 0.45 +
                neighbourAverage * 0.55;

            psi += (Math.random() - 0.5) * 0.02;

            psi = Math.max(0, Math.min(1, psi));

            next[y][x] = psi;
        }
    }

    field = next;
}

// Çizim
function render(){

    const image = ctx.createImageData(WIDTH, HEIGHT);

    for(let y=0; y<HEIGHT; y++){

        for(let x=0; x<WIDTH; x++){

            const value = field[y][x];

            const i = (y * WIDTH + x) * 4;

            image.data[i]     = value * 255;
            image.data[i + 1] = value * value * 255;
            image.data[i + 2] = (1 - value) * 255;
            image.data[i + 3] = 255;
        }
    }

    ctx.putImageData(image, 0, 0);
}

function loop(){

    evolve();
    render();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
