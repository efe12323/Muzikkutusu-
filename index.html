<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D STABLE</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <style>
        :root { --neon: #00ff9f; --bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); font-family: monospace; }
        #input_video { position: absolute; visibility: hidden; }
        #canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); }
        #ui { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; z-index: 100; pointer-events: none; }
        .btn { background: rgba(0,0,0,0.8); color: var(--neon); border: 1px solid var(--neon); padding: 8px 12px; font-size: 12px; border-radius: 5px; text-transform: uppercase; }
        .active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>
    <video id="input_video" playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div class="btn active" id="m-draw">Pen</div>
        <div class="btn" id="m-cube">Cube</div>
        <div class="btn" id="m-ar">AR</div>
        <div class="btn" id="m-clear" style="color:#ff4b2b; border-color:#ff4b2b;">Clear</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let mode = 'draw', ar = false, drawings = [], temp = null;
        let grabbed = null, lastAngle = 0, baseAngle = 0;

        function setMode(newMode) {
            if(newMode === 'clear') { drawings = []; return; }
            if(newMode === 'ar') { ar = !ar; video.style.visibility = ar ? 'visible' : 'hidden'; return; }
            mode = newMode;
            document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.id === 'm-'+newMode));
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let hands = [];
            if (results.multiHandLandmarks) {
                results.multiHandLandmarks.forEach(lm => {
                    const x = lm[8].x * canvas.width, y = lm[8].y * canvas.height;
                    const tx = lm[4].x * canvas.width, ty = lm[4].y * canvas.height;
                    const pinching = Math.hypot(x-tx, y-ty) < 40;
                    hands.push({x, y, pinching, raw: lm});
                });
            }

            // --- MANTIK BÖLÜMÜ ---
            if (hands.length === 2 && hands[0].pinching && hands[1].pinching) {
                // İKİ EL: DÖNDÜRME
                const dx = hands[0].x - hands[1].x, dy = hands[0].y - hands[1].y;
                const angle = Math.atan2(dy, dx);
                if (grabbed) {
                    grabbed.rot = angle - baseAngle;
                } else {
                    drawings.forEach(d => { if(Math.hypot(hands[0].x - d.x, hands[0].y - d.y) < 100) grabbed = d; });
                    if(grabbed) baseAngle = angle - (grabbed.rot || 0);
                }
            } 
            else if (hands.length === 1 && hands[0].pinching) {
                // TEK EL: TAŞIMA
                if (!grabbed) {
                    drawings.forEach(d => { if(Math.hypot(hands[0].x - d.x, hands[0].y - d.y) < 80) grabbed = d; });
                } else {
                    grabbed.x = hands[0].x; grabbed.y = hands[0].y;
                }
            } 
            else {
                // ÇİZİM VEYA SEÇİM
                grabbed = null;
                if (hands.length === 1) {
                    const h = hands[0];
                    if (h.y < 60) { // Menü Seçimi
                        const mx = (1 - h.raw[8].x) * canvas.width;
                        document.querySelectorAll('.btn').forEach(b => {
                            const r = b.getBoundingClientRect();
                            if(mx > r.left && mx < r.right) setMode(b.id.substring(2));
                        });
                    } else if (h.raw[8].y < h.raw[6].y) { // Çizim Yapma
                        if (mode === 'draw') {
                            if (!temp) { temp = { type: 'draw', pts: [] }; drawings.push(temp); }
                            temp.pts.push({x: h.x, y: h.y});
                        } else if (mode === 'cube') {
                            temp = { type: 'cube', x: h.x, y: h.y, rot: 0 };
                        }
                    } else {
                        if(temp && mode === 'cube') drawings.push(temp);
                        temp = null;
                    }
                }
            }

            // --- ÇİZİM BÖLÜMÜ ---
            [...drawings, temp].forEach(d => {
                if(!d) return;
                ctx.strokeStyle = (d === grabbed) ? '#fff' : varNeon();
                ctx.lineWidth = 3;
                if(d.type === 'draw') {
                    ctx.beginPath();
                    d.pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
                    ctx.stroke();
                } else if(d.type === 'cube') {
                    drawCube(d.x, d.y, 80, d.rot);
                }
            });

            // Elleri Çiz
            hands.forEach(h => {
                ctx.fillStyle = h.pinching ? '#ff4b2b' : varNeon();
                ctx.beginPath(); ctx.arc(h.x, h.y, 8, 0, 7); ctx.fill();
            });
            ctx.restore();
        }

        function varNeon() { return '#00ff9f'; }

        function drawCube(x, y, size, rot) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            const s = size / 2;
            ctx.strokeRect(-s, -s, size, size);
            ctx.strokeRect(-s+20, -s-20, size, size);
            [[-s,-s],[s,-s],[s,s],[-s,s]].forEach(p => {
                ctx.moveTo(p[0], p[1]);
                ctx.lineTo(p[0]+20, p[1]-20);
            });
            ctx.stroke();
            ctx.restore();
        }

        const handsPipe = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        handsPipe.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
        handsPipe.onResults(onResults);
        
        const camera = new Camera(video, { onFrame: async () => await handsPipe.send({image: video}), width: 1280, height: 720 });
        camera.start();
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    </script>
</body>
</html>
