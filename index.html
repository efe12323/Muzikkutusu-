<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field v5 - Structure Emergence</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #222;
    image-rendering: pixelated;
    width:600px;
    height:600px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="240" height="240"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=240,H=240;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], prev=[], velocity=[];

// ---------------- INIT ----------------
for(let y=0;y<H;y++){
    field[y]=[];
    prev[y]=[];
    velocity[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        prev[y][x]=field[y][x];
        velocity[y][x]=0;
    }
}

// ---------------- AUDIO ----------------
let audioCtx;
let osc;

function startAudio(){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=200;

    gain.gain.value=0.02;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
}

// ---------------- CORE FIELD ----------------
function step(){

    let next=[], energyMap=[];

    for(let y=0;y<H;y++){
        next[y]=[];
        energyMap[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            // 🌊 wider diffusion (3 radius)
            for(let dy=-2;dy<=2;dy++){
                for(let dx=-2;dx<=2;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){

                        let weight = 1 / (1 + Math.abs(dx)+Math.abs(dy));

                        sum += field[ny][nx] * weight;
                        count += weight;
                    }
                }
            }

            let avg=sum/count;

            let current=field[y][x];

            // 🔥 inertia (memory)
            let accel = (avg - current) * 0.25;

            velocity[y][x] = (velocity[y][x] + accel) * 0.92;

            // 🔥 micro noise (life)
            velocity[y][x] += (Math.random()-0.5)*0.015;

            let value = current + velocity[y][x];

            value = Math.max(0,Math.min(1,value));

            next[y][x]=value;

            energyMap[y][x]=Math.abs(velocity[y][x]);
        }
    }

    prev=field;
    field=next;

    // 🔊 AUDIO = TOTAL FIELD ENERGY
    if(osc){
        let total=0;

        for(let y=0;y<H;y++){
            for(let x=0;x<W;x++){
                total += energyMap[y][x];
            }
        }

        osc.frequency.value = 120 + total * 0.5;
    }
}

// ---------------- RENDER ----------------
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];
            let p=prev[y][x];

            // 🔥 STRUCTURE CONTRAST (THIS IS IMPORTANT)
            let d = v - p;

            let intensity = Math.abs(d)*3 + v;

            let r = 30 + intensity * 200;
            let g = 50 + v * 180;
            let b = 120 + (1-v) * 200;

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

// ---------------- LOOP ----------------
function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
