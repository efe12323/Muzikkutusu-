<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D - Hologram Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; --pinch-color: #ff3e3e; --holo-blue: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 6px;
            background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--jarvis-green);
        }

        .btn-group { display: flex; gap: 3px; }
        .btn {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 5px 8px; font-size: 9px;
            text-transform: uppercase; border-radius: 3px; font-weight: bold; transition: 0.2s; cursor: pointer;
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 12px var(--jarvis-glow); }
        .btn.holo-btn { border-color: var(--holo-blue); color: var(--holo-blue); }
        .btn.holo-active { background: var(--holo-blue); color: #000; box-shadow: 0 0 15px var(--holo-blue); }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-cube">Cube</div>
            <div class="btn" id="mode-pyram">Pyra</div>
        </div>
        <div class="btn-group">
            <div class="btn holo-btn" id="btn-holo">HOLO</div>
            <div class="btn" id="btn-ar">AR</div>
            <div class="btn" id="btn-undo">Undo</div>
            <div class="btn" id="btn-clear">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, holoMode = false;
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShape = null, lastGrabPoint = null;
        let lastHoverId = null, hoverStartTime = 0;

        let smoothX = 0, smoothY = 0;
        let smoothTX = 0, smoothTY = 0;
        const lerpAmount = 0.35;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') { arMode = !arMode; video.style.display = arMode ? "block" : "none"; return; }
            if(mode === 'holo') { 
                holoMode = !holoMode; 
                document.getElementById('btn-holo').classList.toggle('holo-active', holoMode);
                return; 
            }
            tempShape = null; startPoint = null; currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) b.classList.toggle('active', b.id === 'mode-' + mode);
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Ayna efekti (Normal modda el takibi için önemli)
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const rawX = lm[8].x * canvas.width;
                const rawY = lm[8].y * canvas.height;
                const rawTX = lm[4].x * canvas.width;
                const rawTY = lm[4].y * canvas.height;

                smoothX += (rawX - smoothX) * lerpAmount;
                smoothY += (rawY - smoothY) * lerpAmount;
                smoothTX += (rawTX - smoothTX) * lerpAmount;
                smoothTY += (rawTY - smoothTY) * lerpAmount;

                const x = smoothX, y = smoothY;
                const tx = smoothTX, ty = smoothTY;

                handleMenuHover(lm[8]);
                const isPinching = Math.hypot(x - tx, y - ty) < 45;

                if (isPinching) {
                    if (!grabbedShape) {
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(x, y, drawings[i])) { grabbedShape = drawings[i]; lastGrabPoint = {x, y}; break; }
                        }
                    } else {
                        const dx = x - lastGrabPoint.x, dy = y - lastGrabPoint.y;
                        if (grabbedShape.type === 'draw') grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                        else { grabbedShape.start.x += dx; grabbedShape.start.y += dy; grabbedShape.end.x += dx; grabbedShape.end.y += dy; }
                        lastGrabPoint = {x, y};
                    }
                } else {
                    grabbedShape = null;
                    if (lm[8].y < lm[6].y && lm[12].y > lm[10].y) {
                        if (currentMode === 'draw') {
                            if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f' }; drawings.push(tempShape); }
                            tempShape.points.push({ x, y });
                        } else {
                            if (!startPoint) startPoint = { x, y };
                            tempShape = { type: currentMode, start: {...startPoint}, end: { x, y }, color: '#00ff9f' };
                        }
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null; startPoint = null;
                    }
                }
                
                if (!holoMode) drawCyberHand(lm, isPinching);
            }
            ctx.restore();

            // RENDER BÖLÜMÜ
            if (holoMode) {
                renderHologramDisplay();
            } else {
                renderDrawings(ctx);
            }
        }

        function renderHologramDisplay() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const offset = Math.min(canvas.width, canvas.height) * 0.25;

            for (let i = 0; i < 4; i++) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate((Math.PI / 2) * i);
                
                // Her bir yansımayı küçült ve merkeze yaklaştır
                ctx.translate(-centerX, -centerY - offset);
                ctx.scale(0.4, 0.4); 
                ctx.translate(centerX * 0.75, centerY * 1.5);
                
                renderDrawings(ctx);
                ctx.restore();
            }
            
            // Merkeze odak noktası çiz (Piramidi koyacağın yer)
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI*2);
            ctx.fillStyle = "rgba(0, 255, 159, 0.3)";
            ctx.fill();
        }

        function drawCyberHand(lm, isPinching) {
            const mainColor = isPinching ? '#ff3e3e' : '#00ff9f';
            HAND_CONNECTIONS.forEach(([a, b]) => {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 1; ctx.stroke();
            });
            lm.forEach((p, i) => {
                ctx.beginPath(); ctx.arc(p.x * canvas.width, p.y * canvas.height, i==8||i==4?6:3, 0, Math.PI*2);
                ctx.fillStyle = mainColor; ctx.fill();
            });
        }

        function checkHit(x, y, s) {
            const m = 60;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            return x > Math.min(s.start.x, s.end.x)-m && x < Math.max(s.start.x, s.end.x)+m && y > Math.min(s.start.y, s.end.y)-m && y < Math.max(s.start.y, s.end.y)+m;
        }

        function renderDrawings(targetCtx) {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                targetCtx.strokeStyle = s.color; targetCtx.lineWidth = 3;
                if (s.type === 'draw') {
                    targetCtx.beginPath();
                    s.points.forEach((p, i) => { if (i === 0) targetCtx.moveTo(p.x, p.y); else targetCtx.lineTo(p.x, p.y); });
                    targetCtx.stroke();
                } else if (s.type === 'cube') {
                    const w = s.end.x - s.start.x, h = s.end.y - s.start.y;
                    targetCtx.strokeRect(s.start.x, s.start.y, w, h);
                    targetCtx.strokeRect(s.start.x+20, s.start.y-20, w, h);
                } else if (s.type === 'pyram') {
                    const w = s.end.x - s.start.x;
                    targetCtx.beginPath();
                    targetCtx.moveTo(s.start.x, s.start.y); targetCtx.lineTo(s.end.x, s.start.y);
                    targetCtx.lineTo(s.start.x + w/2, s.end.y); targetCtx.closePath();
                    targetCtx.stroke();
                }
            });
        }

        function handleMenuHover(index) {
            const mx = (1-index.x) * canvas.width, my = index.y * canvas.height;
            let h = null;
            document.querySelectorAll('.btn').forEach(b => {
                const r = b.getBoundingClientRect();
                if (mx > r.left && mx < r.right && my > r.top && my < r.bottom) h = b;
            });
            if (h) {
                if (lastHoverId === h.id) { if (Date.now() - hoverStartTime > 500) { setMode(h.id.replace('mode-','').replace('btn-','')); hoverStartTime = Date.now() + 1500; } }
                else { lastHoverId = h.id; hoverStartTime = Date.now(); }
            } else { lastHoverId = null; }
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
        document.querySelectorAll('.btn').forEach(b => b.onclick = () => setMode(b.id.replace('mode-','').replace('btn-','')));
    </script>
</body>
</html>
