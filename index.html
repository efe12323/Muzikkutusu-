<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field FIXED</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:500px;
    height:500px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="200" height="200"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=200,H=200;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], velocity=[];

for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];
    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        velocity[y][x]=(Math.random()-0.5)*0.1;
    }
}

// AUDIO (FIXED: dynamic frequency instead of static noise)
let audioCtx;
let osc;

function startAudio(){

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = 220;

    gain.gain.value = 0.03;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
}

// FIELD DYNAMICS (MORE ENERGY, LESS STABILITY)
function step(){

    let next=[], velNext=[];

    for(let y=0;y<H;y++){
        next[y]=[];
        velNext[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            // DALGA FİZİĞİ (kritik düzeltme)
            let force = (avg - field[y][x]) * 0.25;

            velocity[y][x] += force;

            velocity[y][x] *= 0.97; // daha az sönüm

            velocity[y][x] += (Math.random()-0.5)*0.02; // enerji enjeksiyonu

            let value = field[y][x] + velocity[y][x];

            // clamp
            value = Math.max(0,Math.min(1,value));

            next[y][x]=value;
            velNext[y][x]=velocity[y][x];

            // AUDIO CONTROL (motion-based)
            if(osc){
                let motion = Math.abs(velocity[y][x]);

                osc.frequency.value =
                    100 +
                    motion * 600 +
                    Math.sin(Date.now()*0.001)*50;
            }
        }
    }

    field=next;
    velocity=velNext;
}

// COLOR FIX (NO GREEN LOCK)
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];

            let r,g,b;

            // MULTI-PHASE COLOR SPACE
            if(v < 0.25){
                r = 20;
                g = 30;
                b = 120; // derin mavi
            }
            else if(v < 0.5){
                r = 20;
                g = 180;
                b = 120; // canlı yeşil
            }
            else if(v < 0.75){
                r = 200;
                g = 160;
                b = 60; // sıcak toprak
            }
            else{
                r = 240;
                g = 240;
                b = 240; // ışık
            }

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
