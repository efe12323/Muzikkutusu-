<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS AR UI v6.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        
        /* Kamera Görüntüsü (AR Modu için) */
        #input_video { 
            position: absolute; width: 100vw; height: 100vh; object-fit: cover;
            display: none; /* Varsayılan kapalı */
            transform: scaleX(-1);
        }
        
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        /* Ultra Küçük Üst Menü */
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 5px;
            background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(0,255,159,0.2);
        }

        .btn-group { display: flex; gap: 4px; }

        .btn {
            background: rgba(0, 0, 0, 0.7); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 5px 8px; font-size: 9px;
            text-transform: uppercase; border-radius: 3px; backdrop-filter: blur(5px);
            transition: 0.2s; font-weight: bold;
        }

        .btn.hovering { background: rgba(0, 255, 159, 0.4); transform: scale(1.05); }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 10px var(--jarvis-glow); }
        
        #status { position: absolute; bottom: 10px; right: 10px; color: var(--jarvis-green); font-size: 9px; font-family: monospace; z-index: 10; }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-rect">Box</div>
            <div class="btn" id="mode-circle">Circ</div>
            <div class="btn" id="mode-tri">Tri</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-ar" style="border-color: #00e5ff; color: #00e5ff;">AR: OFF</div>
            <div class="btn" id="btn-undo" style="border-color: #ffb800; color: #ffb800;">Undo</div>
            <div class="btn" id="btn-clear" style="border-color: #ff4b2b; color: #ff4b2b;">Clear</div>
        </div>
    </div>

    <div id="status">JARVIS_V6 // AR_READY</div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw';
        let arMode = false;
        let drawings = [];
        let tempShape = null;
        let startPoint = null;
        let grabbedShape = null;
        let lastGrabPoint = null;
        
        let lastHoverId = null;
        let hoverStartTime = 0;
        const HOVER_THRESHOLD = 500; 

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') {
                arMode = !arMode;
                video.style.display = arMode ? "block" : "none";
                document.getElementById('btn-ar').innerText = arMode ? "AR: ON" : "AR: OFF";
                document.getElementById('btn-ar').style.background = arMode ? "#00e5ff" : "transparent";
                document.getElementById('btn-ar').style.color = arMode ? "#000" : "#00e5ff";
                return;
            }
            
            tempShape = null;
            startPoint = null;
            currentMode = mode;
            
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) {
                    b.classList.remove('active');
                    if(b.id === 'mode-' + mode) b.classList.add('active');
                }
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // AR modu kapalıysa ızgara çiz (Opsiyonel)
            if(!arMode) drawGrid();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const indexTip = lm[8];
                const thumbTip = lm[4];
                
                const x = indexTip.x * canvas.width;
                const y = indexTip.y * canvas.height;
                const tx = thumbTip.x * canvas.width;
                const ty = thumbTip.y * canvas.height;

                handleMenuHover(indexTip);

                const dist = Math.hypot(x - tx, y - ty);
                const isPinching = dist < 45;

                if (isPinching) {
                    tempShape = null;
                    if (!grabbedShape) {
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(x, y, drawings[i])) {
                                grabbedShape = drawings[i];
                                lastGrabPoint = {x, y};
                                break;
                            }
                        }
                    } else {
                        const dx = x - lastGrabPoint.x;
                        const dy = y - lastGrabPoint.y;
                        if (grabbedShape.type === 'draw') {
                            grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                        } else {
                            grabbedShape.start.x += dx; grabbedShape.start.y += dy;
                            grabbedShape.end.x += dx; grabbedShape.end.y += dy;
                        }
                        lastGrabPoint = {x, y};
                    }
                } else {
                    grabbedShape = null;
                    if (indexTip.y < lm[6].y && lm[12].y > lm[10].y && !isPinching) {
                        handleDrawing(x, y, Math.abs(indexTip.z));
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null;
                        startPoint = null;
                    }
                }
                drawCyberHand(lm, isPinching);
            }
            renderDrawings();
            ctx.restore();
        }

        function handleMenuHover(indexTip) {
            const mirX = (1 - indexTip.x) * canvas.width;
            const mirY = indexTip.y * canvas.height;
            let currentHover = null;

            document.querySelectorAll('.btn').forEach(btn => {
                const r = btn.getBoundingClientRect();
                if (mirX > r.left && mirX < r.right && mirY > r.top && mirY < r.bottom) {
                    currentHover = btn;
                }
            });

            if (currentHover) {
                if (lastHoverId === currentHover.id) {
                    if (Date.now() - hoverStartTime > HOVER_THRESHOLD) {
                        setMode(currentHover.id.replace('mode-', '').replace('btn-', ''));
                        hoverStartTime = Date.now() + 1500;
                    }
                    currentHover.classList.add('hovering');
                } else {
                    lastHoverId = currentHover.id;
                    hoverStartTime = Date.now();
                }
            } else {
                document.querySelectorAll('.btn').forEach(b => b.classList.remove('hovering'));
                lastHoverId = null;
            }
        }

        function checkHit(x, y, s) {
            const m = 60;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            const minX = Math.min(s.start.x, s.end.x) - m;
            const maxX = Math.max(s.start.x, s.end.x) + m;
            const minY = Math.min(s.start.y, s.end.y) - m;
            const maxY = Math.max(s.start.y, s.end.y) + m;
            return x > minX && x < maxX && y > minY && y < maxY;
        }

        function handleDrawing(x, y, z) {
            if (currentMode === 'draw') {
                if (!tempShape) {
                    tempShape = { type: 'draw', points: [], color: '#00ff9f' };
                    drawings.push(tempShape);
                }
                tempShape.points.push({ x, y, z });
            } else {
                if (!startPoint) startPoint = { x, y, z };
                tempShape = { type: currentMode, start: startPoint, end: { x, y, z }, color: '#00ff9f' };
            }
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(shape => {
                if (!shape) return;
                ctx.beginPath();
                ctx.shadowBlur = (shape === grabbedShape) ? 20 : 8;
                ctx.strokeStyle = (shape === grabbedShape) ? "#ffffff" : shape.color;
                ctx.lineWidth = (shape === grabbedShape) ? 4 : 2;
                ctx.shadowColor = shape.color;

                if (shape.type === 'draw') {
                    shape.points.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                } else if (shape.type === 'rect') {
                    ctx.strokeRect(shape.start.x, shape.start.y, shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                } else if (shape.type === 'circle') {
                    const r = Math.hypot(shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                    ctx.arc(shape.start.x, shape.start.y, r, 0, Math.PI * 2);
                } else if (shape.type === 'tri') {
                    ctx.moveTo(shape.start.x, shape.start.y);
                    ctx.lineTo(shape.end.x, shape.end.y);
                    ctx.lineTo(shape.start.x - (shape.end.x - shape.start.x), shape.end.y);
                    ctx.closePath();
                }
                ctx.stroke();
            });
        }

        function drawCyberHand(landmarks, isGrabbing) {
            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: isGrabbing ? '#ff4b2b' : '#00ff9f', lineWidth: 2});
            landmarks.forEach((p, i) => {
                const isTip = [4, 8, 12, 16, 20].includes(i);
                ctx.fillStyle = isTip ? (isGrabbing ? '#ff4b2b' : '#00ff9f') : '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x * canvas.width, p.y * canvas.height, isTip ? 5 : 1.5, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 159, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); ctx.stroke(); }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
