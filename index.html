<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Neon Green Holographic Draw - 2 El + Depth</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --jarvis-green: #00ff9f;
            --jarvis-glow: #00ff41;
            --selection-cyan: #00ffff;
            --dark-bg: #0a0f0a;
            --grid: rgba(0, 255, 140, 0.045);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--dark-bg);
        }

        #input_video { 
            position: absolute;
            visibility: hidden;
            width: 1px; height: 1px;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            transform: scaleX(-1);
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: var(--jarvis-green);
            font-size: 1.5rem;
        }

        .loader {
            width: 70px; height: 70px;
            border: 5px solid #111;
            border-top: 5px solid var(--jarvis-green);
            border-radius: 50%;
            animation: spin 1.4s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading-screen');

        let drawings = [];           // { points: [{x,y,z}], id }
        let particles = [];
        let currentPath = null;
        let selectedDrawing = null;
        let isDragging = false;
        let lastDragPos = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Spark {
            constructor(x, y) {
                this.x = x; this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 14 + 6;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.life = 1;
                this.decay = Math.random() * 0.04 + 0.02;
            }
            update() {
                this.vx *= 0.97;
                this.vy *= 0.97;
                this.vy += 0.4;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                if (this.life <= 0) return;
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.strokeStyle = `rgba(0,255,140,${this.life})`;
                ctx.lineWidth = 2.8 * this.life;
                ctx.shadowBlur = 15 * this.life;
                ctx.shadowColor = 'rgba(0,255,100,0.8)';
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 1.4, this.y - this.vy * 1.4);
                ctx.stroke();
                ctx.restore();
            }
        }

        function addSparks(x, y, cnt = 6) {
            for (let i = 0; i < cnt; i++) particles.push(new Spark(x, y));
        }

        function dist3d(a, b) {
            const dx = (a.x - b.x) * canvas.width;
            const dy = (a.y - b.y) * canvas.height;
            const dz = (a.z - b.z) * 400; // z ölçeği
            return Math.hypot(dx, dy, dz);
        }

        function isIndexOnlyUp(lm) {
            const thumbClosed = dist3d(lm[4], lm[0]) < 0.12;
            const indexUp   = lm[8].y < lm[6].y - 0.03;
            const othersDown = lm[12].y > lm[10].y + 0.02 && lm[16].y > lm[14].y + 0.02 && lm[20].y > lm[18].y + 0.02;
            return indexUp && othersDown && thumbClosed;
        }

        function findNearestDrawing(mx, my) {
            let closest = null;
            let minDist = 100;
            drawings.forEach(d => {
                d.points.forEach(p => {
                    const dd = Math.hypot(mx - p.x, my - p.y);
                    if (dd < minDist) {
                        minDist = dd;
                        closest = d;
                    }
                });
            });
            return (minDist < 70) ? closest : null;
        }

        function drawBackground() {
            ctx.fillStyle = 'rgba(10,15,10,0.35)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const gridSize = 80;
            const opacity = 0.04 + Math.sin(Date.now() * 0.0006) * 0.015;

            ctx.strokeStyle = `rgba(0,255,140,${opacity})`;
            ctx.lineWidth = 1;

            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
        }

        function onResults(results) {
            if (loading.style.display !== 'none') loading.style.display = 'none';

            ctx.save();
            drawBackground();
            drawAllDrawings();
            updateParticles();

            let drawingHand = null;
            let controlHand = null;

            if (results.multiHandLandmarks) {
                results.multiHandedness?.forEach((handness, i) => {
                    const lm = results.multiHandLandmarks[i];
                    const isRight = handness.label === 'Right';
                    if (isRight) controlHand = lm;
                    else drawingHand = lm;
                });

                // Öncelik: sol el çizim, sağ el kontrol
                if (!drawingHand && results.multiHandLandmarks.length > 0) {
                    drawingHand = results.multiHandLandmarks[0];
                }
                if (!controlHand && results.multiHandLandmarks.length > 1) {
                    controlHand = results.multiHandLandmarks[1];
                }

                if (drawingHand) {
                    const tip = drawingHand[8];
                    const ix = tip.x * canvas.width;
                    const iy = tip.y * canvas.height;
                    const iz = tip.z * -400 + 200; // z → depth (yakın pozitif)

                    if (isIndexOnlyUp(drawingHand)) {
                        if (!currentPath) {
                            currentPath = { points: [], id: Date.now() };
                            drawings.push(currentPath);
                        }
                        currentPath.points.push({ x: ix, y: iy, z: iz });
                        addSparks(ix, iy);
                    } else {
                        currentPath = null;
                    }

                    drawHandSkeleton(drawingHand, '#00ff9f');
                }

                if (controlHand) {
                    const pinchDist = dist3d(controlHand[4], controlHand[8]) * 1000;

                    const tipX = controlHand[8].x * canvas.width;
                    const tipY = controlHand[8].y * canvas.height;

                    if (pinchDist < 38) {  // daha hassas pinch
                        if (!isDragging) {
                            selectedDrawing = findNearestDrawing(tipX, tipY);
                            if (selectedDrawing) {
                                isDragging = true;
                                lastDragPos = { x: tipX, y: tipY };
                            }
                        }

                        if (isDragging && selectedDrawing) {
                            const dx = tipX - lastDragPos.x;
                            const dy = tipY - lastDragPos.y;
                            selectedDrawing.points.forEach(p => {
                                p.x += dx;
                                p.y += dy;
                                // z korunsun
                            });
                            lastDragPos = { x: tipX, y: tipY };
                        }
                    } else {
                        isDragging = false;
                        selectedDrawing = null;
                    }

                    drawHandSkeleton(controlHand, '#00ffff'); // kontrol eli cyan
                }
            } else {
                currentPath = null;
                isDragging = false;
                selectedDrawing = null;
            }

            ctx.restore();
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function drawAllDrawings() {
            drawings.forEach(d => {
                if (d.points.length < 2) return;
                const isSelected = selectedDrawing?.id === d.id;

                ctx.save();

                // 3D illüzyon: her segment için kalınlık ve parlaklık z'ye göre değişir
                for (let i = 0; i < d.points.length - 1; i++) {
                    const p1 = d.points[i];
                    const p2 = d.points[i + 1];

                    const avgZ = (p1.z + p2.z) / 2;
                    const scale = 1 + (avgZ / 400) * 0.6; // yakın → büyük
                    const alpha = 0.75 + (avgZ / 800);

                    ctx.shadowBlur = isSelected ? 38 : 22;
                    ctx.shadowColor = isSelected ? '#00ffff' : '#00ff41';
                    ctx.strokeStyle = isSelected ? '#00ffff' : `rgba(0,255,159,${alpha})`;
                    ctx.lineWidth = (isSelected ? 8 : 5) * scale;
                    ctx.lineCap = 'round';

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();

                    // İnce iç hat
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#f0fff8';
                    ctx.lineWidth = (isSelected ? 3 : 1.8) * scale * 0.7;
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        function drawHandSkeleton(lm, color) {
            ctx.save();
            ctx.shadowBlur = 18;
            ctx.shadowColor = color;
            ctx.strokeStyle = color;
            ctx.globalAlpha = 0.92;
            ctx.lineWidth = 3.2;

            const connections = [
                [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
                [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
                [13,17],[17,18],[18,19],[19,20],[0,17]
            ];

            connections.forEach(([a,b]) => {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            });

            ctx.fillStyle = color;
            lm.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                const r = 4.5 + p.z * -8; // z yakınken biraz büyük
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
        });

        hands.setOptions({
            maxNumHands: 2,              // ← iki el aktif
            modelComplexity: 1,
            minDetectionConfidence: 0.82,
            minTrackingConfidence: 0.82
        });

        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
