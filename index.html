<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum World v6 - Object Emergence</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:Arial;
    color:white;
}

canvas{
    border:1px solid #222;
    image-rendering: pixelated;
    width:600px;
    height:600px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="240" height="240"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=240,H=240;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], velocity=[];

// 🌍 INIT FIELD
for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=Math.random()*0.3; // düşük başlangıç (boş dünya)
        velocity[y][x]=0;
    }
}

// 🔊 AUDIO
let audioCtx;
let osc;

function startAudio(){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=150;
    gain.gain.value=0.02;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
}

// 🌊 FIELD UPDATE (MASS FORMATION)
function step(){

    let next=[], energy=0;

    for(let y=0;y<H;y++){
        next[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&nx<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            let v=field[y][x];

            // 🧲 GRAVITY / CLUSTERING
            let force=(avg - v) * 0.3;

            velocity[y][x]+=force;

            // friction
            velocity[y][x]*=0.90;

            // noise (life)
            velocity[y][x]+=(Math.random()-0.5)*0.01;

            v+=velocity[y][x];

            // 🌍 MASS FORMATION (CRITICAL)
            if(v>0.65){
                v+=0.002; // self-reinforce (katılaşma)
            }

            v=Math.max(0,Math.min(1,v));

            next[y][x]=v;

            energy+=Math.abs(velocity[y][x]);
        }
    }

    field=next;

    // 🔊 SOUND = GLOBAL MASS MOVEMENT
    if(osc){
        osc.frequency.value = 120 + energy * 2;
    }
}

// 🎨 RENDER (MATERIAL EMERGENCE)
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];

            let r,g,b;

            // 🌍 MATERIAL CLASSIFICATION
            if(v<0.2){
                r=0; g=0; b=20; // boşluk
            }
            else if(v<0.45){
                r=20; g=40; b=120; // gaz/sis
            }
            else if(v<0.7){
                r=40; g=160; b=80; // yoğun yapı
            }
            else{
                r=200; g=180; b=120; // katı madde (form)
            }

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

// 🔁 LOOP
function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
