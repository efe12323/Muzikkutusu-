<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Stark Neon HUD - Göz Dostu Versiyon</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/EffectComposer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/RenderPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/UnrealBloomPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        body { margin:0; overflow:hidden; background:#000; }
        #loading { 
            position: fixed; inset:0; background:#000; 
            display:flex; align-items:center; justify-content:center; z-index:100; 
        }
        .loader { width:60px; height:60px; border:5px solid #111; border-top:5px solid #00cc77; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #info {
            position: absolute; top:10px; left:10px; color:#00cc77; font-family:Arial; font-size:14px; pointer-events:none; text-shadow:0 0 6px #00cc77;
        }
    </style>
</head>
<body>

<div id="loading"><div class="loader"></div></div>
<div id="info">İşaret parmağı dik → Çiz | Pinch → Taşı | R tuşu → Renk değiştir</div>

<video id="input_video" playsinline style="display:none;"></video>

<script>
// ────────────────────────────────────────────────
// Three.js Sahne (daha sakin ayarlar)
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000a1f);
scene.fog = new THREE.FogExp2(0x000a1f, 0.0012);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 4);  // biraz daha uzak → daha az bozulma

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio * 0.9); // hafif performans için
document.body.appendChild(renderer.domElement);

// Bloom → çok daha düşük güç (yanıp sönme azalır)
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.7,    // strength → eskiden 1.5'ti, şimdi çok daha az parlama
    0.3,    // radius
    0.92    // threshold → daha az şey parlasın
);
composer.addPass(bloomPass);

// Grid daha sönük
const grid = new THREE.GridHelper(20, 40, 0x003322, 0x001411);
scene.add(grid);

// ────────────────────────────────────────────────
// Değişkenler
// ────────────────────────────────────────────────
let drawings = [];          // { points: [Vector3], color: hex, line: Line }
let currentPath = null;
let selectedDrawing = null;
let isDragging = false;
let lastPinchPos = new THREE.Vector3();

const colors = [
    0x00cc77,     // yumuşak neon yeşil (göz dostu)
    0x00aaff,     // sakin mavi
    0x88ffaa,     // açık yeşil-mavi
    0xffee99,     // hafif sarı
    0xcc88ff      // morumsu
];
let currentColorIndex = 0;
let currentColor = colors[0];

// El iskeleti
let handSkeleton;

// ────────────────────────────────────────────────
// MediaPipe setup (aynı)
// ────────────────────────────────────────────────
const videoElement = document.getElementById('input_video');
const loading = document.getElementById('loading');

const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
hands.onResults(onResults);

const cameraFeed = new Camera(videoElement, { onFrame: async () => await hands.send({image: videoElement}), width: 1280, height: 720 });
cameraFeed.start();

// ────────────────────────────────────────────────
// Neon Line oluştur (daha stabil malzeme)
// ────────────────────────────────────────────────
function createNeonLine(points, color) {
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    
    // Ana çizgi: daha az opak, linewidth sınırlı
    const material = new THREE.LineBasicMaterial({
        color: color,
        linewidth: 3.5,           // daha ince
        transparent: true,
        opacity: 0.92             // neredeyse tam opak → titreme azalır
    });
    const line = new THREE.Line(geometry, material);
    
    // Glow katmanı: çok düşük opaklık
    const glowMat = new THREE.LineBasicMaterial({
        color: color,
        transparent: true,
        opacity: 0.18,            // eskiden 0.3 → şimdi daha az glow
        linewidth: 6
    });
    const glowLine = new THREE.Line(geometry, glowMat);
    line.add(glowLine);
    
    scene.add(line);
    return line;
}

function mapTo3D(x, y, estZ = 0) {
    const worldX = (x - 0.5) * 7;
    const worldY = (0.5 - y) * 4;
    const worldZ = estZ * -5 + 2;  // biraz daha stabil derinlik
    return new THREE.Vector3(worldX, worldY, worldZ);
}

// diğer fonksiyonlar (isIndexUpOnly, isPinch, getPinchMid) aynı kalıyor, kısalttım

function isIndexUpOnly(landmarks) {
    const idx = landmarks[8];
    const pip = landmarks[6];
    return idx.y < pip.y && 
           landmarks[12].y > landmarks[10].y && 
           landmarks[16].y > landmarks[14].y && 
           landmarks[20].y > landmarks[18].y;
}

function isPinch(landmarks) {
    return Math.hypot(landmarks[4].x - landmarks[8].x, landmarks[4].y - landmarks[8].y) < 0.065;
}

function getPinchMid(landmarks) {
    const tx = (landmarks[4].x + landmarks[8].x) / 2;
    const ty = (landmarks[4].y + landmarks[8].y) / 2;
    const estZ = (Math.abs(landmarks[4].z) + Math.abs(landmarks[8].z)) / 2 * 10;
    return mapTo3D(tx, ty, estZ);
}

// ────────────────────────────────────────────────
// Ana döngü (titremeyi azaltmak için optimizasyon)
// ────────────────────────────────────────────────
function onResults(results) {
    if (loading.style.display !== 'none') loading.style.display = 'none';
    if (handSkeleton) scene.remove(handSkeleton);

    if (results.multiHandLandmarks?.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        // El iskeleti (daha az parlak)
        const skelPoints = [];
        const conns = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
        conns.forEach(([a,b]) => {
            skelPoints.push(mapTo3D(hand[a].x, hand[a].y, hand[a].z*6));
            skelPoints.push(mapTo3D(hand[b].x, hand[b].y, hand[b].z*6));
        });
        const skelGeo = new THREE.BufferGeometry().setFromPoints(skelPoints);
        handSkeleton = new THREE.LineSegments(skelGeo, new THREE.LineBasicMaterial({color: 0x0088cc, linewidth:2.5}));
        scene.add(handSkeleton);

        const tipPos = mapTo3D(hand[8].x, hand[8].y, hand[8].z * 8);

        if (isIndexUpOnly(hand)) {
            if (!currentPath) {
                currentPath = { points: [], color: currentColor };
                drawings.push(currentPath);
            }
            currentPath.points.push(tipPos);
        } else {
            currentPath = null;
        }

        if (isPinch(hand)) {
            const midPos = getPinchMid(hand);
            if (!isDragging) {
                let minDist = Infinity;
                drawings.forEach(d => {
                    d.points.forEach(p => {
                        const dist = p.distanceTo(midPos);
                        if (dist < minDist) { minDist = dist; selectedDrawing = d; }
                    });
                });
                if (minDist < 0.5) isDragging = true;
            }
            if (isDragging && selectedDrawing) {
                const delta = midPos.clone().sub(lastPinchPos);
                selectedDrawing.points.forEach(p => p.add(delta));
            }
            lastPinchPos.copy(midPos);
        } else {
            isDragging = false;
            selectedDrawing = null;
        }

        // Çizgileri güncelle (sadece değişenleri)
        drawings.forEach(d => {
            if (d.points.length < 2) return;
            if (!d.line) {
                d.line = createNeonLine(d.points, d.color);
            } else {
                // geometry güncelle → titreme azalır
                d.line.geometry.setFromPoints(d.points);
                d.line.children[0].geometry.setFromPoints(d.points);
                d.line.geometry.attributes.position.needsUpdate = true;
                d.line.children[0].geometry.attributes.position.needsUpdate = true;
            }
        });
    } else {
        currentPath = null;
        isDragging = false;
    }

    composer.render();
}

// Resize ve renk değiştirme aynı
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') {
        currentColorIndex = (currentColorIndex + 1) % colors.length;
        currentColor = colors[currentColorIndex];
        document.getElementById('info').innerText = `Renk: #${currentColor.toString(16).padStart(6,'0')} (R ile değiştir)`;
    }
});

function animate() { requestAnimationFrame(animate); }
animate();

</script>
</body>
</html>
