<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Neon Draw</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --jarvis-green: #00ff9f;
            --jarvis-green-dim: #00cc7a;
            --jarvis-glow: #00ff41;
            --selection-cyan: #00ffff;
            --dark-bg: #0a0f0a;
            --grid: rgba(0, 255, 140, 0.07);
        }
        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--dark-bg); font-family:'Courier New',monospace; }
        #input_video { position:absolute; visibility:hidden; width:1px; height:1px; transform:scaleX(-1); }
        #output_canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:5; transform:scaleX(-1); image-rendering:pixelated; }
        #loading-screen { position:fixed; inset:0; background:#000; display:flex; justify-content:center; align-items:center; z-index:100; color:var(--jarvis-green); font-size:1.4rem; }
        .loader { width:60px; height:60px; border:4px solid #111; border-top:4px solid var(--jarvis-green); border-radius:50%; animation:spin 1.2s linear infinite; }
        @keyframes spin { 100% { transform:rotate(360deg); } }

        #color-button {
            position: absolute; bottom: 30px; left: 30px; z-index: 10;
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(0,255,140,0.15); border: 2px solid #00ff9f;
            box-shadow: 0 0 20px #00ff9f;
            cursor: pointer; pointer-events: none;
        }
        #color-panel {
            position: absolute; bottom: 120px; left: 30px; z-index: 10;
            display: none; background: rgba(10,20,15,0.7); padding: 15px;
            border-radius: 12px; border: 1px solid #00ff9f; box-shadow: 0 0 30px #00ff41;
        }
        .color-swatch {
            width: 50px; height: 50px; border-radius: 50%; margin: 10px;
            display: inline-block; cursor: pointer; border: 2px solid #333;
            box-shadow: 0 0 15px currentColor;
        }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="loader"></div></div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="color-button"></div>
    <div id="color-panel">
        <div class="color-swatch" style="background:#00ff9f;" data-color="#00ff9f"></div>
        <div class="color-swatch" style="background:#00ffff;" data-color="#00ffff"></div>
        <div class="color-swatch" style="background:#ff00aa;" data-color="#ff00aa"></div>
        <div class="color-swatch" style="background:#ffff00;" data-color="#ffff00"></div>
        <div class="color-swatch" style="background:#ff8800;" data-color="#ff8800"></div>
    </div>

    <script>
        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading-screen');
        const colorButton = document.getElementById('color-button');
        const colorPanel = document.getElementById('color-panel');

        let drawings = [];
        let particles = [];
        let currentPath = null;
        let selectedDrawing = null;
        let isDragging = false;
        let lastPos = { x: 0, y: 0 };
        let currentColor = '#00ff9f';
        let isEraser = false;
        let prevIndexUp = false; // flicker önlemek için

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Spark { /* aynı kalıyor, kısalttım */ 
            constructor(x, y) { /* ... */ }
            update() { /* ... */ }
            draw() { /* ... */ }
        }

        function addSparks(x, y, count=5) { /* aynı */ }

        function dist(a, b) {
            return Math.hypot((a.x - b.x)*canvas.width, (a.y - b.y)*canvas.height);
        }

        function isIndexOnlyUp(lm) {
            const thumbClosed = dist(lm[4], lm[17]) < dist(lm[3], lm[17]) * 1.15;
            const indexUp = lm[8].y < lm[6].y - 0.02;
            const othersDown = lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
            return indexUp && othersDown && thumbClosed;
        }

        function isFist(lm) { // yumruk algılama
            return lm[8].y > lm[6].y && lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y &&
                   dist(lm[4], lm[8]) < 60 && dist(lm[4], lm[12]) < 60;
        }

        function findDrawingNear(x, y) { /* aynı */ }

        function drawHoloGrid() { /* aynı, pulse kalabilir */ }

        function onResults(results) {
            if (loading.style.display !== 'none') loading.style.display = 'none';

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(10,15,10,0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawHoloGrid();
            drawStoredDrawings();
            updateParticles();

            if (results.multiHandLandmarks?.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const tip = lm[8];
                const thumb = lm[4];

                const ix = tip.x * canvas.width;
                const iy = tip.y * canvas.height;
                const tx = thumb.x * canvas.width;
                const ty = thumb.y * canvas.height;

                const pinchDist = dist(lm[4], lm[8]);

                // ─── Renk butonu algılama ───────────────────────────────
                const buttonRect = colorButton.getBoundingClientRect();
                const bx = buttonRect.left + 35;
                const by = buttonRect.top + 35;
                const toButtonDist = Math.hypot(ix - bx, iy - by);

                if (toButtonDist < 60 && !colorPanel.style.display.includes('block')) {
                    colorPanel.style.display = 'block';
                }

                // ─── Renk paneli içinden seçim ──────────────────────────
                if (colorPanel.style.display.includes('block') && pinchDist < 45) {
                    const panelRect = colorPanel.getBoundingClientRect();
                    const colors = colorPanel.querySelectorAll('.color-swatch');
                    for (let sw of colors) {
                        const r = sw.getBoundingClientRect();
                        const cx = r.left + r.width/2;
                        const cy = r.top + r.height/2;
                        if (Math.hypot(ix - cx, iy - cy) < 40) {
                            currentColor = sw.dataset.color;
                            colorPanel.style.display = 'none';
                            isEraser = false;
                            break;
                        }
                    }
                }

                // ─── Gesture kontrolleri ────────────────────────────────
                if (isFist(lm)) {
                    isEraser = true;
                    currentPath = null;
                    isDragging = false;
                    selectedDrawing = null;
                }
                else if (isIndexOnlyUp(lm)) {
                    if (!prevIndexUp) { // ani geçiş önleme
                        currentPath = { points: [], id: Date.now(), color: currentColor, isEraser: isEraser };
                        drawings.push(currentPath);
                    }
                    currentPath.points.push({ x: ix, y: iy });
                    addSparks(ix, iy, isEraser ? 2 : 4);
                    isDragging = false;
                    selectedDrawing = null;
                    prevIndexUp = true;
                }
                else if (pinchDist < 45) {  // taşıma için biraz daha geniş tolerans
                    const mx = (ix + tx) / 2;
                    const my = (iy + ty) / 2;

                    if (!isDragging) {
                        selectedDrawing = findDrawingNear(mx, my);
                        if (selectedDrawing) {
                            isDragging = true;
                            lastPos = { x: mx, y: my };
                        }
                    }

                    if (isDragging && selectedDrawing) {
                        const dx = mx - lastPos.x;
                        const dy = my - lastPos.y;
                        // çok küçük hareketleri ignore et (noise azaltır)
                        if (Math.hypot(dx, dy) > 4) {
                            selectedDrawing.points.forEach(p => {
                                p.x += dx;
                                p.y += dy;
                            });
                            lastPos = { x: mx, y: my };
                        }
                    }
                    currentPath = null;
                    prevIndexUp = false;
                }
                else {
                    currentPath = null;
                    isDragging = false;
                    selectedDrawing = null;
                    prevIndexUp = false;
                }

                drawJARVISHand(lm);
            } else {
                currentPath = null;
                isDragging = false;
                selectedDrawing = null;
                prevIndexUp = false;
            }

            ctx.restore();
        }

        function updateParticles() { /* aynı */ }

        function drawStoredDrawings() {
            drawings.forEach(d => {
                if (d.points.length < 2) return;

                const selected = selectedDrawing?.id === d.id;

                ctx.save();
                ctx.shadowBlur = selected ? 45 : 28;
                ctx.shadowColor = selected ? '#00ffff' : d.isEraser ? '#000' : '#00ff41';
                ctx.strokeStyle = d.isEraser ? 'rgba(10,15,10,0.98)' : (d.color || '#00ff9f');
                ctx.globalAlpha = selected ? 1.0 : (d.isEraser ? 1 : 0.92);
                ctx.lineWidth = d.isEraser ? 18 : 5;  // silgi daha kalın
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(d.points[0].x, d.points[0].y);
                d.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();

                // iç parlak (sadece normal çizimde)
                if (!d.isEraser) {
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#e0fff0';
                    ctx.globalAlpha = selected ? 0.85 : 0.75;
                    ctx.lineWidth = selected ? 3 : 2;
                    ctx.stroke();
                }

                ctx.restore();
            });
        }

        function drawJARVISHand(lm) { /* aynı, pulse kaldırılmış hali */ 
            /* ... önceki stabil versiyon ... */
        }

        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.85,   // biraz düşürdük daha stabil takip için
            minTrackingConfidence: 0.85
        });

        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });

        camera.start();

        // Renk swatch tıklama desteği (fare için test kolaylığı)
        colorPanel.addEventListener('click', e => {
            if (e.target.classList.contains('color-swatch')) {
                currentColor = e.target.dataset.color;
                colorPanel.style.display = 'none';
                isEraser = false;
            }
        });
    </script>
</body>
</html>
