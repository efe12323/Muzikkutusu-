<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantum Field Fermentation</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
    font-family:Arial,sans-serif;
}

canvas{
    width:500px;
    height:500px;
    border:1px solid #333;
    image-rendering:pixelated;
}

button{
    margin-top:10px;
    padding:10px 20px;
    cursor:pointer;
}
</style>
</head>
<body>

<canvas id="canvas" width="200" height="200"></canvas>
<button id="audioBtn">Sesi Başlat</button>

<script>

const W = 200;
const H = 200;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let field = [];
let memory = [];
let velocity = [];
let phase = [];

// ---------------- INIT ----------------

for(let y=0;y<H;y++){

    field[y] = [];
    memory[y] = [];
    velocity[y] = [];
    phase[y] = [];

    for(let x=0;x<W;x++){

        const v = Math.random();

        field[y][x] = v;
        memory[y][x] = v;

        velocity[y][x] =
            (Math.random()-0.5)*0.04;

        phase[y][x] =
            Math.random()*Math.PI*2;
    }
}

// ---------------- AUDIO ----------------

let audioCtx = null;
let osc = null;
let gainNode = null;

document
.getElementById("audioBtn")
.addEventListener("click", startAudio);

function startAudio(){

    if(audioCtx) return;

    audioCtx =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    osc = audioCtx.createOscillator();
    gainNode = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = 220;

    gainNode.gain.value = 0.02;

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start();
}

// ---------------- STEP ----------------

function step(){

    let next = [];

    let totalEnergy = 0;

    for(let y=0;y<H;y++){

        next[y] = [];

        for(let x=0;x<W;x++){

            let sum = 0;
            let count = 0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    const nx=x+dx;
                    const ny=y+dy;

                    if(
                        nx>=0 &&
                        ny>=0 &&
                        nx<W &&
                        ny<H
                    ){
                        sum += field[ny][nx];
                        count++;
                    }
                }
            }

            const avg = sum/count;

            const self = field[y][x];
            const old = memory[y][x];

            const farX =
                (x*7 + y*3) % W;

            const farY =
                (y*11 + x*5) % H;

            const farInfluence =
                field[farY][farX] * 0.05;

            const fermentation =
                Math.sin(old*6.28318)*0.03;

            const force =
                (avg-self)*0.18 +
                fermentation*0.15 +
                farInfluence*0.25;

            velocity[y][x] += force;

            velocity[y][x] *= 0.992;

            velocity[y][x] +=
                (Math.random()-0.5)*0.008;

            let psi =
                self + velocity[y][x];

            psi =
                Math.max(
                    0,
                    Math.min(1,psi)
                );

            next[y][x] = psi;

            memory[y][x] =
                memory[y][x]*0.995 +
                psi*0.005;

            phase[y][x] +=
                velocity[y][x]*4;

            totalEnergy +=
                Math.abs(
                    velocity[y][x]
                );
        }
    }

    field = next;

    // Audio update

    if(osc){

        const energy =
            totalEnergy / (W*H);

        osc.frequency.value =
            120 +
            energy*15000;

        gainNode.gain.value =
            0.01 +
            energy*0.1;
    }
}

// ---------------- RENDER ----------------

function render(){

    const img =
        ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            const v =
                field[y][x];

            const p =
                phase[y][x];

            const r =
                (Math.sin(p)+1)*127.5*v;

            const g =
                (Math.sin(
                    p+2.094
                )+1)*127.5*v;

            const b =
                (Math.sin(
                    p+4.188
                )+1)*127.5*v;

            const i =
                (y*W+x)*4;

            img.data[i] = r;
            img.data[i+1] = g;
            img.data[i+2] = b;
            img.data[i+3] = 255;
        }
    }

    ctx.putImageData(img,0,0);
}

// ---------------- LOOP ----------------

function loop(){

    step();
    render();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
