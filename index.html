<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 3D Holographic UI</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --jarvis-green: #00ff9f;
            --jarvis-glow: #00ff41;
            --dark-bg: #0a0f0a;
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; visibility: hidden; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); }
        
        /* Yatay Üst Panel */
        #ui-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 159, 0.2);
        }

        .btn {
            background: rgba(0, 255, 159, 0.05);
            border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green);
            padding: 8px 15px;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            border-radius: 20px;
            transition: 0.2s;
            pointer-events: none;
        }

        .btn.active {
            background: var(--jarvis-green);
            color: #000;
            box-shadow: 0 0 15px var(--jarvis-glow);
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: var(--jarvis-green);
            font-family: monospace;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="btn active" id="mode-free">Free</div>
        <div class="btn" id="mode-rect">Rect</div>
        <div class="btn" id="mode-circle">Circle</div>
        <div class="btn" id="mode-eraser">Eraser</div>
        <div class="btn" id="btn-undo" style="border-color: #ffb800; color: #ffb800;">Undo</div>
        <div class="btn" id="btn-clear" style="border-color: #ff4b2b; color: #ff4b2b;">Clear All</div>
    </div>

    <div id="status">JARVIS: READY</div>
    <video id="input_video"></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'free';
        let drawings = [];
        let tempShape = null;
        let startPoint = null;
        let grabbedShape = null;
        let lastGrabPoint = null;
        let lastUndoTime = 0;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') {
                const now = Date.now();
                if (now - lastUndoTime > 500) { // Hızlı silmeyi önlemek için bekleme süresi
                    drawings.pop();
                    lastUndoTime = now;
                }
                return;
            }
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                b.classList.remove('active');
                if(b.id === 'mode-' + mode) b.classList.add('active');
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const indexTip = lm[8];
                const thumbTip = lm[4];
                
                const x = indexTip.x * canvas.width;
                const y = indexTip.y * canvas.height;
                const tx = thumbTip.x * canvas.width;
                const ty = thumbTip.y * canvas.height;
                const z = Math.abs(indexTip.z) * 5;

                // 1. ÜST PANEL KONTROLÜ (Yalnızca el ekranın üst kısmındaysa)
                if (indexTip.y < 0.2) { 
                    const btns = document.querySelectorAll('.btn');
                    btns.forEach(btn => {
                        const rect = btn.getBoundingClientRect();
                        // Aynalanmış görüntüde butona denk gelme kontrolü
                        const mirroredX = (1 - indexTip.x) * canvas.width;
                        if (mirroredX > rect.left && mirroredX < rect.right) {
                            const mode = btn.id.replace('mode-', '').replace('btn-', '');
                            setMode(mode);
                        }
                    });
                }

                // 2. TUTMA / SİLME / ÇİZME
                const distance = Math.hypot(x - tx, y - ty);
                const isGrabbing = distance < 35;

                if (isGrabbing && currentMode !== 'eraser') {
                    handleGrab(x, y);
                } else {
                    grabbedShape = null;
                    const isActing = indexTip.y < lm[6].y && lm[12].y > lm[10].y;
                    
                    if (isActing) {
                        if (currentMode === 'eraser') {
                            handleEraser(x, y);
                        } else {
                            handleDrawing(x, y, z);
                        }
                    } else {
                        if (tempShape && currentMode !== 'free') drawings.push(tempShape);
                        tempShape = null;
                        startPoint = null;
                    }
                }
                drawHand(lm);
            }
            renderDrawings();
            ctx.restore();
        }

        function handleGrab(x, y) {
            if (!grabbedShape) {
                for (let i = drawings.length - 1; i >= 0; i--) {
                    const s = drawings[i];
                    if (isPointInShape(x, y, s)) { grabbedShape = s; lastGrabPoint = {x, y}; break; }
                }
            } else {
                const dx = x - lastGrabPoint.x;
                const dy = y - lastGrabPoint.y;
                if (grabbedShape.type === 'free') {
                    grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                } else {
                    grabbedShape.start.x += dx; grabbedShape.start.y += dy;
                    grabbedShape.end.x += dx; grabbedShape.end.y += dy;
                }
                lastGrabPoint = {x, y};
            }
        }

        function handleEraser(x, y) {
            drawings = drawings.filter(s => !isPointInShape(x, y, s));
        }

        function isPointInShape(x, y, s) {
            if (s.type === 'free') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < 30);
            if (s.type === 'rect') return x > Math.min(s.start.x, s.end.x) && x < Math.max(s.start.x, s.end.x) && y > Math.min(s.start.y, s.end.y) && y < Math.max(s.start.y, s.end.y);
            if (s.type === 'circle') return Math.hypot(s.start.x - x, s.start.y - y) < Math.hypot(s.end.x - s.start.x, s.end.y - s.start.y);
            return false;
        }

        function handleDrawing(x, y, z) {
            if (currentMode === 'free') {
                if (!tempShape) {
                    tempShape = { type: 'free', points: [], color: '#00ff9f' };
                    drawings.push(tempShape);
                }
                tempShape.points.push({ x, y, z });
            } else {
                if (!startPoint) startPoint = { x, y, z };
                tempShape = { type: currentMode, start: startPoint, end: { x, y, z }, color: '#00ff9f' };
            }
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(shape => {
                if (!shape) return;
                ctx.beginPath();
                ctx.strokeStyle = shape.type === 'eraser' ? 'rgba(255,0,0,0.5)' : shape.color;
                ctx.shadowBlur = 15;
                ctx.lineWidth = 3;

                if (shape.type === 'free') {
                    shape.points.forEach((p, i) => {
                        ctx.lineWidth = 2 + (p.z * 8);
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                } else if (shape.type === 'rect') {
                    ctx.strokeRect(shape.start.x, shape.start.y, shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                } else if (shape.type === 'circle') {
                    const radius = Math.hypot(shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                    ctx.arc(shape.start.x, shape.start.y, radius, 0, Math.PI * 2);
                }
                ctx.stroke();
            });
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 159, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); }
            for(let i=0; i<canvas.height; i+=50) { ctx.moveTo(0,i); ctx.lineTo(canvas.width, i); }
            ctx.stroke();
        }

        function drawHand(lm) {
            ctx.fillStyle = "white";
            lm.forEach((p, i) => {
                ctx.beginPath();
                const size = (i === 8 || i === 4) ? 8 : 3;
                ctx.arc(p.x * canvas.width, p.y * canvas.height, size + (Math.abs(p.z) * 10), 0, Math.PI*2);
                ctx.fill();
            });
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
