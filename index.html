<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>NFC Kart Analiz Aracı</title>
<style>
  /* ===========================================================
     TEMEL SIFIRLAMA VE KOYU TEMA DEĞİŞKENLERİ
  =========================================================== */
  :root{
    --bg-primary:#0d1117;
    --bg-secondary:#161b22;
    --bg-card:#1c2128;
    --border-color:#30363d;
    --text-primary:#e6edf3;
    --text-secondary:#8b949e;
    --accent:#3fb950;
    --accent-hover:#56d364;
    --danger:#f85149;
    --warning:#d29922;
    --info:#58a6ff;
    --mono:'Courier New', Consolas, monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    background:var(--bg-primary);
    color:var(--text-primary);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  body{
    padding:16px;
    max-width:820px;
    margin:0 auto;
  }

  /* ===========================================================
     ÜST BAŞLIK
  =========================================================== */
  header{
    text-align:center;
    padding:20px 10px 24px;
  }

  header h1{
    font-size:1.5rem;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--text-primary);
  }

  header p{
    color:var(--text-secondary);
    font-size:0.85rem;
    margin-top:6px;
  }

  /* ===========================================================
     UYARI KUTUSU (Desteklenmiyor / Hata)
  =========================================================== */
  .alert{
    padding:14px 16px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:0.9rem;
    line-height:1.5;
    border:1px solid transparent;
  }
  .alert-danger{
    background:rgba(248,81,73,0.1);
    border-color:rgba(248,81,73,0.4);
    color:#ffb4af;
  }
  .alert-warning{
    background:rgba(210,153,34,0.1);
    border-color:rgba(210,153,34,0.4);
    color:#f0c674;
  }
  .alert-info{
    background:rgba(88,166,255,0.1);
    border-color:rgba(88,166,255,0.4);
    color:#8fc4ff;
  }

  /* ===========================================================
     TARAMA BUTONU
  =========================================================== */
  .scan-wrap{
    display:flex;
    justify-content:center;
    margin:20px 0 28px;
  }

  #scanBtn{
    background:linear-gradient(135deg,#238636,#2ea043);
    color:#fff;
    border:none;
    padding:16px 32px;
    border-radius:14px;
    font-size:1.05rem;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(46,160,67,0.35);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    width:100%;
    max-width:320px;
    justify-content:center;
  }

  #scanBtn:active{ transform:scale(0.97); }

  #scanBtn:disabled{
    opacity:0.55;
    cursor:not-allowed;
    box-shadow:none;
  }

  #scanBtn.scanning{
    background:linear-gradient(135deg,#9e6a03,#d29922);
    box-shadow:0 4px 14px rgba(210,153,34,0.35);
  }

  .nfc-icon{
    width:20px;
    height:20px;
    display:inline-block;
    position:relative;
  }
  .nfc-icon::before{
    content:'';
    position:absolute;
    inset:0;
    border:2px solid #fff;
    border-radius:50%;
    border-right-color:transparent;
    border-bottom-color:transparent;
  }
  .scanning .nfc-icon::before{
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ===========================================================
     BİLGİ KARTLARI
  =========================================================== */
  .section-title{
    font-size:0.78rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-secondary);
    margin:22px 0 10px;
    padding-left:2px;
  }

  .card{
    background:var(--bg-card);
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
  }

  .card-title{
    font-size:0.9rem;
    font-weight:600;
    color:var(--info);
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }

  .info-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dashed var(--border-color);
    font-size:0.85rem;
  }
  .info-row:last-child{ border-bottom:none; }

  .info-label{
    color:var(--text-secondary);
    flex-shrink:0;
    min-width:120px;
  }

  .info-value{
    color:var(--text-primary);
    font-family:var(--mono);
    word-break:break-all;
    text-align:right;
    flex:1;
  }

  .value-empty{ color:var(--danger); font-style:italic; }
  .value-encrypted{ color:var(--warning); font-style:italic; }

  /* HEX / ASCII bloklar */
  .data-block{
    background:var(--bg-secondary);
    border:1px solid var(--border-color);
    border-radius:8px;
    padding:10px 12px;
    font-family:var(--mono);
    font-size:0.78rem;
    line-height:1.6;
    word-break:break-all;
    white-space:pre-wrap;
    color:#a5d6ff;
    max-height:200px;
    overflow-y:auto;
  }

  .record-item{
    background:var(--bg-secondary);
    border:1px solid var(--border-color);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
  }
  .record-item:last-child{ margin-bottom:0; }

  .record-badge{
    display:inline-block;
    background:rgba(63,185,80,0.15);
    color:var(--accent-hover);
    border:1px solid rgba(63,185,80,0.35);
    padding:2px 9px;
    border-radius:20px;
    font-size:0.72rem;
    font-weight:600;
    margin-bottom:8px;
  }

  /* ===========================================================
     LOG EKRANI
  =========================================================== */
  #logBox{
    background:#010409;
    border:1px solid var(--border-color);
    border-radius:12px;
    padding:12px;
    font-family:var(--mono);
    font-size:0.75rem;
    height:180px;
    overflow-y:auto;
    line-height:1.6;
  }

  .log-line{
    display:flex;
    gap:8px;
    padding:2px 0;
    border-bottom:1px solid rgba(255,255,255,0.03);
  }

  .log-time{ color:var(--text-secondary); flex-shrink:0; }
  .log-ok{ color:var(--accent-hover); }
  .log-err{ color:var(--danger); }
  .log-info{ color:var(--info); }
  .log-warn{ color:var(--warning); }

  footer{
    text-align:center;
    color:var(--text-secondary);
    font-size:0.72rem;
    margin:26px 0 10px;
  }

  .hidden{ display:none !important; }

  @media (min-width:600px){
    body{ padding:28px; }
    .info-row{ font-size:0.9rem; }
  }
</style>
</head>
<body>

<header>
  <h1>📡 NFC Kart Analiz Aracı</h1>
  <p>Web NFC API ile kart okuma ve detaylı analiz (Android Chrome)</p>
</header>

<!-- Tarayıcı desteği uyarısı buraya JS tarafından enjekte edilecek -->
<div id="alertArea"></div>

<div class="scan-wrap">
  <button id="scanBtn">
    <span class="nfc-icon"></span>
    <span id="scanBtnText">NFC Kartını Oku</span>
  </button>
</div>

<!-- Sonuç alanı: kart okunduğunda doldurulur -->
<div id="resultArea"></div>

<div class="section-title">İşlem Günlüğü (Log)</div>
<div id="logBox"></div>

<footer>Tüm işlemler cihazınızda yerel olarak yapılır, veri sunucuya gönderilmez.</footer>

<script>
/* =========================================================================
   NFC KART ANALİZ ARACI
   -------------------------------------------------------------------------
   Bu betik, Web NFC API (NDEFReader) kullanarak NFC kartlarını tarar,
   okunabilen tüm bilgileri (UID, teknoloji, NDEF kayıtları, ham veri vb.)
   ayrıştırıp ekrana kart/tablo şeklinde basar. Web NFC API tarayıcı ve
   işletim sistemi kısıtları nedeniyle her alanı garanti etmez; bu yüzden
   erişilemeyen her alan için kullanıcıya açık biçimde "Erişim Yok" ya da
   ilgili uyarı mesajı gösterilir.
   ========================================================================= */

  // ------------------------------------------------------------
  // DOM REFERANSLARI
  // ------------------------------------------------------------
  const scanBtn      = document.getElementById('scanBtn');
  const scanBtnText  = document.getElementById('scanBtnText');
  const alertArea    = document.getElementById('alertArea');
  const resultArea   = document.getElementById('resultArea');
  const logBox       = document.getElementById('logBox');

  let abortController = null; // NFC taramasını durdurabilmek için
  let isScanning       = false;

  // ------------------------------------------------------------
  // LOG YARDIMCI FONKSİYONU
  // Her log satırı zaman damgası + tip (ok/err/info/warn) ile yazılır.
  // ------------------------------------------------------------
  function log(message, type = 'info') {
    const time = new Date().toLocaleTimeString('tr-TR', { hour12: false });
    const line = document.createElement('div');
    line.className = 'log-line';

    const typeClass = {
      ok:   'log-ok',
      err:  'log-err',
      info: 'log-info',
      warn: 'log-warn'
    }[type] || 'log-info';

    const icon = {
      ok:   '✅',
      err:  '❌',
      info: 'ℹ️',
      warn: '⚠️'
    }[type] || 'ℹ️';

    line.innerHTML = `<span class="log-time">[${time}]</span><span class="${typeClass}">${icon} ${escapeHtml(message)}</span>`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  // ------------------------------------------------------------
  // HTML KAÇIŞ (XSS önlemi) — okunan veriler ekrana basılırken güvenli hale getirilir
  // ------------------------------------------------------------
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // ------------------------------------------------------------
  // Alan boşsa "Erişim Yok" göstermek için yardımcı fonksiyon
  // ------------------------------------------------------------
  function safeValue(val) {
    if (val === null || val === undefined || val === '') {
      return '<span class="value-empty">Erişim Yok</span>';
    }
    return escapeHtml(val);
  }

  // ------------------------------------------------------------
  // Verinin "anlamlı" olup olmadığını kabaca tahmin eder.
  // Yazdırılabilir ASCII oranı düşükse şifreli/anlamsız kabul edilir.
  // ------------------------------------------------------------
  function isLikelyEncryptedOrBinary(bytes) {
    if (!bytes || bytes.length === 0) return false;
    let printable = 0;
    for (const b of bytes) {
      if (b >= 32 && b <= 126) printable++;
    }
    const ratio = printable / bytes.length;
    return ratio < 0.6; // %60'ın altı yazdırılabilir karakter içeriyorsa şüpheli kabul edilir
  }

  // ------------------------------------------------------------
  // Byte dizisini büyük harf, boşluklu HEX string'e çevirir
  // Örn: [0x0A, 0xFF] -> "0A FF"
  // ------------------------------------------------------------
  function toHex(bytes) {
    if (!bytes || bytes.length === 0) return '';
    return Array.from(bytes)
      .map(b => b.toString(16).toUpperCase().padStart(2, '0'))
      .join(' ');
  }

  // ------------------------------------------------------------
  // Byte dizisini ASCII karşılığına çevirir.
  // Yazdırılamayan karakterler '.' ile gösterilir.
  // ------------------------------------------------------------
  function toAscii(bytes) {
    if (!bytes || bytes.length === 0) return '';
    return Array.from(bytes)
      .map(b => (b >= 32 && b <= 126) ? String.fromCharCode(b) : '.')
      .join('');
  }

  // ------------------------------------------------------------
  // DataView / ArrayBuffer -> Uint8Array normalize eder
  // ------------------------------------------------------------
  function toByteArray(data) {
    if (!data) return new Uint8Array();
    if (data instanceof Uint8Array) return data;
    if (data.buffer) return new Uint8Array(data.buffer, data.byteOffset || 0, data.byteLength);
    if (data instanceof ArrayBuffer) return new Uint8Array(data);
    return new Uint8Array();
  }

  // ------------------------------------------------------------
  // 1) TARAYICI DESTEK KONTROLÜ
  // Web NFC API'si yalnızca Android üzerindeki Chrome'da (HTTPS altında)
  // desteklenir. Desteklenmiyorsa kullanıcıya net bir uyarı gösterilir.
  // ------------------------------------------------------------
  function checkNfcSupport() {
    if (!('NDEFReader' in window)) {
      alertArea.innerHTML = `
        <div class="alert alert-danger">
          <strong>⚠️ Web NFC API Desteklenmiyor</strong><br>
          Bu tarayıcı/cihaz Web NFC API'sini desteklemiyor. Bu özellik yalnızca
          <strong>Android işletim sistemindeki Chrome tarayıcısında</strong> ve
          <strong>HTTPS</strong> bağlantısı üzerinden çalışır. Lütfen sayfayı
          Android cihazınızda Chrome ile açtığınızdan emin olun.
        </div>`;
      scanBtn.disabled = true;
      log('Web NFC API bu tarayıcıda desteklenmiyor.', 'err');
      return false;
    }

    if (window.isSecureContext === false) {
      alertArea.innerHTML = `
        <div class="alert alert-warning">
          <strong>⚠️ Güvenli Bağlantı Gerekli</strong><br>
          Web NFC API yalnızca HTTPS (güvenli) bağlantılarda çalışır. Lütfen sayfayı
          HTTPS üzerinden açın.
        </div>`;
      log('Sayfa güvenli (HTTPS) bağlantı üzerinden açılmamış.', 'warn');
    }

    log('Web NFC API destekleniyor. Taramaya hazır.', 'ok');
    return true;
  }

  // ------------------------------------------------------------
  // 2) TARAMAYI BAŞLAT / DURDUR
  // ------------------------------------------------------------
  scanBtn.addEventListener('click', () => {
    if (isScanning) {
      stopScan();
    } else {
      startScan();
    }
  });

  async function startScan() {
    resultArea.innerHTML = '';
    alertArea.querySelectorAll('.alert-info, .alert-danger.temp').forEach(el => el.remove());

    if (!('NDEFReader' in window)) {
      log('NDEFReader bulunamadı, tarama başlatılamıyor.', 'err');
      return;
    }

    try {
      log('NFC taraması başlatılıyor... Kartı telefonun arkasına yaklaştırın.', 'info');
      abortController = new AbortController();
      const reader = new NDEFReader();

      await reader.scan({ signal: abortController.signal });

      setScanningState(true);

      reader.onreading = (event) => {
        log('Kart algılandı, veriler okunuyor...', 'ok');
        try {
          handleReading(event);
        } catch (err) {
          log('Kart verisi işlenirken hata oluştu: ' + err.message, 'err');
          showFatalCardError(err);
        }
      };

      reader.onreadingerror = () => {
        log('Kart okunamadı: veri bozuk, şifreli veya uyumsuz olabilir.', 'err');
        showReadError();
      };

    } catch (err) {
      handleScanStartError(err);
    }
  }

  function stopScan() {
    if (abortController) {
      abortController.abort();
      abortController = null;
    }
    setScanningState(false);
    log('Tarama kullanıcı tarafından durduruldu.', 'warn');
  }

  function setScanningState(active) {
    isScanning = active;
    scanBtn.classList.toggle('scanning', active);
    scanBtnText.textContent = active ? 'Taramayı Durdur' : 'NFC Kartını Oku';
  }

  // ------------------------------------------------------------
  // TARAMA BAŞLATMA HATALARINI KULLANICI DOSTU MESAJLARA ÇEVİRİR
  // ------------------------------------------------------------
  function handleScanStartError(err) {
    setScanningState(false);
    let msg = 'Tarama başlatılamadı: ' + (err && err.message ? err.message : 'Bilinmeyen hata');
    let friendly = '';

    if (err && err.name === 'NotAllowedError') {
      friendly = 'NFC izni reddedildi. Lütfen tarayıcı ayarlarından NFC iznini etkinleştirin.';
    } else if (err && err.name === 'NotSupportedError') {
      friendly = 'Bu cihaz NFC donanımını desteklemiyor veya NFC kapalı.';
    } else if (err && err.name === 'NotReadableError') {
      friendly = 'NFC donanımına erişilemedi. Cihazınızda NFC özelliğinin açık olduğundan emin olun.';
    } else {
      friendly = 'Beklenmeyen bir hata oluştu. Lütfen NFC ayarlarınızı kontrol edip tekrar deneyin.';
    }

    alertArea.innerHTML = `
      <div class="alert alert-danger temp">
        <strong>❌ Tarama Başlatılamadı</strong><br>${escapeHtml(friendly)}
      </div>`;

    log(msg, 'err');
  }

  function showReadError() {
    resultArea.innerHTML = `
      <div class="alert alert-warning">
        <strong>⚠️ Okuma Hatası</strong><br>
        Kart okunamadı. Veri okunabildi ancak şifreli veya anlamlandırılamadı ya da kart
        desteklenmeyen bir formatta olabilir. Lütfen kartı tekrar okutmayı deneyin.
      </div>`;
  }

  function showFatalCardError(err) {
    resultArea.innerHTML = `
      <div class="alert alert-danger">
        <strong>❌ Kart İşlenemedi</strong><br>
        ${escapeHtml(err.message || 'Bilinmeyen bir hata oluştu.')}
      </div>`;
  }

  // ------------------------------------------------------------
  // 3) OKUNAN KARTIN İŞLENMESİ
  // NDEFReadingEvent -> serialNumber ve message (NDEF kayıtları) içerir.
  // ------------------------------------------------------------
  function handleReading(event) {
    const serialNumber = event.serialNumber || null; // UID / Seri Numarası (tarayıcıya göre değişir)
    const message = event.message;                    // NDEFMessage: records[] içerir

    log(`Seri numarası: ${serialNumber || 'alınamadı'}`, serialNumber ? 'ok' : 'warn');
    log(`Toplam NDEF kaydı: ${message && message.records ? message.records.length : 0}`, 'info');

    renderResult(serialNumber, message);
  }

  // ------------------------------------------------------------
  // 4) SONUÇLARI EKRANA BASMA
  // ------------------------------------------------------------
  function renderResult(serialNumber, message) {
    resultArea.innerHTML = '';

    // ---- KART KİMLİĞİ KARTI (UID / Seri No / Teknoloji) ----
    const idCard = document.createElement('div');
    idCard.className = 'card';

    // UID genelde Web NFC API tarafından ayrı sunulmaz; serialNumber ile aynı kabul edilir.
    const uidDisplay = serialNumber
      ? formatSerialNumber(serialNumber)
      : null;

    idCard.innerHTML = `
      <div class="card-title">🪪 Kart Kimliği</div>
      <div class="info-row">
        <span class="info-label">UID (Kart Kimliği)</span>
        <span class="info-value">${safeValue(uidDisplay)}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Seri Numarası</span>
        <span class="info-value">${safeValue(serialNumber)}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Kart Teknolojisi</span>
        <span class="info-value">${safeValue(detectTechnology(serialNumber))}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Desteklenen Kayıtlar</span>
        <span class="info-value">${safeValue(message && message.records ? message.records.length + ' adet NDEF kaydı' : null)}</span>
      </div>
    `;
    resultArea.appendChild(idCard);

    // ---- NDEF KAYITLARI ----
    const recordsWrapTitle = document.createElement('div');
    recordsWrapTitle.className = 'section-title';
    recordsWrapTitle.textContent = 'NDEF Kayıtları';
    resultArea.appendChild(recordsWrapTitle);

    if (!message || !message.records || message.records.length === 0) {
      const emptyCard = document.createElement('div');
      emptyCard.className = 'card';
      emptyCard.innerHTML = `<div class="info-row"><span class="info-value value-empty">Erişim Yok — kart üzerinde okunabilir NDEF kaydı bulunamadı</span></div>`;
      resultArea.appendChild(emptyCard);
      log('Kartta NDEF kaydı bulunamadı.', 'warn');
      return;
    }
