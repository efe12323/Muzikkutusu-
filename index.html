<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field Image Engine v3</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    font-family:Arial;
    color:white;
}

canvas{
    border:1px solid #222;
    image-rendering: pixelated;
    width:600px;
    height:600px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="220" height="220"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=220,H=220;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], velocity=[], energy=[];

// INIT FIELD
for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];
    energy[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        velocity[y][x]=(Math.random()-0.5)*0.05;
        energy[y][x]=0;
    }
}

// AUDIO SYSTEM (GLOBAL FIELD ENERGY)
let audioCtx;
let masterGain;
let osc;

function startAudio(){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    osc=audioCtx.createOscillator();
    osc.type="sine";

    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.02;

    osc.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    osc.start();
}

// FIELD UPDATE (REAL DYNAMICS)
function step(){

    let next=[], velNext=[], energyNext=[];

    let totalEnergy=0;

    for(let y=0;y<H;y++){
        next[y]=[];
        velNext[y]=[];
        energyNext[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            // 🔥 WAVE EQUATION STYLE
            let force=(avg - field[y][x]) * 0.22;

            velocity[y][x]+=force;
            velocity[y][x]*=0.94;

            // micro noise (kuantum fluctuation)
            velocity[y][x]+=(Math.random()-0.5)*0.02;

            let v=field[y][x]+velocity[y][x];

            v=Math.max(0,Math.min(1,v));

            next[y][x]=v;
            velNext[y][x]=velocity[y][x];

            // ENERGY FIELD
            let e=Math.abs(velocity[y][x]);
            energyNext[y][x]=e;

            totalEnergy+=e;
        }
    }

    field=next;
    velocity=velNext;
    energy=energyNext;

    // AUDIO CONTROL (GLOBAL FIELD STATE)
    if(osc){
        osc.frequency.value=120 + totalEnergy*20;
    }
}

// COLOR (STRUCTURE EMERGENCE)
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];
            let e=energy[y][x];

            // structure-based shading
            let shade=v + e*0.8;

            let r=shade*180;
            let g=shade*220;
            let b=(1-shade)*255;

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
