<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony Stark Neon HUD - 3D Laser Draw</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/EffectComposer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/RenderPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.168.0/examples/js/postprocessing/UnrealBloomPass.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    
    <style>
        body { margin:0; overflow:hidden; background:#000; }
        #loading { 
            position: fixed; inset:0; background:#000; 
            display:flex; align-items:center; justify-content:center; z-index:100; 
        }
        .loader { width:60px; height:60px; border:5px solid #111; border-top:5px solid #00ff9d; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #info {
            position: absolute; top:10px; left:10px; color:#00ff9d; font-family:Arial; font-size:14px; pointer-events:none; text-shadow:0 0 10px #00ff9d;
        }
    </style>
</head>
<body>

<div id="loading"><div class="loader"></div></div>
<div id="info">İşaret parmağı dik → Çiz | Pinch → Taşı | R tuşu → Renk değiştir</div>

<video id="input_video" playsinline style="display:none;"></video>

<script>
// ────────────────────────────────────────────────
// Three.js Sahne Kurulumu
// ────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000814);
scene.fog = new THREE.FogExp2(0x000814, 0.0008);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Bloom efekti (neon glow için olmazsa olmaz)
const composer = new THREE.EffectComposer(renderer);
const renderPass = new THREE.RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomPass = new THREE.UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.5,    // strength
    0.4,    // radius
    0.85    // threshold
);
composer.addPass(bloomPass);

// Hafif grid (HUD havası için)
const grid = new THREE.GridHelper(20, 40, 0x004d40, 0x001a14);
grid.position.y = -2;
scene.add(grid);

// ────────────────────────────────────────────────
// Değişkenler
// ────────────────────────────────────────────────
let drawings = [];          // { points: [{x,y,z}], color: 0x00ff9d, line: THREE.Line }
let currentPath = null;
let selectedDrawing = null;
let isDragging = false;
let lastPinchPos = new THREE.Vector3();

const colors = [0x00ff9d, 0x00f2ff, 0xff006e, 0xffff00, 0xff6600]; // yeşil → mavi → pembe → sarı → turuncu
let currentColorIndex = 0;
let currentColor = colors[0];

// El iskeleti için LineSegments
let handSkeleton;

// ────────────────────────────────────────────────
// MediaPipe Hands
// ────────────────────────────────────────────────
const videoElement = document.getElementById('input_video');
const loading = document.getElementById('loading');

const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.8,
    minTrackingConfidence: 0.8
});

hands.onResults(onResults);

const cameraFeed = new Camera(videoElement, {
    onFrame: async () => await hands.send({image: videoElement}),
    width: 1280,
    height: 720
});
cameraFeed.start();

// ────────────────────────────────────────────────
// Yardımcı Fonksiyonlar
// ────────────────────────────────────────────────
function createNeonLine(points, color) {
    const geometry = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p.x, p.y, p.z)));
    const material = new THREE.LineBasicMaterial({
        color: color,
        linewidth: 4,
        transparent: true,
        opacity: 0.9
    });
    const line = new THREE.Line(geometry, material);
    
    // Glow için ekstra kalın glow line (bloom ile parlar)
    const glowMat = new THREE.LineBasicMaterial({color: color, transparent:true, opacity:0.3, linewidth:8});
    const glowLine = new THREE.Line(geometry, glowMat);
    line.add(glowLine);
    
    scene.add(line);
    return line;
}

function mapTo3D(x, y, estZ = 0) {
    // 2D → 3D tahmin (basit perspektif + el boyutu derinlik proxy)
    const worldX = (x - 0.5) * 6;           // genişlik ölçeği
    const worldY = (0.5 - y) * 3.4;         // yükseklik (ters)
    const worldZ = estZ * -4 + 1;           // 0-1 arası → yakın-uzak
    return new THREE.Vector3(worldX, worldY, worldZ);
}

function isIndexUpOnly(landmarks) {
    const idx = landmarks[8];
    const pip = landmarks[6];
    return idx.y < pip.y && 
           landmarks[12].y > landmarks[10].y && 
           landmarks[16].y > landmarks[14].y && 
           landmarks[20].y > landmarks[18].y;
}

function isPinch(landmarks) {
    const dist = Math.hypot(
        landmarks[4].x - landmarks[8].x,
        landmarks[4].y - landmarks[8].y
    );
    return dist < 0.06; // eşik (ayarlayabilirsin)
}

function getPinchMid(landmarks) {
    const tx = (landmarks[4].x + landmarks[8].x) / 2;
    const ty = (landmarks[4].y + landmarks[8].y) / 2;
    const estZ = Math.abs(landmarks[4].z - landmarks[8].z) * 5; // basit derinlik
    return mapTo3D(tx, ty, estZ);
}

// ────────────────────────────────────────────────
// Ana İşlem
// ────────────────────────────────────────────────
function onResults(results) {
    if (loading.style.display !== 'none') loading.style.display = 'none';

    // Eski el iskeletini temizle
    if (handSkeleton) scene.remove(handSkeleton);

    if (results.multiHandLandmarks?.length > 0) {
        const hand = results.multiHandLandmarks[0];

        // El iskeleti çiz (neon mavi)
        const skelPoints = [];
        const connections = [
            [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16],
            [13,17],[17,18],[18,19],[19,20], [0,17]
        ];
        connections.forEach(([a,b]) => {
            skelPoints.push(mapTo3D(hand[a].x, hand[a].y, hand[a].z * 5));
            skelPoints.push(mapTo3D(hand[b].x, hand[b].y, hand[b].z * 5));
        });
        const skelGeo = new THREE.BufferGeometry().setFromPoints(skelPoints);
        const skelMat = new THREE.LineBasicMaterial({color: 0x00d4ff, linewidth:3});
        handSkeleton = new THREE.LineSegments(skelGeo, skelMat);
        scene.add(handSkeleton);

        const indexTip = hand[8];
        const thumbTip = hand[4];
        const estZ = (Math.abs(indexTip.z) + Math.abs(thumbTip.z)) / 2 * 8; // derinlik proxy

        const tipPos = mapTo3D(indexTip.x, indexTip.y, estZ);

        if (isIndexUpOnly(hand)) {
            if (!currentPath) {
                currentPath = { points: [], color: currentColor };
                drawings.push(currentPath);
            }
            currentPath.points.push(tipPos);
            // Spark efekti istersen buraya particle ekleyebilirsin
        } else {
            currentPath = null;
        }

        if (isPinch(hand)) {
            const midPos = getPinchMid(hand);

            if (!isDragging) {
                // En yakın çizgiyi bul (basit mesafe)
                let minDist = Infinity;
                drawings.forEach(d => {
                    d.points.forEach(p => {
                        const dist = p.distanceTo(midPos);
                        if (dist < minDist) {
                            minDist = dist;
                            selectedDrawing = d;
                        }
                    });
                });
                if (minDist < 0.4) isDragging = true; // eşik
            }

            if (isDragging && selectedDrawing) {
                const delta = midPos.clone().sub(lastPinchPos);
                selectedDrawing.points.forEach(p => p.add(delta));
                // Line'ı güncelle (performans için her frame geometry güncelle)
                if (selectedDrawing.line) {
                    selectedDrawing.line.geometry.setFromPoints(selectedDrawing.points);
                    selectedDrawing.line.children[0].geometry.setFromPoints(selectedDrawing.points);
                }
            }
            lastPinchPos.copy(midPos);
        } else {
            isDragging = false;
            selectedDrawing = null;
        }

        // Çizgileri güncelle / yeniden oluştur (basitlik için her frame)
        drawings.forEach(d => {
            if (!d.line && d.points.length > 1) {
                d.line = createNeonLine(d.points, d.color);
                scene.add(d.line);
            } else if (d.line) {
                d.line.geometry.setFromPoints(d.points);
                d.line.children[0].geometry.setFromPoints(d.points);
            }
        });
    } else {
        currentPath = null;
        isDragging = false;
    }

    composer.render();
}

// Resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
});

// Renk değiştir (R tuşu)
window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') {
        currentColorIndex = (currentColorIndex + 1) % colors.length;
        currentColor = colors[currentColorIndex];
        document.getElementById('info').innerText = `Renk: ${currentColor.toString(16)} (R ile değiştir)`;
    }
});

// Animasyon döngüsü (sürekli render)
function animate() {
    requestAnimationFrame(animate);
    // composer zaten render ediyor, ekstra gerek yok
}
animate();

</script>
</body>
</html>
