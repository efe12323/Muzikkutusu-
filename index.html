<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Meaning Field v4</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #222;
    image-rendering: pixelated;
    width:600px;
    height:600px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="220" height="220"></canvas>
<button onclick="startAudio()">Sesi Aç</button>

<script>

const W=220,H=220;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

const EMPTY=0;
const WATER=1;
const ROCK=2;
const ENERGY=3;

let field=[], velocity=[], type=[];

// ---------------- INIT ----------------
for(let y=0;y<H;y++){
    field[y]=[];
    velocity[y]=[];
    type[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        velocity[y][x]=0;

        // 🔥 meaning seeds (çok az sayıda “çekirdek”)
        if(Math.random()<0.015){
            type[y][x]=ENERGY;
        }else if(Math.random()<0.02){
            type[y][x]=ROCK;
        }else if(Math.random()<0.05){
            type[y][x]=WATER;
        }else{
            type[y][x]=EMPTY;
        }
    }
}

// ---------------- AUDIO ----------------
let audioCtx;
let master;

function startAudio(){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    master=audioCtx.createGain();
    master.gain.value=0.02;
    master.connect(audioCtx.destination);

    for(let i=0;i<40;i++){
        let osc=audioCtx.createOscillator();
        let gain=audioCtx.createGain();

        osc.type="sine";
        osc.frequency.value=100+Math.random()*500;

        gain.gain.value=0.001;

        osc.connect(gain);
        gain.connect(master);

        osc.start();
    }
}

// ---------------- FIELD STEP ----------------
function step(){

    let next=[], velNext=[];

    let totalEnergy=0;

    for(let y=0;y<H;y++){
        next[y]=[];
        velNext[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            let v=field[y][x];
            let t=type[y][x];

            let force=0;

            // 🌊 WATER: yayılma
            if(t===WATER){
                force=(avg-v)*0.3;
            }

            // 🪨 ROCK: stabil
            if(t===ROCK){
                force=(avg-v)*0.05;
            }

            // ⚡ ENERGY: itme / kaos
            if(t===ENERGY){
                force=(avg-v)*0.4 + (Math.random()-0.5)*0.05;
            }

            // EMPTY: normal fizik
            if(t===EMPTY){
                force=(avg-v)*0.2;
            }

            velocity[y][x]+=force;
            velocity[y][x]*=0.95;

            v+=velocity[y][x];

            v=Math.max(0,Math.min(1,v));

            next[y][x]=v;
            velNext[y][x]=velocity[y][x];

            totalEnergy+=Math.abs(velocity[y][x]);
        }
    }

    field=next;
    velocity=velNext;

    // 🔊 AUDIO = GLOBAL FIELD ENERGY
    if(master){
        master.gain.value=0.01 + totalEnergy*0.002;
    }
}

// ---------------- RENDER ----------------
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];
            let t=type[y][x];

            let r,g,b;

            // 🎨 MEANING-BASED COLOR SYSTEM
            if(t===WATER){
                r=30;
                g=100+v*100;
                b=200;
            }
            else if(t===ROCK){
                r=120+v*80;
                g=90;
                b=60;
            }
            else if(t===ENERGY){
                r=255*v;
                g=200*v;
                b=50+v*200;
            }
            else{
                r=20+v*80;
                g=20+v*120;
                b=60+v*150;
            }

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
