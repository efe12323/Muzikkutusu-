<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field Fermentation System</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:500px;
    height:500px;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="200" height="200"></canvas>
<button onclick="startAudio()">Sesi Başlat</button>

<script>

const W=200;
const H=200;

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let field=[];
let memory=[];

// ---------------- INIT ----------------

for(let y=0;y<H;y++){

    field[y]=[];
    memory[y]=[];

    for(let x=0;x<W;x++){

        let v=Math.random();

        field[y][x]=v;
        memory[y][x]=v;
    }
}

// ---------------- AUDIO ----------------

let audioCtx;
let nodes=[];

function startAudio(){

    if(audioCtx) return;

    audioCtx =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    for(let i=0;i<30;i++){

        let osc=audioCtx.createOscillator();
        let gain=audioCtx.createGain();

        osc.type="sine";

        osc.frequency.value=
            100+Math.random()*800;

        gain.gain.value=0.015;

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        nodes.push({
            osc,
            gain
        });
    }
}

// ---------------- FIELD ----------------

function step(){

    let next=[];

    for(let y=0;y<H;y++){

        next[y]=[];

        for(let x=0;x<W;x++){

            let sum=0;
            let count=0;

            // yakın etkileşim

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx;
                    let ny=y+dy;

                    if(
                        nx>=0 &&
                        ny>=0 &&
                        nx<W &&
                        ny<H
                    ){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            let self=field[y][x];
            let old=memory[y][x];

            // uzak alan etkisi

            let farX=(x+40)%W;
            let farY=(y+40)%H;

            let farInfluence=
                field[farY][farX]*0.05;

            // fermantasyon

            let fermentation=
                Math.sin(old*6.28318)*0.03;

            let psi=
                self*0.55 +
                avg*0.30 +
                old*0.15 +
                farInfluence +
                fermentation +
                (Math.random()-0.5)*0.01;

            psi=Math.max(0,Math.min(1,psi));

            next[y][x]=psi;

            // hafıza güncelle

            memory[y][x]=
                memory[y][x]*0.98 +
                psi*0.02;

            // ses bağlantısı

            if(nodes.length){

                let idx=
                    (x+y)%nodes.length;

                let freq=
                    120 +
                    psi*900 +
                    fermentation*300;

                nodes[idx]
                    .osc
                    .frequency
                    .value=freq;
            }
        }
    }

    field=next;
}

// ---------------- RENDER ----------------

function render(){

    let img=
        ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];

            let r=
                Math.sin(v*12)*127+128;

            let g=
                Math.sin(v*12+2)*127+128;

            let b=
                Math.sin(v*12+4)*127+128;

            let i=(y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=b;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

// ---------------- LOOP ----------------

function loop(){

    step();
    render();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
