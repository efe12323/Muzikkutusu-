<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Quantum Field Alive</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    color:white;
    font-family:Arial;
}

canvas{
    border:1px solid #333;
    image-rendering: pixelated;
    width:500px;
    height:500px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="200" height="200"></canvas>
<button onclick="startAudio()">Sesi Aç (Alanı Dinle)</button>

<script>

const W=200,H=200;
const c=document.getElementById("c");
const ctx=c.getContext("2d");

let field=[], phase=[], velocity=[];

// INIT (FULL RANDOM FIELD - NO STRUCTURE YET)
for(let y=0;y<H;y++){
    field[y]=[];
    phase[y]=[];
    velocity[y]=[];

    for(let x=0;x<W;x++){
        field[y][x]=Math.random();
        phase[y][x]=Math.random()*Math.PI*2;
        velocity[y][x]=(Math.random()-0.5)*0.05;
    }
}

// AUDIO (FULL FIELD NOISE - ORGANIC)
let audioCtx;
let masterGain;

function startAudio(){

    audioCtx = new (window.AudioContext||window.webkitAudioContext)();

    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);

    let data = buffer.getChannelData(0);

    for(let i=0;i<bufferSize;i++){
        // field-based noise instead of pure random
        data[i] = Math.sin(i*0.001) * (Math.random()*2-1);
    }

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.03;

    source.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    source.start();
}

// FIELD EVOLUTION (REAL QUANTUM-LIKE COUPLING)
function step(){

    let next=[], velNext=[], phaseNext=[];

    for(let y=0;y<H;y++){
        next[y]=[];
        velNext[y]=[];
        phaseNext[y]=[];

        for(let x=0;x<W;x++){

            let sum=0,count=0;

            for(let dy=-1;dy<=1;dy++){
                for(let dx=-1;dx<=1;dx++){

                    let nx=x+dx,ny=y+dy;

                    if(nx>=0&&ny>=0&&nx<W&&ny<H){
                        sum+=field[ny][nx];
                        count++;
                    }
                }
            }

            let avg=sum/count;

            // wave interaction
            velocity[y][x] += (avg - field[y][x]) * 0.2;

            velocity[y][x] *= 0.95;

            velocity[y][x] += Math.sin(phase[y][x]) * 0.01;

            let value = field[y][x] + velocity[y][x];

            value = Math.max(0,Math.min(1,value));

            next[y][x] = value;

            // phase evolves (THIS CREATES COLOR + MOTION)
            phaseNext[y][x] = phase[y][x] + velocity[y][x]*2;

            velNext[y][x] = velocity[y][x];

            // AUDIO FEEDBACK (GLOBAL ENERGY)
            if(masterGain){
                masterGain.gain.value =
                    0.01 +
                    Math.abs(velocity[y][x]) * 0.2;
            }
        }
    }

    field=next;
    velocity=velNext;
    phase=phaseNext;
}

// COLOR = PURE QUANTUM PHASE FIELD (NO PALETTE)
function render(){

    let img=ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let v=field[y][x];
            let p=phase[y][x];

            // PURE EMERGENT COLOR (NO IF/ELSE PALETTE)
            let r = Math.sin(p) * 127 + 128;
            let g = Math.sin(p + 2.0) * 127 + 128;
            let b = Math.sin(p + 4.0) * 127 + 128;

            let i=(y*W+x)*4;

            img.data[i]=r * v;
            img.data[i+1]=g * v;
            img.data[i+2]=b * v;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){
    step();
    render();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
