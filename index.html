<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS Holographic UI v3.5</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #0a0f0a; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; visibility: hidden; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); }
        
        #ui-panel {
            position: absolute; top: 10px; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: center; gap: 8px; padding: 0 10px;
        }

        .btn {
            background: rgba(0, 40, 20, 0.6); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 8px 12px; font-size: 11px;
            text-transform: uppercase; border-radius: 6px; backdrop-filter: blur(8px);
        }

        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 15px var(--jarvis-glow); }
        #status { position: absolute; bottom: 15px; left: 15px; color: var(--jarvis-green); font-size: 10px; font-family: monospace; z-index: 5; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <div class="btn active" id="mode-draw">Draw</div>
        <div class="btn" id="mode-rect">Rect</div>
        <div class="btn" id="mode-circle">Circle</div>
        <div class="btn" id="btn-undo" style="border-color: #ffb800; color: #ffb800;">Undo</div>
        <div class="btn" id="btn-clear" style="border-color: #ff4b2b; color: #ff4b2b;">Clear</div>
    </div>

    <div id="status">CORE_SYSTEM: ACTIVE // HAND_TRACKING_ON</div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw';
        let drawings = [];
        let tempShape = null;
        let startPoint = null;
        let grabbedShape = null;
        let lastGrabPoint = null;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                b.classList.remove('active');
                if(b.id === 'mode-' + mode) b.classList.add('active');
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const indexTip = lm[8];
                const thumbTip = lm[4];
                
                const x = indexTip.x * canvas.width;
                const y = indexTip.y * canvas.height;
                const tx = thumbTip.x * canvas.width;
                const ty = thumbTip.y * canvas.height;

                // 1. ÜST PANEL SEÇİMİ (Aynalanmış X ekseni ile)
                if (indexTip.y < 0.15) {
                    const mirX = (1 - indexTip.x) * canvas.width;
                    document.querySelectorAll('.btn').forEach(btn => {
                        const r = btn.getBoundingClientRect();
                        if (mirX > r.left && mirX < r.right) setMode(btn.id.replace('mode-', '').replace('btn-', ''));
                    });
                }

                // 2. TUTMA KONTROLÜ (Mesafe eşiği)
                const dist = Math.hypot(x - tx, y - ty);
                const isGrabbing = dist < 40;

                if (isGrabbing) {
                    tempShape = null; 
                    startPoint = null;
                    if (!grabbedShape) {
                        // Katman katman kontrol: En son çizilenden (en üstteki) başla
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(x, y, drawings[i])) {
                                grabbedShape = drawings[i];
                                lastGrabPoint = {x, y};
                                break;
                            }
                        }
                    } else {
                        moveShape(x, y);
                    }
                } else {
                    grabbedShape = null;
                    // 3. ÇİZİM MANTIĞI
                    if (indexTip.y < lm[6].y && lm[12].y > lm[10].y) {
                        handleDrawing(x, y, Math.abs(indexTip.z));
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null;
                        startPoint = null;
                    }
                }
                
                // ELİ ÇİZ (Sadece noktalar değil, tüm iskelet)
                drawHandFull(lm, isGrabbing);
            }
            renderDrawings();
            ctx.restore();
        }

        function checkHit(x, y, s) {
            const margin = 40;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < margin);
            if (s.type === 'rect') {
                const minX = Math.min(s.start.x, s.end.x) - margin;
                const maxX = Math.max(s.start.x, s.end.x) + margin;
                const minY = Math.min(s.start.y, s.end.y) - margin;
                const maxY = Math.max(s.start.y, s.end.y) + margin;
                return x > minX && x < maxX && y > minY && y < maxY;
            }
            if (s.type === 'circle') {
                const r = Math.hypot(s.end.x - s.start.x, s.end.y - s.start.y);
                return Math.hypot(s.start.x - x, s.start.y - y) < r + margin;
            }
            return false;
        }

        function moveShape(x, y) {
            const dx = x - lastGrabPoint.x;
            const dy = y - lastGrabPoint.y;
            if (grabbedShape.type === 'draw') {
                grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
            } else {
                grabbedShape.start.x += dx; grabbedShape.start.y += dy;
                grabbedShape.end.x += dx; grabbedShape.end.y += dy;
            }
            lastGrabPoint = {x, y};
        }

        function handleDrawing(x, y, z) {
            if (currentMode === 'draw') {
                if (!tempShape) {
                    tempShape = { type: 'draw', points: [], color: '#00ff9f' };
                    drawings.push(tempShape);
                }
                tempShape.points.push({ x, y, z });
            } else {
                if (!startPoint) startPoint = { x, y, z };
                tempShape = { type: currentMode, start: startPoint, end: { x, y, z }, color: '#00ff9f' };
            }
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(shape => {
                if (!shape) return;
                ctx.beginPath();
                ctx.strokeStyle = (shape === grabbedShape) ? "#fff" : shape.color;
                ctx.lineWidth = (shape === grabbedShape) ? 5 : 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = shape.color;

                if (shape.type === 'draw') {
                    shape.points.forEach((p, i) => {
                        if (i === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                } else if (shape.type === 'rect') {
                    ctx.strokeRect(shape.start.x, shape.start.y, shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                } else if (shape.type === 'circle') {
                    const radius = Math.hypot(shape.end.x - shape.start.x, shape.end.y - shape.start.y);
                    ctx.arc(shape.start.x, shape.start.y, radius, 0, Math.PI * 2);
                }
                ctx.stroke();
            });
        }

        function drawHandFull(landmarks, isGrabbing) {
            // Mediapipe Drawing Utils kullanımı
            drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {color: '#00ff9f', lineWidth: 2});
            drawLandmarks(ctx, landmarks, {
                color: isGrabbing ? '#ff4b2b' : '#ffffff',
                lineWidth: 1,
                radius: (data) => (data.index === 8 || data.index === 4) ? 6 : 2
            });
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75, minTrackingConfidence: 0.75 });
        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
    </script>
</body>
</html>
