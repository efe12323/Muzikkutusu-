<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Neon Draw - Düzeltildi</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --jarvis-green: #00ff9f;
            --jarvis-glow: #00ff41;
            --dark-bg: #0a0f0a;
        }

        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--dark-bg); font-family:'Courier New',monospace; }
        #input_video { position:absolute; visibility:hidden; width:1px; height:1px; transform:scaleX(-1); }
        #output_canvas { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:5; transform:scaleX(-1); image-rendering:pixelated; }

        #loading-screen { position:fixed; inset:0; background:#000; display:flex; justify-content:center; align-items:center; z-index:100; color:var(--jarvis-green); font-size:1.4rem; }
        .loader { width:60px; height:60px; border:4px solid #111; border-top:4px solid var(--jarvis-green); border-radius:50%; animation:spin 1.2s linear infinite; }
        @keyframes spin { 100% { transform:rotate(360deg); } }

        /* Renk butonu ve panel - biraz daha yukarı taşıdık */
        #color-button {
            position: absolute; bottom: 120px; left: 30px; z-index: 20;
            width: 80px; height: 80px; border-radius: 50%;
            background: rgba(0,255,140,0.2); border: 3px solid #00ff9f;
            box-shadow: 0 0 25px #00ff9f;
            transition: all 0.2s;
        }
        #color-button.active { transform: scale(1.12); box-shadow: 0 0 40px #00ffff; }

        #color-panel {
            position: absolute; bottom: 220px; left: 30px; z-index: 20;
            background: rgba(10,20,15,0.8); border: 2px solid #00ff9f; border-radius: 16px;
            padding: 15px; display: none; flex-direction: row; gap: 14px;
            box-shadow: 0 0 35px rgba(0,255,140,0.6);
        }
        .color-swatch {
            width: 55px; height: 55px; border-radius: 50%;
            border: 4px solid #222; cursor: pointer; transition: all 0.18s;
            box-shadow: 0 0 18px currentColor;
        }
        .color-swatch:hover { transform: scale(1.2); border-color: #fff; }
    </style>
</head>
<body>

    <div id="loading-screen"><div class="loader"></div></div>
    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="color-button"></div>
    <div id="color-panel">
        <div class="color-swatch" style="background:#00ff9f;" data-color="#00ff9f"></div>
        <div class="color-swatch" style="background:#00ffff;" data-color="#00ffff"></div>
        <div class="color-swatch" style="background:#ff00aa;" data-color="#ff00aa"></div>
        <div class="color-swatch" style="background:#ffff00;" data-color="#ffff00"></div>
        <div class="color-swatch" style="background:#ff8800;" data-color="#ff8800"></div>
    </div>

    <script>
        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading-screen');
        const colorButton = document.getElementById('color-button');
        const colorPanel = document.getElementById('color-panel');

        let drawings = [];
        let particles = [];
        let currentPath = null;
        let currentColor = '#00ff9f';
        let isEraser = false;
        let colorPanelOpen = false;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Spark { /* aynı kaldı, kısalttım */ 
            constructor(x,y){this.x=x;this.y=y;const a=Math.random()*Math.PI*2,f=Math.random()*12+8;this.vx=Math.cos(a)*f;this.vy=Math.sin(a)*f;this.life=1;this.decay=Math.random()*0.035+0.018;}
            update(){this.vx*=0.96;this.vy*=0.96;this.vy+=0.38;this.x+=this.vx;this.y+=this.vy;this.life-=this.decay;}
            draw(){if(this.life<=0)return;let g=255*this.life,b=180*this.life;ctx.save();ctx.globalAlpha=this.life*0.9;ctx.strokeStyle=`rgb(0,\( {g}, \){b})`;ctx.lineWidth=2.2*this.life;ctx.shadowBlur=12*this.life;ctx.shadowColor=`rgba(0,255,140,${this.life})`;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-this.vx*1.2,this.y-this.vy*1.2);ctx.stroke();ctx.restore();}
        }
        function addSparks(x,y,c=5){for(let i=0;i<c;i++)particles.push(new Spark(x,y));}

        function dist(a,b){return Math.hypot((a.x-b.x)*canvas.width,(a.y-b.y)*canvas.height);}

        function isIndexFingerUp(lm){
            return lm[8].y < lm[6].y * 0.9 && 
                   lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
        }

        function isFist(lm){
            // Daha güvenilir yumruk algılama: parmak uçları dip noktalara yakın
            const threshold = 0.92;
            return lm[8].y  > lm[5].y  * threshold &&
                   lm[12].y > lm[9].y  * threshold &&
                   lm[16].y > lm[13].y * threshold &&
                   lm[20].y > lm[17].y * threshold;
        }

        function drawHoloGrid(){
            const size=70, t=Date.now()*0.0004, pulse=Math.sin(t*2)*0.015+0.07;
            ctx.strokeStyle=`rgba(0,255,140,${pulse})`; ctx.lineWidth=1.1;
            for(let x=0;x<canvas.width;x+=size){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();}
            for(let y=0;y<canvas.height;y+=size){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();}
        }

        function onResults(results){
            if(loading.style.display!=='none') loading.style.display='none';

            ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle='rgba(10,15,10,0.4)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            drawHoloGrid();

            // Renk butonu hover/click algılama (basitleştirildi)
            if(results.multiHandLandmarks?.length > 0){
                const lm = results.multiHandLandmarks[0];
                const tip = lm[8];
                const ix = tip.x * canvas.width;
                const iy = tip.y * canvas.height;

                const btnRect = colorButton.getBoundingClientRect();
                const btnX = btnRect.left + btnRect.width/2;
                const btnY = btnRect.top  + btnRect.height/2;
                const distToBtn = Math.hypot(ix - btnX, iy - btnY);

                // Butona işaret parmağıyla dokununca panel aç/kapa
                if(distToBtn < 70 && isIndexFingerUp(lm)){
                    colorButton.classList.add('active');
                    if(!colorPanelOpen){
                        colorPanelOpen = true;
                        colorPanel.style.display = 'flex';
                    }
                } else {
                    colorButton.classList.remove('active');
                }

                // Panel açıkken renk seçimi
                if(colorPanelOpen && isIndexFingerUp(lm)){
                    const sw
