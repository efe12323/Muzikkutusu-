<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergent World Prototype</title>

<style>
body{
    margin:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
}

canvas{
    width:700px;
    height:700px;
    image-rendering:pixelated;
    border:1px solid #222;
}

button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<canvas id="c" width="220" height="220"></canvas>
<button id="audioBtn">Sesi Başlat</button>

<script>

const W=220;
const H=220;

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let A=[];
let B=[];

for(let y=0;y<H;y++){

    A[y]=[];
    B[y]=[];

    for(let x=0;x<W;x++){

        A[y][x]=1;
        B[y][x]=0;
    }
}

// başlangıç çekirdekleri

for(let i=0;i<25;i++){

    let cx=Math.random()*W|0;
    let cy=Math.random()*H|0;

    for(let y=-8;y<=8;y++){
        for(let x=-8;x<=8;x++){

            let nx=cx+x;
            let ny=cy+y;

            if(
                nx>=0 &&
                ny>=0 &&
                nx<W &&
                ny<H
            ){
                B[ny][nx]=1;
            }
        }
    }
}

const Da=1.0;
const Db=0.45;
const feed=0.055;
const kill=0.062;

// ---------------- AUDIO ----------------

let audioCtx=null;
let osc=null;
let gain=null;

document
.getElementById("audioBtn")
.onclick=()=>{

    if(audioCtx) return;

    audioCtx=
        new(window.AudioContext||
            window.webkitAudioContext)();

    osc=audioCtx.createOscillator();
    gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=220;

    gain.gain.value=0.03;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
};

function laplace(grid,x,y){

    let sum=0;

    sum+=grid[y][x]*-1;

    const n=[
        [0,-1],[0,1],
        [-1,0],[1,0]
    ];

    for(let d of n){

        let nx=x+d[0];
        let ny=y+d[1];

        if(
            nx>=0 &&
            ny>=0 &&
            nx<W &&
            ny<H
        ){
            sum+=grid[ny][nx]*0.2;
        }
    }

    return sum;
}

function step(){

    let nextA=[];
    let nextB=[];

    let totalEnergy=0;

    for(let y=0;y<H;y++){

        nextA[y]=[];
        nextB[y]=[];

        for(let x=0;x<W;x++){

            let a=A[y][x];
            let b=B[y][x];

            let reaction=
                a*b*b;

            let newA=
                a +
                (Da*laplace(A,x,y)
                - reaction
                + feed*(1-a));

            let newB=
                b +
                (Db*laplace(B,x,y)
                + reaction
                - (kill+feed)*b);

            newA=Math.max(0,
                Math.min(1,newA));

            newB=Math.max(0,
                Math.min(1,newB));

            nextA[y][x]=newA;
            nextB[y][x]=newB;

            totalEnergy+=
                Math.abs(newA-a)+
                Math.abs(newB-b);
        }
    }

    A=nextA;
    B=nextB;

    if(osc){

        let energy=
            totalEnergy/(W*H);

        osc.frequency.value=
            120 +
            energy*12000;

        gain.gain.value=
            Math.min(
                0.08,
                0.01+energy
            );
    }
}

function render(){

    const img=
        ctx.createImageData(W,H);

    for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){

            let a=A[y][x];
            let b=B[y][x];

            let v=a-b;

            let r=
                Math.max(
                    0,
                    Math.min(
                        255,
                        120+v*300
                    )
                );

            let g=
                Math.max(
                    0,
                    Math.min(
                        255,
                        80+b*255
                    )
                );

            let bl=
                Math.max(
                    0,
                    Math.min(
                        255,
                        255-a*255
                    )
                );

            let i=
                (y*W+x)*4;

            img.data[i]=r;
            img.data[i+1]=g;
            img.data[i+2]=bl;
            img.data[i+3]=255;
        }
    }

    ctx.putImageData(img,0,0);
}

function loop(){

    for(let i=0;i<2;i++){
        step();
    }

    render();

    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
