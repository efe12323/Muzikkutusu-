<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS 3D Render AR v7.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root { --jarvis-green: #00ff9f; --jarvis-glow: #00ff41; --dark-bg: #050a05; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--dark-bg); font-family: 'Segoe UI', sans-serif; }
        #input_video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; display: none; transform: scaleX(-1); }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; transform: scaleX(-1); z-index: 5; }
        
        #ui-panel {
            position: absolute; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; justify-content: space-between; padding: 8px;
            background: rgba(0,0,0,0.5); border-bottom: 1px solid var(--jarvis-green);
        }

        .btn-group { display: flex; gap: 5px; }
        .btn {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--jarvis-green);
            color: var(--jarvis-green); padding: 6px 10px; font-size: 10px;
            text-transform: uppercase; border-radius: 4px; font-weight: bold;
        }
        .btn.active { background: var(--jarvis-green); color: #000; box-shadow: 0 0 15px var(--jarvis-glow); }
        .btn.hovering { background: rgba(0, 255, 159, 0.3); transform: scale(1.05); }
    </style>
</head>
<body>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <div id="ui-panel">
        <div class="btn-group">
            <div class="btn active" id="mode-draw">Pen</div>
            <div class="btn" id="mode-cube">Cube</div>
            <div class="btn" id="mode-pyram">Pyram</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btn-render" style="border-color: #ff00ff; color: #ff00ff;">Render</div>
            <div class="btn" id="btn-ar" style="border-color: #00e5ff; color: #00e5ff;">AR: OFF</div>
            <div class="btn" id="btn-undo" style="border-color: #ffb800; color: #ffb800;">Undo</div>
            <div class="btn" id="btn-clear" style="border-color: #ff4b2b; color: #ff4b2b;">Clear</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('input_video');
        
        let currentMode = 'draw', arMode = false, renderMode = false; // renderMode eklendi
        let drawings = [], tempShape = null, startPoint = null;
        let grabbedShape = null, lastGrabPoint = null;
        let lastHoverId = null, hoverStartTime = 0;

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function setMode(mode) {
            if(mode === 'clear') { drawings = []; return; }
            if(mode === 'undo') { drawings.pop(); return; }
            if(mode === 'ar') {
                arMode = !arMode; video.style.display = arMode ? "block" : "none";
                document.getElementById('btn-ar').innerText = arMode ? "AR: ON" : "AR: OFF";
                return;
            }
            if(mode === 'render') { // Render modu toggle
                renderMode = !renderMode;
                document.getElementById('btn-render').classList.toggle('active', renderMode);
                document.getElementById('btn-render').style.background = renderMode ? "#ff00ff" : "rgba(0,0,0,0.8)";
                document.getElementById('btn-render').style.color = renderMode ? "#000" : "#ff00ff";
                return;
            }

            tempShape = null; startPoint = null; currentMode = mode;
            document.querySelectorAll('.btn').forEach(b => {
                if(b.id.startsWith('mode-')) {
                    b.classList.toggle('active', b.id === 'mode-' + mode);
                }
            });
        }

        function onResults(results) {
            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const index = lm[8], thumb = lm[4];
                const x = index.x * canvas.width, y = index.y * canvas.height;
                const tx = thumb.x * canvas.width, ty = thumb.y * canvas.height;

                handleMenuHover(index);

                const isPinching = Math.hypot(x - tx, y - ty) < 45;

                if (isPinching) {
                    tempShape = null;
                    if (!grabbedShape) {
                        for (let i = drawings.length - 1; i >= 0; i--) {
                            if (checkHit(x, y, drawings[i])) { 
                                grabbedShape = drawings[i]; 
                                lastGrabPoint = {x, y}; 
                                break; 
                            }
                        }
                    } else {
                        const dx = x - lastGrabPoint.x, dy = y - lastGrabPoint.y;
                        if (grabbedShape.type === 'draw') {
                            grabbedShape.points.forEach(p => { p.x += dx; p.y += dy; });
                        } else {
                            grabbedShape.start.x += dx; grabbedShape.start.y += dy;
                            grabbedShape.end.x += dx; grabbedShape.end.y += dy;
                        }
                        lastGrabPoint = {x, y};
                    }
                } else {
                    grabbedShape = null;
                    if (index.y < lm[6].y && lm[12].y > lm[10].y && !isPinching) {
                        if (currentMode === 'draw') {
                            if (!tempShape) { tempShape = { type: 'draw', points: [], color: '#00ff9f' }; drawings.push(tempShape); }
                            tempShape.points.push({ x, y });
                        } else {
                            if (!startPoint) startPoint = { x, y };
                            tempShape = { type: currentMode, start: {...startPoint}, end: { x, y }, color: '#00ff9f' };
                        }
                    } else {
                        if (tempShape && currentMode !== 'draw') drawings.push(tempShape);
                        tempShape = null; startPoint = null;
                    }
                }
                drawCyberHand(lm, isPinching);
            }
            renderDrawings();
            ctx.restore();
        }

        function checkHit(x, y, s) {
            const m = 60;
            if (s.type === 'draw') return s.points.some(p => Math.hypot(p.x - x, p.y - y) < m);
            const minX = Math.min(s.start.x, s.end.x) - m, maxX = Math.max(s.start.x, s.end.x) + m;
            const minY = Math.min(s.start.y, s.end.y) - m, maxY = Math.max(s.start.y, s.end.y) + m;
            return x > minX && x < maxX && y > minY && y < maxY;
        }

        function renderDrawings() {
            [...drawings, tempShape].forEach(s => {
                if (!s) return;
                ctx.beginPath();
                ctx.strokeStyle = (s === grabbedShape) ? "#fff" : s.color;
                ctx.lineWidth = (s === grabbedShape) ? 4 : 2;
                ctx.shadowBlur = 10; ctx.shadowColor = s.color;

                if (s.type === 'draw') {
                    ctx.beginPath();
                    s.points.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
                    ctx.stroke();
                } else if (s.type === 'cube') {
                    drawCube(s.start.x, s.start.y, s.end.x - s.start.x, s.end.y - s.start.y, s.color, renderMode);
                } else if (s.type === 'pyram') {
                    drawPyramid(s.start.x, s.start.y, s.end.x - s.start.x, s.end.y - s.start.y, s.color, renderMode);
                }
            });
        }

        // KÜP ÇİZİMİ (RENDER MODUNA GÖRE DOLGULU/TEL KAFES)
        function drawCube(x, y, w, h, color, filled) {
            const d = 25; // Derinlik
            const lightColor = 'rgba(0, 255, 159, 0.4)'; // Yüzey dolgu rengi
            const darkColor = 'rgba(0, 255, 159, 0.2)'; // Daha koyu yüzey

            // Arka Yüz
            if (filled) {
                ctx.fillStyle = darkColor;
                ctx.fillRect(x + d, y - d, w, h);
            }
            ctx.strokeStyle = color;
            ctx.strokeRect(x + d, y - d, w, h);

            // Üst Yüz
            if (filled) {
                ctx.fillStyle = lightColor;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + d, y - d);
                ctx.lineTo(x + d + w, y - d);
                ctx.lineTo(x + w, y);
                ctx.closePath();
                ctx.fill();
            }
            ctx.strokeStyle = color;
            ctx.beginPath(); // Tekrar başla kenarları çizmek için
            ctx.moveTo(x, y);
            ctx.lineTo(x + d, y - d);
            ctx.lineTo(x + d + w, y - d);
            ctx.lineTo(x + w, y);
            ctx.closePath();
            ctx.stroke();

            // Ön Yüz (En son çizilir, üstte görünür)
            if (filled) {
                ctx.fillStyle = lightColor;
                ctx.fillRect(x, y, w, h);
            }
            ctx.strokeStyle = color;
            ctx.strokeRect(x, y, w, h);

            // Bağlantılar (Önü arkaya bağlayan kenarlar)
            ctx.strokeStyle = color;
            ctx.beginPath();
            [[0,0], [w,0], [w,h], [0,h]].forEach(p => {
                ctx.moveTo(x+p[0], y+p[1]);
                ctx.lineTo(x+p[0]+d, y+p[1]-d);
            });
            ctx.stroke();
        }

        // PİRAMİT ÇİZİMİ (RENDER MODUNA GÖRE DOLGULU/TEL KAFES)
        function drawPyramid(x, y, w, h, color, filled) {
            const topX = x + w / 2;
            const topY = y - h;
            const baseWidth = w;
            const baseHeight = 20; // Piramit tabanı için sabit yükseklik
            const lightColor = 'rgba(0, 255, 159, 0.4)';
            const darkColor = 'rgba(0, 255, 159, 0.2)';

            // Taban (Dörtgen bir taban farz edelim)
            const basePoints = [
                {x: x, y: y},
                {x: x + baseWidth, y: y},
                {x: x + baseWidth + 10, y: y - baseHeight}, // Arka sağ köşe
                {x: x + 10, y: y - baseHeight} // Arka sol köşe
            ];

            // Arka taban kenarı (daha koyu)
            if (filled) {
                ctx.fillStyle = darkColor;
                ctx.beginPath();
                ctx.moveTo(basePoints[2].x, basePoints[2].y);
                ctx.lineTo(basePoints[3].x, basePoints[3].y);
                ctx.lineTo(topX, topY);
                ctx.closePath();
                ctx.fill();
            }
            
            // Sağ yüz
            if (filled) {
                ctx.fillStyle = darkColor;
                ctx.beginPath();
                ctx.moveTo(basePoints[1].x, basePoints[1].y);
                ctx.lineTo(basePoints[2].x, basePoints[2].y);
                ctx.lineTo(topX, topY);
                ctx.closePath();
                ctx.fill();
            }

            // Ön taban (daha açık)
            if (filled) {
                ctx.fillStyle = lightColor;
                ctx.beginPath();
                ctx.moveTo(basePoints[0].x, basePoints[0].y);
                ctx.lineTo(basePoints[1].x, basePoints[1].y);
                ctx.lineTo(topX, topY);
                ctx.closePath();
                ctx.fill();
            }

            // Kenarları çiz (Hepsi JARVIS yeşili)
            ctx.strokeStyle = color;
            ctx.beginPath();
            // Taban
            ctx.moveTo(basePoints[0].x, basePoints[0].y);
            ctx.lineTo(basePoints[1].x, basePoints[1].y);
            ctx.lineTo(basePoints[2].x, basePoints[2].y);
            ctx.lineTo(basePoints[3].x, basePoints[3].y);
            ctx.closePath();
            ctx.stroke();

            // Yan kenarlar
            ctx.beginPath();
            ctx.moveTo(topX, topY);
            ctx.lineTo(basePoints[0].x, basePoints[0].y);
            ctx.moveTo(topX, topY);
            ctx.lineTo(basePoints[1].x, basePoints[1].y);
            ctx.moveTo(topX, topY);
            ctx.lineTo(basePoints[2].x, basePoints[2].y);
            ctx.moveTo(topX, topY);
            ctx.lineTo(basePoints[3].x, basePoints[3].y);
            ctx.stroke();
        }


        function handleMenuHover(index) {
            const mx = (1 - index.x) * canvas.width, my = index.y * canvas.height;
            let h = null;
            document.querySelectorAll('.btn').forEach(b => {
                const r = b.getBoundingClientRect();
                if (mx > r.left && mx < r.right && my > r.top && my < r.bottom) h = b;
            });
            if (h) {
                if (lastHoverId === h.id) {
                    if (Date.now() - hoverStartTime > 500) { 
                        setMode(h.id.replace('mode-','').replace('btn-','')); 
                        // Render veya AR basınca aktif kalması için hoverStartTime'ı sıfırla
                        if(h.id === 'btn-ar' || h.id === 'btn-render') hoverStartTime = 0; 
                        else hoverStartTime = Date.now() + 1500; 
                    }
                    h.classList.add('hovering');
                } else { lastHoverId = h.id; hoverStartTime = Date.now(); }
            } else { document.querySelectorAll('.btn').forEach(b => b.classList.remove('hovering')); lastHoverId = null; }
        }

        function drawCyberHand(lm, isPinching) {
            drawConnectors(ctx, lm, HAND_CONNECTIONS, {color: isPinching ? '#ff4b2b' : '#00ff9f', lineWidth: 2});
            [4,8,12,16,20].forEach(i => {
                ctx.fillStyle = isPinching ? '#ff4b2b' : '#ffffff';
                ctx.beginPath(); ctx.arc(lm[i].x * canvas.width, lm[i].y * canvas.height, 5, 0, Math.PI*2); ctx.fill();
            });
        }

        const hands = new Hands({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8, minTrackingConfidence: 0.8 });
        hands.onResults(onResults);
        new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 1280, height: 720 }).start();
    </script>
</body>
</html>
