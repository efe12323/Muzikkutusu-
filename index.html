<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Neon Green Holographic Draw</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        :root {
            --jarvis-green: #00ff9f;
            --jarvis-green-dim: #00cc7a;
            --jarvis-glow: #00ff41;
            --selection-cyan: #00ffff;
            --dark-bg: #0a0f0a;
            --grid: rgba(0, 255, 140, 0.07);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--dark-bg);
            font-family: 'Courier New', monospace;
        }

        #input_video {
            position: absolute;
            visibility: hidden;
            width: 1px;
            height: 1px;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 5;
            transform: scaleX(-1);
            image-rendering: pixelated;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: var(--jarvis-green);
            font-size: 1.4rem;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #111;
            border-top: 4px solid var(--jarvis-green);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <video id="input_video" playsinline></video>
    <canvas id="output_canvas"></canvas>

    <script>
        const video = document.getElementById('input_video');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading-screen');

        let drawings = [];
        let particles = [];
        let currentPath = null;
        let selectedDrawing = null;
        let isDragging = false;
        let lastPos = { x: 0, y: 0 };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = Math.random() * Math.PI * 2;
                const force = Math.random() * 12 + 8;
                this.vx = Math.cos(angle) * force;
                this.vy = Math.sin(angle) * force;
                this.life = 1;
                this.decay = Math.random() * 0.035 + 0.018;
            }

            update() {
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += 0.38;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                if (this.life <= 0) return;
                let g = 255 * this.life;
                let b = 180 * this.life;
                ctx.save();
                ctx.globalAlpha = this.life * 0.9;
                ctx.strokeStyle = `rgb(0,\( {g}, \){b})`;
                ctx.lineWidth = 2.2 * this.life;
                ctx.lineCap = 'round';
                ctx.shadowBlur = 12 * this.life;
                ctx.shadowColor = `rgba(0,255,140,${this.life})`;

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.vx * 1.2, this.y - this.vy * 1.2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function addSparks(x, y, count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push(new Spark(x, y));
            }
        }

        function dist(a, b) {
            return Math.hypot(
                (a.x - b.x) * canvas.width,
                (a.y - b.y) * canvas.height
            );
        }

        function isIndexOnlyUp(lm) {
            const thumbClosed = dist(lm[4], lm[17]) < dist(lm[3], lm[17]) * 1.1;
            const indexUp   = lm[8].y  < lm[6].y;
            const othersDown = lm[12].y > lm[10].y && lm[16].y > lm[14].y && lm[20].y > lm[18].y;
            return indexUp && othersDown && thumbClosed;
        }

        function findDrawingNear(x, y) {
            const radius = 90;
            for (let i = drawings.length - 1; i >= 0; i--) {
                for (let p of drawings[i].points) {
                    if (Math.hypot(x - p.x, y - p.y) < radius) {
                        return drawings[i];
                    }
                }
            }
            return null;
        }

        function drawHoloGrid() {
            const size = 70;
            const t = Date.now() * 0.0004;
            const pulse = Math.sin(t * 2) * 0.015 + 0.07;

            ctx.strokeStyle = `rgba(0, 255, 140, ${pulse})`;
            ctx.lineWidth = 1.1;

            for (let x = 0; x < canvas.width; x += size) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += size) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        function onResults(results) {
            if (loading.style.display !== 'none') loading.style.display = 'none';

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(10,15,10,0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawHoloGrid();
            drawStoredDrawings();
            updateParticles();

            if (results.multiHandLandmarks?.length > 0) {
                const lm = results.multiHandLandmarks[0];
                const tip = lm[8];
                const thumb = lm[4];

                const ix = tip.x   * canvas.width;
                const iy = tip.y   * canvas.height;
                const tx = thumb.x * canvas.width;
                const ty = thumb.y * canvas.height;

                const pinch = dist(lm[4], lm[8]);

                if (isIndexOnlyUp(lm)) {
                    if (!currentPath) {
                        currentPath = { points: [], id: Date.now() };
                        drawings.push(currentPath);
                    }
                    currentPath.points.push({ x: ix, y: iy });
                    addSparks(ix, iy, 4);
                    isDragging = false;
                    selectedDrawing = null;
                }
                else if (pinch < 50) {
                    const mx = (ix + tx) / 2;
                    const my = (iy + ty) / 2;

                    if (!isDragging) {
                        selectedDrawing = findDrawingNear(mx, my);
                        if (selectedDrawing) {
                            isDragging = true;
                            lastPos = { x: mx, y: my };
                        }
                    }

                    if (isDragging && selectedDrawing) {
                        const dx = mx - lastPos.x;
                        const dy = my - lastPos.y;
                        selectedDrawing.points.forEach(p => {
                            p.x += dx;
                            p.y += dy;
                        });
                        lastPos = { x: mx, y: my };
                    }
                    currentPath = null;
                }
                else {
                    currentPath = null;
                    isDragging = false;
                    selectedDrawing = null;
                }

                drawJARVISHand(lm);
            } else {
                currentPath = null;
                isDragging = false;
                selectedDrawing = null;
            }

            ctx.restore();
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function drawStoredDrawings() {
            drawings.forEach(d => {
                if (d.points.length < 2) return;

                const selected = selectedDrawing?.id === d.id;

                ctx.save();

                // Ana holografik gövde - SABİT RENK
                ctx.shadowBlur = selected ? 45 : 28;
                ctx.shadowColor = selected ? '#00ffff' : '#00ff41';
                ctx.strokeStyle = selected ? '#00ffff' : '#00ff9f';
                ctx.globalAlpha = selected ? 1.0 : 0.92;
                ctx.lineWidth = selected ? 7.5 : 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(d.points[0].x, d.points[0].y);
                d.points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.stroke();

                // İç parlak hat - SABİT
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#e0fff0';
                ctx.globalAlpha = selected ? 0.85 : 0.75;
                ctx.lineWidth = selected ? 3 : 2;
                ctx.stroke();

                ctx.restore();
            });
        }

        function drawJARVISHand(lm) {
            const green = '#00ff9f';
            const dim = '#00cc7a';

            ctx.save();
            ctx.shadowBlur = 22;
            ctx.shadowColor = green;
            ctx.strokeStyle = dim;
            ctx.globalAlpha = 0.95;
            ctx.lineWidth = 3.8;

            const conn = [
                [0,1],[1,2],[2,3],[3,4],
                [0,5],[5,6],[6,7],[7,8],
                [5,9],[9,10],[10,11],[11,12],
                [9,13],[13,14],[14,15],[15,16],
                [13,17],[17,18],[18,19],[19,20],
                [0,17]
            ];

            conn.forEach(([a,b]) => {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            });

            // Parmak noktaları - SABİT boyut
            ctx.fillStyle = green;
            lm.forEach(p => {
                const px = p.x * canvas.width;
                const py = p.y * canvas.height;
                const r = 5.5;
                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        const hands = new Hands({
            locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${f}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.88,
            minTrackingConfidence: 0.88
        });

        hands.onResults(onResults);

        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 1280,
            height: 720
        });

        camera.start();
    </script>
</body>
</html>
