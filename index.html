<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Kart Analiz Aracı</title>
    <style>
        :root {
            --bg: #0f0f12;
            --card: #1a1a22;
            --accent: #00ff9d;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #333;
        }
        
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 16px;
        }
        h1 { font-size: 2.2rem; background: linear-gradient(90deg, #00ff9d, #00cc7a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .main-button {
            display: block; width: 100%; max-width: 420px; margin: 40px auto;
            padding: 24px 32px; font-size: 1.5rem; font-weight: 600;
            background: linear-gradient(135deg, #00ff9d, #00cc7a); color: #000;
            border: none; border-radius: 16px; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 255, 157, 0.3);
        }
        
        .main-button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .status { text-align: center; margin: 20px 0; font-size: 1.1rem; padding: 12px; border-radius: 12px; }
        .success { background: #003322; color: #00ff9d; }
        .error { background: #330000; color: #ff6666; }
        
        .log-container {
            background:#0a0a0c; border:1px solid #333; border-radius:12px;
            height: 280px; overflow-y:auto; padding:16px; font-family:monospace;
            font-size:0.95rem; color:#00ff9d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align:center;margin-bottom:8px;">NFC Kart Analiz Aracı</h1>
        <p style="text-align:center;color:#888;">HTTPS üzerinden açtığınızdan emin olun</p>

        <button id="scanButton" class="main-button">📱 NFC KARTINI OKU</button>
        
        <div id="status" class="status" style="display:none;"></div>

        <div id="logContainer" class="log-container"></div>
    </div>

    <script>
        const scanButton = document.getElementById('scanButton');
        const statusDiv = document.getElementById('status');
        const logContainer = document.getElementById('logContainer');

        function addLog(message, type = 'info') {
            const time = new Date().toLocaleTimeString('tr-TR');
            const entry = document.createElement('div');
            entry.innerHTML = `<span style="color:#666">[${time}]</span> ${message}`;
            if (type === 'error') entry.style.color = '#ff6666';
            if (type === 'success') entry.style.color = '#00ff9d';
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        async function startScan() {
            if (!('NDEFReader' in window)) {
                addLog('❌ Bu tarayıcı/cihaz Web NFC desteklemiyor.', 'error');
                statusDiv.textContent = 'Web NFC desteklenmiyor';
                statusDiv.className = 'status error';
                statusDiv.style.display = 'block';
                return;
            }

            try {
                scanButton.disabled = true;
                statusDiv.textContent = '🔄 NFC taraması başlatılıyor...';
                statusDiv.className = 'status success';
                statusDiv.style.display = 'block';

                addLog('NDEFReader başlatılıyor...', 'info');

                const ndef = new NDEFReader();
                
                // İzin + tarama
                await ndef.scan();
                
                addLog('✅ Tarama başarıyla başlatıldı. Kartınızı yaklaştırın!', 'success');
                statusDiv.textContent = '✅ Kart bekleniyor...';

                ndef.onreading = event => {
                    addLog('🎉 Kart okundu! UID: ' + (event.serialNumber || 'Bilinmiyor'), 'success');
                    console.log('NFC Event:', event);
                    statusDiv.textContent = '✅ Kart başarıyla okundu!';
                };

                ndef.onreadingerror = () => {
                    addLog('❌ Kart okunamadı veya desteklenmiyor.', 'error');
                };

            } catch (err) {
                console.error(err);
                let msg = err.message || 'Bilinmeyen hata';
                
                if (err.name === 'NotAllowedError') {
                    msg = 'NFC izni reddedildi veya verilmedi.';
                } else if (err.name === 'NotSupportedError') {
                    msg = 'Cihazınızda NFC donanımı bulunmuyor veya devre dışı.';
                } else if (err.name === 'SecurityError') {
                    msg = 'Güvenli bağlantı (HTTPS) gerekiyor.';
                }
                
                addLog(`❌ Hata: ${msg}`, 'error');
                statusDiv.textContent = 'Hata: ' + msg;
                statusDiv.className = 'status error';
                scanButton.disabled = false;
            }
        }

        // Buton eventi
        scanButton.addEventListener('click', () => {
            startScan();
        });

        // Sayfa yüklendiğinde
        window.onload = () => {
            addLog('🚀 NFC Aracı başlatıldı.', 'success');
            
            if (window.location.protocol !== 'https:' && !window.location.hostname.includes('localhost')) {
                addLog('⚠️ Uyarı: Web NFC sadece HTTPS ile düzgün çalışır!', 'error');
            }
        };
    </script>
</body>
</html>
