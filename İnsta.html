<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sahte Instagram DM</title>
  <style>
    :root {
      --header-bg: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      --bg-light: #fafafa;
      --bg-dark: #121212;
      --sent-light: #dcf8c6;
      --sent-dark: #005c4b;
      --received-light: #ffffff;
      --received-dark: #262626;
      --text-light: #262626;
      --text-dark: #e0e0e0;
      --time-light: #8e8e8e;
      --time-dark: #a8a8a8;
      --seen: #4fc3f7;
    }

    body.light {
      --bg: var(--bg-light);
      --sent: var(--sent-light);
      --received: var(--received-light);
      --text: var(--text-light);
      --time: var(--time-light);
    }

    body.dark {
      --bg: var(--bg-dark);
      --sent: var(--sent-dark);
      --received: var(--received-dark);
      --text: var(--text-dark);
      --time: var(--time-dark);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.4;
    }

    .header {
      background: var(--header-bg);
      color: white;
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .header .back { font-size: 28px; font-weight: 300; }
    .header .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ddd;
      object-fit: cover;
      border: 2px solid white;
    }
    .header .info { flex: 1; }
    .header h3 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }
    .header .status {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 1px;
    }
    .header .call { font-size: 22px; margin-left: 8px; }

    .chat-container {
      min-height: calc(100vh - 54px);
      padding: 12px 10px 80px;
      background: var(--bg);
    }

    .msg {
      max-width: 72%;
      margin: 6px 0 14px;
      padding: 8px 12px 6px;
      border-radius: 18px;
      position: relative;
      font-size: 15.5px;
      background: var(--received);
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      word-wrap: break-word;
    }

    .msg.sent {
      background: var(--sent);
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .msg.received {
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .meta {
      font-size: 11px;
      color: var(--time);
      text-align: right;
      margin-top: 3px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .seen {
      color: var(--seen);
      font-size: 14px;
    }

    .delete-btn {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ed4956;
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: none;
    }

    .msg:hover .delete-btn { display: block; }

    .controls {
      background: rgba(0,0,0,0.04);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      position: sticky;
      bottom: 0;
      z-index: 5;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    body.dark .controls {
      background: rgba(255,255,255,0.05);
      border-top-color: rgba(255,255,255,0.08);
    }

    .controls input, .controls select, .controls button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }

    .controls input[type="text"] { flex: 1; min-width: 140px; }
    .controls button { background: #0095f6; color: white; cursor: pointer; font-weight: 600; }
    .controls .clear { background: #db4437; }

    @media print {
      .controls, .delete-btn { display: none !important; }
    }
  </style>
</head>
<body class="light">

<div class="controls">
  <input type="text" id="name" placeholder="Karşı taraf isim" value="murat_xx">
  <input type="text" id="pp" placeholder="Profil resim URL (isteğe bağlı)">
  <select id="who">
    <option value="received">Karşı taraf</option>
    <option value="sent">Sen</option>
  </select>
  <select id="seen">
    <option value="">zaman</option>
    <option value="seen">✓✓ mavi (görüldü)</option>
  </select>
  <button onclick="addMsg()">Mesaj Ekle</button>
  <button class="clear" onclick="document.getElementById('chat').innerHTML='';">Temizle</button>
  <button onclick="document.body.classList.toggle('dark'); document.body.classList.toggle('light');">Koyu/Açık</button>
</div>

<div class="header">
  <div class="back">←</div>
  <img id="avatar" class="avatar" src="https://via.placeholder.com/80/0095f6/fff?text=IG" alt="">
  <div class="info">
    <h3 id="chatName">murat_xx</h3>
    <div class="status">Çevrimiçi</div>
  </div>
  <div class="call">📞</div>
</div>

<div class="chat-container" id="chat"></div>

<script>
  const chat = document.getElementById('chat');
  const nameEl = document.getElementById('name');
  const ppEl = document.getElementById('pp');

  nameEl.oninput = ppEl.oninput = () => {
    document.getElementById('chatName').textContent = nameEl.value.trim() || 'Kullanıcı';
    document.getElementById('avatar').src = ppEl.value.trim() || 'https://via.placeholder.com/80/0095f6/fff?text=IG';
  };

  function addMsg() {
    const txt = prompt('Mesaj yaz:')?.trim();
    if (!txt) return;

    const who = document.getElementById('who').value;
    const seenVal = document.getElementById('seen').value;

    const now = new Date();
    const time = now.toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});

    const m = document.createElement('div');
    m.className = `msg ${who}`;
    m.innerHTML = txt.replace(/\n/g, '<br>');

    const meta = document.createElement('div');
    meta.className = 'meta';
    let seenIcon = '';
    if (seenVal === 'seen') seenIcon = '<span class="seen">✓✓</span>';
    meta.innerHTML = time + ' ' + seenIcon;

    const del = document.createElement('button');
    del.className = 'delete-btn';
    del.textContent = '×';
    del.onclick = () => m.remove();

    m.appendChild(meta);
    m.appendChild(del);
    chat.appendChild(m);
    chat.scrollTop = chat.scrollHeight;
  }

  nameEl.dispatchEvent(new Event('input'));
</script>
</body>
  </html>
