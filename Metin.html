<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Turbo Sesli Mesajlaşma</title>
<style>
body{background:#0f172a;color:#e5e7eb;font-family:Arial;text-align:center}
textarea{width:85%;height:120px;margin:10px;background:#020617;color:#22c55e;border:1px solid #334155}
button{padding:12px 18px;margin:5px;font-size:15px;background:#1f2937;color:white;border:none;border-radius:8px}
#out{white-space:pre-wrap;border:1px solid #334155;padding:10px;margin-top:10px;min-height:80px}
.ok{color:#22c55e}
.err{color:#ef4444}
</style>
</head>
<body>

<h2>📞 Turbo İnternetsiz Mesajlaşma</h2>

<textarea id="text" placeholder="Mesaj"></textarea><br>
<button onclick="send()">Gönder</button>
<button onclick="requestMic()">🎤 Mikrofonu Aç</button>

<h3>Alınan:</h3>
<div id="out"></div>

<script>
const ctx=new (window.AudioContext||window.webkitAudioContext)();

// 16 frekans = 4 bit
const BASE=700;
const STEP=90;
const SYMBOL=0.09;

function freqOf(n){return BASE+n*STEP}

// metni binarye çevir
function textToBytes(str){
 return new TextEncoder().encode(str);
}

async function play(freq){
 let o=ctx.createOscillator();
 let g=ctx.createGain();
 o.frequency.value=freq;
 g.gain.value=0.3;
 o.connect(g);
 g.connect(ctx.destination);
 o.start();
 await new Promise(r=>setTimeout(r,SYMBOL*1000));
 o.stop();
 await new Promise(r=>setTimeout(r,15));
}

async function send(){
 let bytes=textToBytes("^"+document.getElementById("text").value+"$");

 for(let b of bytes){
   let hi=(b>>4)&15;
   let lo=b&15;
   await play(freqOf(hi));
   await play(freqOf(lo));
 }
}

// ===== ALICI =====
let analyser;

async function requestMic(){
 let stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const src=ctx.createMediaStreamSource(stream);
 analyser=ctx.createAnalyser();
 analyser.fftSize=2048;
 src.connect(analyser);
 listen();
}

let collecting=false;
let byteHalf=null;
let text="";

function listen(){
 let data=new Float32Array(analyser.frequencyBinCount);

 setInterval(()=>{
  analyser.getFloatFrequencyData(data);

  let max=-999,idx=0;
  for(let i=0;i<data.length;i++)
   if(data[i]>max){max=data[i];idx=i;}

  let freq=idx*ctx.sampleRate/analyser.fftSize;
  let val=Math.round((freq-BASE)/STEP);

  if(val<0||val>15)return;

  if(byteHalf===null) byteHalf=val;
  else{
    let b=(byteHalf<<4)|val;
    byteHalf=null;
    let ch=String.fromCharCode(b);

    if(ch==="^"){text="";collecting=true;return;}
    if(ch==="$"){collecting=false;document.getElementById("out").textContent+=text+"\n";return;}

    if(collecting) text+=ch;
  }

 },70);
}
</script>

</body>
</html>
