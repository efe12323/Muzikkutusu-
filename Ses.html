<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Komik Ses Oluşturucu</title>
<style>
body {
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    padding:20px;
}
textarea, select, button {
    width:100%;
    margin-top:10px;
    padding:10px;
    font-size:16px;
}
button {
    cursor:pointer;
    background:#ff9800;
    border:none;
    font-weight:bold;
}
button:hover { opacity:0.8; }
</style>
</head>
<body>

<h2>🎤 Metni Komik Sese Çevir</h2>

<textarea id="text" rows="5" placeholder="Metni buraya yaz..."></textarea>

<select id="voiceSelect"></select>

<select id="effect">
    <option value="normal">Normal</option>
    <option value="funny">Komik Ses</option>
    <option value="church">Church (Kilise Yankısı)</option>
</select>

<button onclick="speak()">🔊 Dinlet</button>
<button onclick="record()">💾 MP3 Olarak İndir</button>

<script>
let voices = [];
const voiceSelect = document.getElementById("voiceSelect");

function loadVoices() {
    voices = speechSynthesis.getVoices();
    voiceSelect.innerHTML = "";
    voices.forEach((voice, i) => {
        if (voice.lang.includes("tr") || voice.lang.includes("en")) {
            let option = document.createElement("option");
            option.value = i;
            option.textContent = voice.name + " (" + voice.lang + ")";
            voiceSelect.appendChild(option);
        }
    });
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function createUtterance() {
    let utter = new SpeechSynthesisUtterance(
        document.getElementById("text").value
    );
    let v = voices[voiceSelect.value];
    utter.voice = v;

    let effect = document.getElementById("effect").value;
    if (effect === "funny") {
        utter.pitch = 2;
        utter.rate = 1.4;
    } else {
        utter.pitch = 1;
        utter.rate = 1;
    }
    return utter;
}

function speak() {
    speechSynthesis.cancel();
    let utter = createUtterance();
    speechSynthesis.speak(utter);
}

async function record() {
    const text = document.getElementById("text").value;
    if (!text) return alert("Metin gir!");

    const audioCtx = new AudioContext();
    const dest = audioCtx.createMediaStreamDestination();
    const recorder = new MediaRecorder(dest.stream);
    let chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "audio/mp3" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "ses.mp3";
        a.click();
    };

    recorder.start();

    let utter = createUtterance();
    const source = audioCtx.createMediaStreamSource(dest.stream);

    let gain = audioCtx.createGain();
    let delay = audioCtx.createDelay();
    delay.delayTime.value = 0.25;

    let effect = document.getElementById("effect").value;
    if (effect === "church") {
        source.connect(delay);
        delay.connect(gain);
    } else {
        source.connect(gain);
    }

    gain.connect(dest);

    speechSynthesis.speak(utter);

    utter.onend = () => recorder.stop();
}
</script>

</body>
</html>
