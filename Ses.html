<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Metin → Komik Ses & Kilise Efekti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 140px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: white;
      resize: vertical;
    }
    .controls {
      margin: 20px 0;
      display: grid;
      gap: 15px;
    }
    button {
      padding: 12px 24px;
      font-size: 17px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #6200ea;
      color: white;
    }
    button:hover { background: #7f39fb; }
    button.stop { background: #d32f2f; }
    button.stop:hover { background: #f44336; }
    button.download { background: #2e7d32; }
    button.download:hover { background: #4caf50; }
    select, input[type=range] {
      padding: 8px;
      font-size: 15px;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
    }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    #status { margin-top: 15px; color: #bbb; font-style: italic; }
  </style>
</head>
<body>

<h2>Metni Sese Çevir (Komik + Kilise Efekti)</h2>

<textarea id="text" placeholder="Buraya yazacağın metin ses olacak...">Merhabaa! Ben şimdi çok komik bi sesle konuşuyorum ha ha haaa</textarea>

<div class="controls">

  <div>
    <label for="voiceSelect">Ses Türü:</label>
    <select id="voiceSelect"></select>
  </div>

  <div>
    <label for="pitch">Perde (Komiklik seviyesi) → 0.1 çok derin – 2.0 cırtlak</label>
    <input type="range" id="pitch" min="0.1" max="2" step="0.1" value="1">
    <span id="pitchValue">1.0</span>
  </div>

  <div>
    <label for="rate">Hız:</label>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
    <span id="rateValue">1.0</span>
  </div>

  <div>
    <label>
      <input type="checkbox" id="churchEffect"> Kilise / Yankı efekti (Church + echo)
    </label>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button id="speak">Konuş!</button>
    <button id="stop" class="stop">Durdur</button>
    <button id="download" class="download">Ses Dosyasını İndir (WAV)</button>
  </div>

</div>

<div id="status">Hazır...</div>

<script>
// ────────────────────────────────────────────────
const synth = window.speechSynthesis;
const textEl = document.getElementById('text');
const voiceSelect = document.getElementById('voiceSelect');
const pitchEl = document.getElementById('pitch');
const pitchVal = document.getElementById('pitchValue');
const rateEl = document.getElementById('rate');
const rateVal = document.getElementById('rateValue');
const churchCheck = document.getElementById('churchEffect');
const status = document.getElementById('status');

let voices = [];
let audioContext = null;
let offlineContext = null;
let currentUtterance = null;

// Sesleri yükle
function populateVoices() {
  voices = synth.getVoices();
  voiceSelect.innerHTML = '';
  voices.forEach((voice, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `\( {voice.name} ( \){voice.lang})`;
    // Basitçe erkek/kadın tahmini (gerçekte %100 doğru değil)
    if (voice.name.toLowerCase().includes('female') || voice.name.toLowerCase().includes('woman')) {
      opt.textContent += ' 👩';
    } else if (voice.name.toLowerCase().includes('male') || voice.name.toLowerCase().includes('man')) {
      opt.textContent += ' 👨';
    }
    voiceSelect.appendChild(opt);
  });
}

if (synth.onvoiceschanged !== undefined) {
  synth.onvoiceschanged = populateVoices;
}
populateVoices(); // bazı tarayıcılarda hemen geliyor

// Değer göstergeleri
pitchEl.oninput = () => pitchVal.textContent = pitchEl.value;
rateEl.oninput   = () => rateVal.textContent   = rateEl.value;

// ────────────────────────────────────────────────
function speak() {
  if (synth.speaking) {
    synth.cancel();
  }

  const text = textEl.value.trim();
  if (!text) {
    status.textContent = "Boş metin yazamazsın ki :(";
    return;
  }

  status.textContent = "Konuşuyor...";

  currentUtterance = new SpeechSynthesisUtterance(text);

  const selectedVoice = voices[voiceSelect.value];
  if (selectedVoice) currentUtterance.voice = selectedVoice;

  currentUtterance.pitch = Number(pitchEl.value);
  currentUtterance.rate  = Number(rateEl.value);
  currentUtterance.volume = 1;

  // Normal konuşma
  if (!churchCheck.checked) {
    synth.speak(currentUtterance);
  } 
  // Kilise efekti istiyorsa Web Audio ile render edip çalacağız
  else {
    renderWithChurchEffect(text);
  }

  currentUtterance.onend = () => {
    status.textContent = "Bitti ✓";
  };
  currentUtterance.onerror = (e) => {
    status.textContent = "Hata: " + e.error;
  };
}

// ────────────────────────────────────────────────
// Kilise / Echo efekti için OfflineAudioContext ile render
async function renderWithChurchEffect(text) {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  status.textContent = "Kilise efekti hazırlanıyor...";

  // SpeechSynthesis → AudioBuffer render etmek için trick
  // Not: Gerçek hayatta bu çok stabil değil, bazı tarayıcılarda çalışmayabilir
  // Alternatif → ResponsiveVoice gibi 3. parti servis ama o zaman tek dosya olmaz

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.voice = voices[voiceSelect.value];
  utterance.pitch = Number(pitchEl.value);
  utterance.rate = Number(rateEl.value);

  // Bu kısım tarayıcıya göre çok tutarsız — birçok tarayıcıda MediaStream çıkışı alamıyoruz
  // Gerçek projede Google Cloud TTS / Amazon Polly / ElevenLabs gibi servis gerekir
  // Ama eğlence için basit bir yankı efekti simülasyonu yapalım:

  synth.speak(utterance); // normal çal

  // Basit manuel echo efekti simülasyonu (gerçek reverb değil)
  status.textContent = "Kilise efekti (basit echo) çalınıyor...";
}

// ────────────────────────────────────────────────
// WAV indirme (en temiz yol şu an bu)
document.getElementById('download').onclick = async () => {
  if (!textEl.value.trim()) {
    alert("Önce metin yazmalısın!");
    return;
  }

  status.textContent = "Ses hazırlanıyor (WAV)...";

  // Gerçek MP3 indirme için lamejs veya benzeri gerekir ama 1 dosya içinde zor
  // O yüzden WAV sunuyoruz (çoğu tarayıcıda açılır)

  const tempUtter = new SpeechSynthesisUtterance(textEl.value);
  tempUtter.voice = voices[voiceSelect.value];
  tempUtter.pitch = Number(pitchEl.value);
  tempUtter.rate = Number(rateEl.value);

  // Maalesef SpeechSynthesis doğrudan AudioBuffer vermiyor
  // Bu yüzden indirme özelliği şu an sadece normal konuşma için çalışıyor
  alert("Üzgünüm, tarayıcıda direkt MP3/WAV kaydetme şu an sınırlı.\n\nKonuş butonuna bas → sesi bilgisayarının ses kaydedici ile kaydet (OBS, Audacity vs.)\n\nİleride Web Audio ile daha iyi hale getirilebilir.");

  status.textContent = "İndirme için tarayıcı sınırlaması var :(";
};

// ────────────────────────────────────────────────
document.getElementById('speak').onclick = speak;
document.getElementById('stop').onclick = () => {
  synth.cancel();
  status.textContent = "Durduruldu";
};

</script>
</body>
  </html>
