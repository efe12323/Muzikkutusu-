<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Metin → Ses (Komik + Kilise) - Düzgün Ses Seçimi</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0ff;
      padding: 20px;
      max-width: 720px;
      margin: auto;
    }
    h2 { color: #a78bfa; }
    textarea {
      width: 100%;
      height: 160px;
      padding: 14px;
      font-size: 17px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #1a1a2e;
      color: #fff;
      resize: vertical;
    }
    .controls {
      margin: 24px 0;
      display: grid;
      gap: 18px;
    }
    button {
      padding: 14px 28px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }
    #speak { background: #6d28d9; }
    #speak:hover { background: #8b5cf6; }
    #stop { background: #dc2626; }
    #stop:hover { background: #ef4444; }
    #download { background: #059669; }
    #download:hover { background: #10b981; }
    select, input[type=range] {
      padding: 10px;
      font-size: 16px;
      background: #1e293b;
      color: #e0e0ff;
      border: 1px solid #4b5563;
      border-radius: 8px;
      width: 100%;
    }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #c4b5fd; }
    #status { margin-top: 16px; color: #a5b4fc; font-style: italic; }
    .flex { display: flex; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>

<h2>Metni Sese Çevir – Erkek / Kadın Seç + Komik Efekt + Kilise</h2>

<textarea id="text" placeholder="Buraya yaz...">Hahaha şimdi çok tiz bi sesle konuşuyorum, dikkat et burnumdan konuşuyorum gibi olacak!</textarea>

<div class="controls">

  <div>
    <label for="voiceSelect">Ses Seç (Erkek / Kadın):</label>
    <select id="voiceSelect">
      <option value="">Sesler yükleniyor... lütfen bekle</option>
    </select>
  </div>

  <div>
    <label for="pitch">Perde (komiklik) → 0.3 derin erkek – 2.0 cırtlak</label>
    <input type="range" id="pitch" min="0.3" max="2" step="0.1" value="1">
    <span id="pitchValue">1.0</span>
  </div>

  <div>
    <label for="rate">Hız:</label>
    <input type="range" id="rate" min="0.6" max="2" step="0.1" value="1">
    <span id="rateValue">1.0</span>
  </div>

  <div>
    <label>
      <input type="checkbox" id="churchEffect"> Kilise yankısı / echo efekti
    </label>
  </div>

  <div class="flex">
    <button id="speak">Konuş!</button>
    <button id="stop">Durdur</button>
    <button id="download">İndir (WAV olarak)</button>
  </div>

</div>

<div id="status">Sesler yükleniyor... (Chrome'da biraz sürebilir)</div>

<script>
const synth = window.speechSynthesis || null;
if (!synth) {
  document.getElementById('status').textContent = "Bu tarayıcıda konuşma özelliği yok 😔";
}

const textEl       = document.getElementById('text');
const voiceSelect  = document.getElementById('voiceSelect');
const pitchEl      = document.getElementById('pitch');
const pitchVal     = document.getElementById('pitchValue');
const rateEl       = document.getElementById('rate');
const rateVal      = document.getElementById('rateValue');
const churchCheck  = document.getElementById('churchEffect');
const status       = document.getElementById('status');

let voices = [];
let selectedVoiceIndex = -1;

function updateVoiceList() {
  voices = synth.getVoices();
  if (voices.length === 0) return;

  voiceSelect.innerHTML = '';
  voices.forEach((voice, index) => {
    const option = document.createElement('option');
    option.value = index;

    let gender = '';
    const nameLower = voice.name.toLowerCase();
    if (nameLower.includes('female') || nameLower.includes('woman') || nameLower.includes('girl') || nameLower.includes('zira') || nameLower.includes('siri')) {
      gender = ' 👩‍🦰 Kadın';
    } else if (nameLower.includes('male') || nameLower.includes('man') || nameLower.includes('boy') || nameLower.includes('david') || nameLower.includes('google uk english male')) {
      gender = ' 👨 Erkek';
    }

    option.textContent = `\( {voice.name} ( \){voice.lang})${gender}`;
    voiceSelect.appendChild(option);
  });

  // Varsayılan olarak ilk Türkçe veya İngilizce sesi seçmeye çalış
  let defIndex = voices.findIndex(v => v.lang.startsWith('tr'));
  if (defIndex === -1) defIndex = voices.findIndex(v => v.lang.startsWith('en'));
  if (defIndex === -1) defIndex = 0;
  voiceSelect.value = defIndex;
  selectedVoiceIndex = defIndex;

  status.textContent = `Sesler yüklendi (${voices.length} adet) ✓`;
}

function loadVoices() {
  if (synth.getVoices().length > 0) {
    updateVoiceList();
  }
}

// Birçok tarayıcıda ilk başta boş döner → event + periyodik kontrol
synth.onvoiceschanged = () => {
  updateVoiceList();
  clearInterval(voiceLoadInterval);
};

const voiceLoadInterval = setInterval(() => {
  loadVoices();
  if (voices.length > 0) clearInterval(voiceLoadInterval);
}, 400);

// İlk yüklemede dene
loadVoices();

// Değer göstergeleri
pitchEl.oninput = () => pitchVal.textContent = pitchEl.value;
rateEl.oninput   = () => rateVal.textContent   = rateEl.value;

function speakNow() {
  if (synth.speaking) synth.cancel();

  const txt = textEl.value.trim();
  if (!txt) {
    status.textContent = "Metin boş, neyi okuyayım ki? 😏";
    return;
  }

  status.textContent = "Konuşuyor...";

  const utterance = new SpeechSynthesisUtterance(txt);

  if (voiceSelect.value !== '' && voices[voiceSelect.value]) {
    utterance.voice = voices[voiceSelect.value];
  }

  utterance.pitch = parseFloat(pitchEl.value);
  utterance.rate  = parseFloat(rateEl.value);
  utterance.volume = 1;

  if (!churchCheck.checked) {
    synth.speak(utterance);
  } else {
    status.textContent = "Kilise efekti tarayıcıda sınırlı → normal + biraz gecikmeli çalıyor";
    synth.speak(utterance); // gerçek reverb için API lazım
  }

  utterance.onend = () => status.textContent = "Bitti 🎤";
  utterance.onerror = (e) => status.textContent = "Hata: " + (e.error || 'bilinmeyen');
}

document.getElementById('speak').onclick = speakNow;

document.getElementById('stop').onclick = () => {
  synth.cancel();
  status.textContent = "Durduruldu 🚫";
};

document.getElementById('download').onclick = () => {
  alert("Tarayıcıda direkt MP3/WAV kaydetme şu an mümkün değil.\n\nÇözüm:\n1) Konuş butonuna bas\n2) Bilgisayarın sesini Audacity, OBS veya telefonun ekran kaydedici ile kaydet\n\nİleride ElevenLabs gibi servislerle tam MP3 indirebiliriz.");
};

</script>
</body>
</html>
