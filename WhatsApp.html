<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sahte WhatsApp Sohbeti Oluştur</title>
  <link href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #e5ddd5;
      color: #111;
      min-height: 100vh;
      padding: 15px;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    .header {
      background: #00a884;
      color: white;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 0 0 8px 8px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header .back { font-size: 24px; cursor: pointer; }
    .header .info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #ddd;
      object-fit: cover;
    }
    .header .name-time h3 { font-size: 17px; }
    .header .name-time p { font-size: 13px; opacity: 0.9; }

    .chat-area {
      background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png') repeat;
      background-size: 100% auto;
      min-height: 70vh;
      padding: 20px 12px;
      border-radius: 8px;
      margin: 10px 0;
      overflow-y: auto;
      max-height: 75vh;
    }

    .message {
      max-width: 80%;
      margin: 6px 0;
      padding: 8px 12px;
      border-radius: 8px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .message.sent {
      background: #d9fdd3;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }
    .message.received {
      background: white;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }
    .time-tick {
      font-size: 11px;
      opacity: 0.6;
      position: absolute;
      bottom: 3px;
      right: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tick { font-size: 14px; }
    .delivered  { color: #666; }
    .read       { color: #4fc3f7; }
    .double     { color: #4fc3f7; }

    .input-area {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .input-area input, .input-area select, .input-area button {
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }
    .input-area input[type="text"] { flex: 1; min-width: 160px; }
    .input-area button {
      background: #00a884;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    .input-area button:hover { background: #008c6e; }
    .msg-type { width: 110px; }
    .clear-btn {
      background: #e74c3c;
      margin-left: auto;
    }
    .clear-btn:hover { background: #c0392b; }

    @media (max-width: 500px) {
      .input-area { flex-direction: column; }
      .input-area input[type="text"] { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="back">←</div>
    <div class="info">
      <img id="pp" src="https://via.placeholder.com/80/25D366/fff?text=+" alt="Profil">
      <div class="name-time">
        <h3 id="chatName">Kişi Adı</h3>
        <p>çevrimiçi</p>
      </div>
    </div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-area">
    <input type="text" id="contactName" placeholder="Kişi adı" value="Ahmet">
    <input type="text" id="profileUrl" placeholder="Profil resmi URL (isteğe bağlı)">
    
    <input type="text" id="messageInput" placeholder="Mesaj yaz...">
    <select id="msgType" class="msg-type">
      <option value="sent">Sen →</option>
      <option value="received">← Karşı taraf</option>
    </select>
    <select id="tickType">
      <option value="">zaman</option>
      <option value="delivered">✓✓ gri</option>
      <option value="sent">✓ gri</option>
      <option value="read">✓✓ mavi</option>
    </select>
    <button onclick="addMessage()">Ekle</button>
    <button class="clear-btn" onclick="clearChat()">Tümünü Sil</button>
  </div>
</div>

<script>
  const chatArea = document.getElementById('chatArea');
  const contactNameInput = document.getElementById('contactName');
  const profileUrlInput   = document.getElementById('profileUrl');
  const msgInput          = document.getElementById('messageInput');
  const msgTypeSelect     = document.getElementById('msgType');
  const tickSelect        = document.getElementById('tickType');

  // Profil resmi ve isim güncelleme (her değişiklikte)
  contactNameInput.addEventListener('input', updateHeader);
  profileUrlInput.addEventListener('input', updateHeader);

  function updateHeader() {
    document.getElementById('chatName').textContent = contactNameInput.value.trim() || "Kişi Adı";
    const url = profileUrlInput.value.trim();
    document.getElementById('pp').src = url || "https://via.placeholder.com/80/25D366/fff?text=+";
  }

  function addMessage() {
    const text = msgInput.value.trim();
    if (!text) return;

    const type = msgTypeSelect.value;
    const tick = tickSelect.value;

    const div = document.createElement('div');
    div.className = `message ${type}`;
    div.innerHTML = text.replace(/\n/g, '<br>');

    const time = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    let tickHtml = '';

    if (tick === 'sent')     tickHtml = '<span class="tick delivered">✓</span>';
    else if (tick === 'delivered') tickHtml = '<span class="tick delivered">✓✓</span>';
    else if (tick === 'read') tickHtml = '<span class="tick double read">✓✓</span>';

    const footer = document.createElement('div');
    footer.className = 'time-tick';
    footer.innerHTML = time + ' ' + tickHtml;

    div.appendChild(footer);
    chatArea.appendChild(div);

    // En alta kaydır
    chatArea.scrollTop = chatArea.scrollHeight;

    // Temizle
    msgInput.value = '';
    msgInput.focus();
  }

  function clearChat() {
    if (confirm("Tüm mesajlar silinecek. Emin misin?")) {
      chatArea.innerHTML = '';
    }
  }

  // Enter tuşu ile ekleme
  msgInput.addEventListener('keypress', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      addMessage();
    }
  });

  // Başlangıçta header'ı güncelle
  updateHeader();
</script>

</body>
</html>
